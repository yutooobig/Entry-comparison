<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAI 提示词管理器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --sidebar-bg: #1e2a3a;
            --sidebar-text: #e0e6ed;
            --primary: #4a6cf7;
            --primary-hover: #3b5de7;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --success: #27ae60;
            --warning: #f39c12;
            --text: #2c3e50;
            --text-secondary: #7f8c8d;
            --border: #e1e5eb;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.15);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 5px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            --header-height: 60px;
            --filter-height: 48px;
            --tag-color-bg: #eef1ff;
            --tag-color-text: #4a6cf7;
            --tag-color-border: #d5dcff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c0c4cc;
            border-radius: 3px;
        }
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .app-header .logo i {
            color: #6c8cff;
            font-size: 22px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: nowrap;
        }
        .header-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            white-space: nowrap;
            font-family: var(--font);
        }
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.35);
        }
        .header-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
        }
        .header-btn.primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        .header-btn.danger {
            background: var(--danger);
            border-color: var(--danger);
        }
        .header-btn.danger:hover {
            background: var(--danger-hover);
            border-color: var(--danger-hover);
        }
        .total-size-display {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #b0b8c4;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 10px;
            border-radius: 20px;
            white-space: nowrap;
            user-select: none;
        }
        .total-size-display i {
            font-size: 11px;
        }
        .filter-bar {
            position: sticky;
            top: var(--header-height);
            z-index: 90;
            background: var(--card-bg);
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            min-height: var(--filter-height);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        .filter-bar .filter-label {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            white-space: nowrap;
        }
        .filter-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }
        .filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #eef1ff;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid #d5dcff;
        }
        .filter-tag i {
            font-size: 10px;
            cursor: pointer;
            opacity: 0.7;
        }
        .clear-filter-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: var(--transition);
            font-family: var(--font);
        }
        .clear-filter-btn:hover {
            color: var(--danger);
            background: #fef0ef;
        }
        .download-actions {
            display: none;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .download-actions.active {
            display: flex;
        }
        .download-actions .btn-sm {
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #f8f9fa;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .download-actions .btn-sm:hover {
            background: #e9ecef;
        }
        .download-actions .btn-sm.primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .weight-filter-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            width: 100%;
            padding-top: 6px;
            border-top: 1px dashed var(--border);
            margin-top: 6px;
        }
        .weight-filter-bar .weight-filter-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .weight-filter-bar .weight-capsule {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f0f2f5;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid #d0d5dd;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }
        .weight-filter-bar .weight-capsule.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .main-content {
            display: flex;
            min-height: calc(100vh - var(--header-height) - var(--filter-height));
        }
        .gallery {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }
        .gallery-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
            color: var(--text-secondary);
            gap: 14px;
            text-align: center;
            padding: 20px;
        }
        .gallery-empty i {
            font-size: 60px;
            opacity: 0.4;
        }
        .image-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
        }
        .image-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }
        .image-card.selected {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.2);
        }
        .image-card .thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            background: #f0f0f0;
            flex-shrink: 0;
        }
        .image-card .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .image-card:hover .thumb-wrapper img {
            transform: scale(1.04);
        }
        .image-card .select-checkbox {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
            z-index: 5;
            display: none;
        }
        .image-card .select-checkbox.show {
            display: block;
        }
        .image-card .card-info {
            padding: 10px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .image-card .card-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .image-card .card-prompt-preview {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-all;
        }
        .image-card .card-actions {
            display: flex;
            gap: 4px;
            padding: 6px 8px;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
        }
        .card-action-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            padding: 5px 8px;
            cursor: pointer;
            font-size: 11px;
            color: var(--text-secondary);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 3px;
            font-family: var(--font);
            flex: 1;
            justify-content: center;
        }
        .card-action-btn:hover {
            background: #f5f6fa;
            color: var(--text);
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 400;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            backdrop-filter: blur(3px);
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 1;
        }
        .modal-header h3 {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }
        .modal-close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: var(--transition);
        }
        .modal-close-btn:hover {
            background: #f0f0f0;
            color: var(--text);
        }
        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-image-container {
            width: 100%;
            max-height: 320px;
            display: flex;
            justify-content: center;
            background: #f8f9fa;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .modal-image-container img {
            max-width: 100%;
            max-height: 320px;
            object-fit: contain;
        }
        .modal-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .modal-section .section-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .prompt-text {
            background: #f8f9fa;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            line-height: 1.6;
            word-break: break-all;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            border: 1px solid #e8e8e8;
        }
        .prompt-text.negative {
            border-left: 3px solid var(--danger);
        }
        .prompt-text.positive {
            border-left: 3px solid var(--success);
        }
        .copy-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .copy-btn {
            background: #f0f2f5;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
            font-family: var(--font);
            color: var(--text);
        }
        .copy-btn:hover {
            background: #e4e7eb;
        }
        .params-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
        }
        .param-item {
            background: #f8f9fa;
            padding: 8px 10px;
            border-radius: var(--radius-xs);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            border: 1px solid #e8e8e8;
        }
        .param-item .param-key {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .param-item .param-value {
            font-weight: 500;
            word-break: break-all;
        }
        .token-sidebar {
            position: fixed;
            top: 0;
            right: -440px;
            width: 420px;
            max-width: 95vw;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
            z-index: 300;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        .token-sidebar.active {
            right: 0;
        }
        .token-sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--sidebar-bg);
            color: #fff;
        }
        .token-sidebar-header h3 {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .token-sidebar-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: var(--transition);
        }
        .token-tabs {
            display: flex;
            gap: 4px;
            padding: 10px 16px;
            background: #f8f9fa;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .token-tab {
            padding: 7px 14px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: var(--transition);
            font-family: var(--font);
            background: transparent;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .token-tab.active {
            background: var(--primary);
            color: #fff;
        }
        .token-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .token-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            gap: 8px;
            flex-wrap: wrap;
        }
        .token-item:hover {
            background: #eef1ff;
            border-color: #d5dcff;
        }
        .token-item .token-name {
            font-size: 12px;
            font-weight: 500;
            word-break: break-all;
            flex: 1;
            line-height: 1.3;
            cursor: pointer;
            min-width: 60px;
        }
        .token-item .token-translation {
            font-size: 10px;
            color: var(--text-secondary);
            font-style: italic;
            word-break: break-all;
            flex-basis: 100%;
            margin-top: -4px;
            padding-left: 2px;
            display: none;
        }
        .token-item .token-translation.show {
            display: block;
        }
        .token-item .token-count {
            font-size: 11px;
            color: var(--text-secondary);
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .token-item .token-count.pos {
            background: #d4edda;
            color: #155724;
        }
        .token-item .token-count.neg {
            background: #f8d7da;
            color: #721c24;
        }
        .token-item .filter-token-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            padding: 4px;
            border-radius: 4px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .token-item .tag-badge {
            display: inline-flex;
            align-items: center;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: 500;
            flex-shrink: 0;
            cursor: pointer;
            transition: var(--transition);
        }
        .token-item .token-checkbox {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
            display: none;
        }
        .token-item .token-checkbox.show {
            display: block;
        }
        .token-item .token-action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            padding: 4px;
            border-radius: 4px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .token-item .token-action-btn:hover {
            background: #e9ecef;
        }
        .token-item .token-action-btn.tag-btn:hover {
            color: var(--warning);
            background: #fff8e1;
        }
        .token-item .token-action-btn.block-btn:hover {
            color: var(--danger);
            background: #fdf0ef;
        }
        .token-item .token-action-btn.block-btn.blocked {
            color: var(--danger);
            background: #fdf0ef;
        }
        .token-item .token-action-btn.tag-btn.has-tag {
            color: var(--warning);
        }
        .token-item .token-action-btn.translate-btn:hover {
            color: var(--primary);
            background: #eef1ff;
        }
        .token-search {
            padding: 10px 16px;
            flex-shrink: 0;
            position: relative;
        }
        .token-search input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: var(--font);
            outline: none;
            transition: var(--transition);
            background: #f8f9fa;
        }
        .token-search input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.1);
        }
        .token-search i {
            position: absolute;
            left: 26px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 13px;
        }
        .tag-filter-bar {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            -webkit-overflow-scrolling: touch;
        }
        .tag-filter-capsule {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #f0f2f5;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid #d0d5dd;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tag-filter-capsule.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .token-toolbar {
            display: flex;
            gap: 6px;
            padding: 6px 12px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: #fafbfc;
            flex-wrap: wrap;
        }

<body>
