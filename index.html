    <script>
        (function() {
            // ===== 数据存储 =====
            const STORAGE_KEY = 'nai_prompt_manager_data';
            let data = {
                images: [],
                tags: [],
                blockedTags: [],
                tokenTranslations: {},
                blockedTokens: {}, // { tokenName: { method: 'manual'|'tag'|'batch', reason: '标签名' } }
                batchBlockedTokens: {}
            };

            function loadData() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        data = Object.assign(data, parsed);
                        if (!data.tokenTranslations) data.tokenTranslations = {};
                        if (!data.blockedTokens) data.blockedTokens = {};
                        if (!data.batchBlockedTokens) data.batchBlockedTokens = {};
                        if (!data.blockedTags) data.blockedTags = [];
                    }
                } catch (e) { console.error('加载数据失败', e); }
            }

            function saveData() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                    updateTotalSize();
                } catch (e) { console.error('保存失败', e); }
            }

            function updateTotalSize() {
                try {
                    const str = localStorage.getItem(STORAGE_KEY) || '';
                    const bytes = new Blob([str]).size;
                    const kb = (bytes / 1024).toFixed(1);
                    document.getElementById('totalSizeDisplay').querySelector('span').textContent = kb + ' KB';
                } catch (e) {}
            }

            // ===== 状态 =====
            let selectedImages = new Set();
            let currentFilterTags = [];
            let currentWeightFilter = null;
            let currentPage = 1;
            let pageSize = 24;
            let tokenTab = 'positive';
            let tokenSearchQuery = '';
            let tokenFilterTag = null;
            let batchMode = false;
            let selectedTokens = new Set();
            let showTranslations = true;
            let exportTarget = 'positive'; // 'positive' | 'negative'

            // ===== DOM引用 =====
            const galleryGrid = document.getElementById('galleryGrid');
            const filterTagsEl = document.getElementById('filterTags');
            const clearFilterBtn = document.getElementById('clearFilterBtn');
            const downloadActions = document.getElementById('downloadActions');
            const paginationBar = document.getElementById('paginationBar');
            const pageInfo = document.getElementById('pageInfo');
            const pageSizeSelect = document.getElementById('pageSizeSelect');
            const btnPrevPage = document.getElementById('btnPrevPage');
            const btnNextPage = document.getElementById('btnNextPage');
            const tokenSidebar = document.getElementById('tokenSidebar');
            const tokenList = document.getElementById('tokenList');
            const tokenTabs = document.getElementById('tokenTabs');
            const tokenSearchInput = document.getElementById('tokenSearchInput');
            const tagFilterBar = document.getElementById('tagFilterBar');
            const tokenToolbar = document.getElementById('tokenToolbar');
            const batchActionBar = document.getElementById('batchActionBar');
            const batchSelectedCount = document.getElementById('batchSelectedCount');
            const detailModal = document.getElementById('detailModal');
            const modalBody = document.getElementById('modalBody');
            const modalTitle = document.getElementById('modalTitle');

            // ===== 工具函数 =====
            function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

            function showToast(msg, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info';
                toast.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + msg;
                container.appendChild(toast);
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 2500);
            }

            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板', 'success')).catch(() => {
                        fallbackCopy(text);
                    });
                } else { fallbackCopy(text); }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy');
                    showToast('已复制到剪贴板', 'success'); } catch (e) { showToast('复制失败', 'error'); }
                ta.remove();
            }

            function downloadTextFile(content, filename) {
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }

            function parsePrompt(prompt) {
                if (!prompt) return [];
                return prompt.split(',').map(s => s.trim()).filter(s => s.length > 0);
            }

            function extractTokensFromPrompt(prompt) {
                const tokens = parsePrompt(prompt);
                const cleaned = [];
                for (let t of tokens) {
                    let name = t.replace(/^[\(\[]+|[\)\]]+$/g, '').trim();
                    const weightMatch = name.match(/^(.+?):([\d.]+)$/);
                    if (weightMatch) { name = weightMatch[1].trim(); }
                    name = name.replace(/[{}()[\]]/g, '').trim();
                    if (name.length > 0) cleaned.push(name);
                }
                return cleaned;
            }

            function getAllTokensFromData() {
                const posTokens = {};
                const negTokens = {};
                const allTokens = new Map();
                data.images.forEach(img => {
                    const posList = extractTokensFromPrompt(img.positivePrompt);
                    const negList = extractTokensFromPrompt(img.negativePrompt);
                    posList.forEach(t => {
                        if (!allTokens.has(t)) allTokens.set(t, { name: t, posCount: 0, negCount: 0 });
                        allTokens.get(t).posCount++;
                    });
                    negList.forEach(t => {
                        if (!allTokens.has(t)) allTokens.set(t, { name: t, posCount: 0, negCount: 0 });
                        allTokens.get(t).negCount++;
                    });
                });
                return allTokens;
            }

            function getBlockMethod(tokenName) {
                // 返回该词条的屏蔽方式，如果没有被屏蔽则返回null
                if (data.blockedTokens[tokenName]) {
                    return data.blockedTokens[tokenName].method || 'manual';
                }
                // 检查标签屏蔽
                for (const tag of data.blockedTags) {
                    const tokensWithTag = getTokensWithTag(tag);
                    if (tokensWithTag.includes(tokenName)) {
                        return 'tag';
                    }
                }
                // 检查批量屏蔽
                if (data.batchBlockedTokens[tokenName]) {
                    return 'batch';
                }
                return null;
            }

            function getBlockReason(tokenName) {
                const method = getBlockMethod(tokenName);
                if (!method) return null;
                if (method === 'manual') return '手动屏蔽';
                if (method === 'batch') return '批量屏蔽';
                if (method === 'tag') {
                    for (const tag of data.blockedTags) {
                        const tokensWithTag = getTokensWithTag(tag);
                        if (tokensWithTag.includes(tokenName)) return '标签屏蔽: ' + tag;
                    }
                    return '标签屏蔽';
                }
                return method;
            }

            function getTokensWithTag(tag) {
                const result = [];
                data.images.forEach(img => {
                    const posTokens = extractTokensFromPrompt(img.positivePrompt);
                    const negTokens = extractTokensFromPrompt(img.negativePrompt);
                    posTokens.forEach(t => {
                        const tags = data.tokenTranslations[t]?.tags || [];
                        if (tags.includes(tag) && !result.includes(t)) result.push(t);
                    });
                    negTokens.forEach(t => {
                        const tags = data.tokenTranslations[t]?.tags || [];
                        if (tags.includes(tag) && !result.includes(t)) result.push(t);
                    });
                });
                return result;
            }

            function getTokenTranslation(tokenName) {
                return data.tokenTranslations[tokenName]?.translation || '';
            }

            function getTokenTags(tokenName) {
                return data.tokenTranslations[tokenName]?.tags || [];
            }

            function isTokenBlocked(tokenName) {
                return getBlockMethod(tokenName) !== null;
            }

            function isTagBlocked(tag) {
                return data.blockedTags.includes(tag);
            }

            // ===== 渲染图库 =====
            function renderGallery() {
                let filtered = [...data.images];
                // 标签筛选
                if (currentFilterTags.length > 0) {
                    filtered = filtered.filter(img => {
                        return currentFilterTags.every(tag => {
                            const allTokens = [
                                ...extractTokensFromPrompt(img.positivePrompt),
                                ...extractTokensFromPrompt(img.negativePrompt)
                            ];
                            return allTokens.some(t => getTokenTags(t).includes(tag));
                        });
                    });
                }
                // 权重筛选
                if (currentWeightFilter) {
                    filtered = filtered.filter(img => {
                        const allTokens = [
                            ...extractTokensFromPrompt(img.positivePrompt),
                            ...extractTokensFromPrompt(img.negativePrompt)
                        ];
                        // 权重筛选基于词条在某张图中的权重
                        const promptText = img.positivePrompt + ' ' + img.negativePrompt;
                        const tokens = parsePrompt(promptText);
                        for (const t of tokens) {
                            const wMatch = t.match(/[\(\[]+(.+?)[\)\]]*:([\d.]+)/);
                            if (wMatch) {
                                const w = parseFloat(wMatch[2]);
                                if (currentWeightFilter === 'high' && w > 1.1) return true;
                                if (currentWeightFilter === 'medium' && w >= 0.8 && w <= 1.1) return true;
                                if (currentWeightFilter === 'low' && w < 0.8) return true;
                            }
                        }
                        return false;
                    });
                }

                const totalPages = pageSize > 0 ? Math.max(1, Math.ceil(filtered.length / pageSize)) : 1;
                if (currentPage > totalPages) currentPage = totalPages;
                const start = pageSize > 0 ? (currentPage - 1) * pageSize : 0;
                const end = pageSize > 0 ? Math.min(start + pageSize, filtered.length) : filtered.length;
                const pageItems = filtered.slice(start, end);

                if (pageItems.length === 0) {
                    galleryGrid.innerHTML = `<div class="gallery-empty"><i class="fa-solid fa-images"></i><p>暂无图片，点击上方"上传"按钮添加图片</p></div>`;
                } else {
                    galleryGrid.innerHTML = pageItems.map(img => {
                        const posPreview = (img.positivePrompt || '').slice(0, 80);
                        return `
                            <div class="image-card ${selectedImages.has(img.id) ? 'selected' : ''}" data-id="${img.id}">
                                <div class="thumb-wrapper">
                                    <img src="${img.dataUrl}" alt="${img.name}" loading="lazy">
                                    <input type="checkbox" class="select-checkbox ${selectedImages.size > 0 ? 'show' : ''}" ${selectedImages.has(img.id) ? 'checked' : ''} data-id="${img.id}">
                                </div>
                                <div class="card-info">
                                    <div class="card-name" title="${img.name}">${img.name}</div>
                                    <div class="card-prompt-preview">${posPreview || '无提示词'}</div>
                                </div>
                                <div class="card-actions">
                                    <button class="card-action-btn copy-pos" data-id="${img.id}" title="复制正向提示词"><i class="fa-solid fa-plus"></i>正向</button>
                                    <button class="card-action-btn copy-neg" data-id="${img.id}" title="复制负向提示词"><i class="fa-solid fa-minus"></i>负向</button>
                                    <button class="card-action-btn delete-btn" data-id="${img.id}" title="删除"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // 分页
                if (filtered.length > 0) {
                    paginationBar.style.display = 'flex';
                    pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页 (共 ${filtered.length} 张)`;
                    btnPrevPage.disabled = currentPage <= 1;
                    btnNextPage.disabled = currentPage >= totalPages;
                } else {
                    paginationBar.style.display = 'none';
                }
                updateDownloadActions();
                updateFilterTags();
                updateWeightFilterBar();
            }

            function updateFilterTags() {
                const allTags = getAllTags();
                filterTagsEl.innerHTML = allTags.map(tag => {
                    const active = currentFilterTags.includes(tag);
                    return `<span class="filter-tag ${active ? 'active' : ''}" data-tag="${tag}" style="${active ? 'background:var(--primary);color:#fff;border-color:var(--primary);' : ''}">
                        ${tag} <i class="fa-solid fa-xmark" data-tag="${tag}" style="${active ? 'color:#fff' : ''}"></i>
                    </span>`;
                }).join('');
                clearFilterBtn.style.display = currentFilterTags.length > 0 ? 'flex' : 'none';
            }

            function updateWeightFilterBar() {
                const bar = document.getElementById('weightFilterBar');
                const weights = [
                    { key: null, label: '全部' },
                    { key: 'high', label: '高权重(>1.1)' },
                    { key: 'medium', label: '中权重(0.8-1.1)' },
                    { key: 'low', label: '低权重(<0.8)' }
                ];
                bar.innerHTML = weights.map(w => {
                    const active = currentWeightFilter === w.key;
                    return `<span class="weight-capsule ${active ? 'active' : ''}" data-weight="${w.key || ''}">${w.label}</span>`;
                }).join('');
            }

            function updateDownloadActions() {
                if (selectedImages.size > 0) {
                    downloadActions.classList.add('active');
                } else {
                    downloadActions.classList.remove('active');
                }
            }

            function getAllTags() {
                const tagSet = new Set();
                data.images.forEach(img => {
                    const allTokens = [
                        ...extractTokensFromPrompt(img.positivePrompt),
                        ...extractTokensFromPrompt(img.negativePrompt)
                    ];
                    allTokens.forEach(t => {
                        getTokenTags(t).forEach(tag => tagSet.add(tag));
                    });
                });
                data.tags.forEach(t => tagSet.add(t));
                return [...tagSet];
            }

            // ===== 渲染词条侧边栏 =====
            function renderTokenList() {
                const allTokensMap = getAllTokensFromData();
                let tokens = [];
                allTokensMap.forEach((v, name) => {
                    tokens.push({
                        name: name,
                        posCount: v.posCount,
                        negCount: v.negCount,
                        translation: getTokenTranslation(name),
                        tags: getTokenTags(name),
                        isBlocked: isTokenBlocked(name),
                        blockMethod: getBlockMethod(name),
                        blockReason: getBlockReason(name)
                    });
                });

                // 筛选
                if (tokenTab === 'positive') {
                    tokens = tokens.filter(t => t.posCount > 0 && !t.isBlocked);
                } else if (tokenTab === 'negative') {
                    tokens = tokens.filter(t => t.negCount > 0 && !t.isBlocked);
                } else if (tokenTab === 'blocked') {
                    tokens = tokens.filter(t => t.isBlocked);
                } else {
                    tokens = tokens.filter(t => !t.isBlocked);
                }

                if (tokenSearchQuery) {
                    const q = tokenSearchQuery.toLowerCase();
                    tokens = tokens.filter(t => t.name.toLowerCase().includes(q) || (t.translation && t.translation.toLowerCase().includes(q)));
                }
                if (tokenFilterTag) {
                    tokens = tokens.filter(t => t.tags.includes(tokenFilterTag));
                }

                // 排序
                tokens.sort((a, b) => {
                    if (tokenTab === 'negative') return b.negCount - a.negCount;
                    if (tokenTab === 'positive') return b.posCount - a.posCount;
                    return (b.posCount + b.negCount) - (a.posCount + a.negCount);
                });

                if (tokenTab === 'blocked') {
                    renderBlockedTokens(tokens);
                } else {
                    renderNormalTokens(tokens);
                }
                renderTagFilterBar();
                updateBatchBar();
            }

            function renderNormalTokens(tokens) {
                if (tokens.length === 0) {
                    tokenList.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;">暂无词条</div>';
                    return;
                }
                tokenList.innerHTML = tokens.map(t => {
                    const count = t.posCount + t.negCount;
                    const countClass = t.posCount > 0 && t.negCount === 0 ? 'pos' : t.negCount > 0 && t.posCount === 0 ? 'neg' : '';
                    const tagsHtml = t.tags.map(tag => {
                        const isBlocked = isTagBlocked(tag);
                        return `<span class="tag-badge" data-tag="${tag}" style="background:${isBlocked ? '#fdf0ef' : '#eef1ff'};color:${isBlocked ? 'var(--danger)' : 'var(--primary)'};border:1px solid ${isBlocked ? '#f5c6cb' : '#d5dcff'};" title="${isBlocked ? '该标签已屏蔽' : '点击筛选此标签'}">${tag}</span>`;
                    }).join('');
                    const translationHtml = t.translation ? `<span class="token-translation show" style="color:var(--text-secondary);font-style:italic;">${t.translation}</span>` : '';
                    return `
                        <div class="token-item" data-token="${t.name}">
                            <input type="checkbox" class="token-checkbox ${batchMode ? 'show' : ''}" data-token="${t.name}" ${selectedTokens.has(t.name) ? 'checked' : ''}>
                            <span class="token-name" title="点击复制">${t.name}</span>
                            ${translationHtml}
                            ${tagsHtml}
                            <span class="token-count ${countClass}">${count}</span>
                            <button class="token-action-btn translate-btn" data-token="${t.name}" title="编辑翻译"><i class="fa-solid fa-language"></i></button>
                            <button class="token-action-btn tag-btn ${t.tags.length > 0 ? 'has-tag' : ''}" data-token="${t.name}" title="打标签"><i class="fa-solid fa-tag"></i></button>
                            <button class="token-action-btn block-btn" data-token="${t.name}" title="屏蔽此词条"><i class="fa-solid fa-ban"></i></button>
                        </div>
                    `;
                }).join('');
            }

            function renderBlockedTokens(tokens) {
                if (tokens.length === 0) {
                    tokenList.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;">没有被屏蔽的词条</div>';
                    return;
                }
                // 按屏蔽方式分组
                const groups = {
                    manual: { label: '手动屏蔽', icon: 'fa-hand', tokens: [] },
                    tag: { label: '标签屏蔽', icon: 'fa-tag', tokens: [] },
                    batch: { label: '批量屏蔽', icon: 'fa-check-double', tokens: [] }
                };
                tokens.forEach(t => {
                    const method = t.blockMethod || 'manual';
                    if (groups[method]) groups[method].tokens.push(t);
                });
                let html = '';
                Object.keys(groups).forEach(key => {
                    const g = groups[key];
                    if (g.tokens.length === 0) return;
                    const groupId = 'block-group-' + key;
                    html += `
                        <div class="block-group-header" data-group="${key}">
                            <span class="group-name"><i class="fa-solid ${g.icon}"></i> ${g.label} (${g.tokens.length})</span>
                            <span class="group-actions">
                                <button class="group-action-btn group-copy" data-group="${key}" title="复制该组词条"><i class="fa-solid fa-copy"></i>复制</button>
                                <button class="group-action-btn group-diff" data-group="${key}" title="对比该组词条"><i class="fa-solid fa-code-compare"></i>对比</button>
                                <button class="group-action-btn group-unblock" data-group="${key}" title="批量取消屏蔽"><i class="fa-solid fa-check"></i>取消屏蔽</button>
                                <button class="group-action-btn group-toggle" data-group="${key}" title="展开/收起"><i class="fa-solid fa-chevron-down"></i></button>
                            </span>
                        </div>
                        <div class="block-group-content ${key === 'manual' ? 'open' : ''}" id="${groupId}">
                            ${g.tokens.map(t => {
                                const count = t.posCount + t.negCount;
                                const tagsHtml = t.tags.map(tag => `<span class="tag-badge" style="background:#eef1ff;color:var(--primary);">${tag}</span>`).join('');
                                const translationHtml = t.translation ? `<span class="token-translation show" style="color:var(--text-secondary);font-style:italic;">${t.translation}</span>` : '';
                                return `
                                    <div class="token-item" data-token="${t.name}" style="padding:5px 8px;">
                                        <span class="token-name">${t.name}</span>
                                        ${translationHtml}
                                        ${tagsHtml}
                                        <span class="token-count">${count}</span>
                                        <button class="token-action-btn unblock-btn" data-token="${t.name}" title="取消屏蔽"><i class="fa-solid fa-check"></i></button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                });
                tokenList.innerHTML = html || '<div style="text-align:center;padding:30px;">暂无屏蔽词条</div>';
            }

            function renderTagFilterBar() {
                const allTags = getAllTags();
                const filteredTags = allTags.filter(tag => {
                    const tokensWithTag = getTokensWithTag(tag);
                    return tokensWithTag.length > 0;
                });
                tagFilterBar.innerHTML = filteredTags.map(tag => {
                    const active = tokenFilterTag === tag;
                    return `<span class="tag-filter-capsule ${active ? 'active' : ''}" data-tag="${tag}">${tag}</span>`;
                }).join('');
            }

            function updateBatchBar() {
                if (batchMode) {
                    batchActionBar.classList.add('active');
                    batchSelectedCount.textContent = `已选 ${selectedTokens.size} 项`;
                } else {
                    batchActionBar.classList.remove('active');
                }
            }

            // ===== 事件处理 =====
            // 上传
            document.getElementById('btnUpload').addEventListener('click', () => {
                document.getElementById('fileInput').click();
            });
            document.getElementById('fileInput').addEventListener('change', (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;
                let loaded = 0;
                Array.from(files).forEach(file => {
                    if (!file.type.startsWith('image/')) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        data.images.push({
                            id: generateId(),
                            name: file.name,
                            dataUrl: ev.target.result,
                            positivePrompt: '',
                            negativePrompt: '',
                            params: {}
                        });
                        loaded++;
                        if (loaded === files.length) { saveData();
                            renderGallery();
                            showToast(`成功上传 ${loaded} 张图片`, 'success'); }
                    };
                    reader.readAsDataURL(file);
                });
                e.target.value = '';
            });

            // 导出全部
            document.getElementById('btnExportAll').addEventListener('click', () => {
                if (data.images.length === 0) { showToast('没有图片可导出', 'error'); return; }
                const exportData = JSON.stringify(data, null, 2);
                downloadTextFile(exportData, 'nai_prompt_manager_export.json');
                showToast('导出成功', 'success');
            });

            // 清空
            document.getElementById('btnClearAll').addEventListener('click', () => {
                if (data.images.length === 0) { showToast('没有数据', 'info'); return; }
                if (confirm('确定要清空所有数据吗？此操作不可撤销！')) {
                    data.images = [];
                    data.tags = [];
                    data.blockedTags = [];
                    data.tokenTranslations = {};
                    data.blockedTokens = {};
                    data.batchBlockedTokens = {};
                    selectedImages.clear();
                    currentFilterTags = [];
                    saveData();
                    renderGallery();
                    showToast('已清空', 'success');
                }
            });

            // 词条管理
            document.getElementById('btnTokens').addEventListener('click', () => {
                tokenSidebar.classList.add('active');
                renderTokenList();
            });
            document.getElementById('tokenSidebarClose').addEventListener('click', () => {
                tokenSidebar.classList.remove('active');
            });

            // 分页
            pageSizeSelect.addEventListener('change', () => {
                pageSize = parseInt(pageSizeSelect.value);
                currentPage = 1;
                renderGallery();
            });
            btnPrevPage.addEventListener('click', () => {
                if (currentPage > 1) { currentPage--;
                    renderGallery(); }
            });
            btnNextPage.addEventListener('click', () => {
                currentPage++;
                renderGallery();
            });

            // 图库点击事件（委托）
            galleryGrid.addEventListener('click', (e) => {
                const card = e.target.closest('.image-card');
                if (!card) return;
                const id = card.dataset.id;
                const img = data.images.find(i => i.id === id);
                if (!img) return;
                if (e.target.closest('.copy-pos')) {
                    copyToClipboard(img.positivePrompt || '');
                    return;
                }
                if (e.target.closest('.copy-neg')) {
                    copyToClipboard(img.negativePrompt || '');
                    return;
                }
                if (e.target.closest('.delete-btn')) {
                    if (confirm('删除此图片？')) {
                        data.images = data.images.filter(i => i.id !== id);
                        selectedImages.delete(id);
                        saveData();
                        renderGallery();
                        showToast('已删除', 'success');
                    }
                    return;
                }
                if (e.target.closest('.select-checkbox')) {
                    const cb = e.target.closest('.select-checkbox');
                    if (cb.checked) selectedImages.add(id);
                    else selectedImages.delete(id);
                    updateDownloadActions();
                    renderGallery();
                    return;
                }
                // 打开详情
                showImageDetail(img);
            });

            // 图库选中模式
            document.getElementById('btnDownloadSelected').addEventListener('click', () => {
                if (selectedImages.size === 0) { showToast('请先选择图片', 'error'); return; }
                const selected = data.images.filter(i => selectedImages.has(i.id));
                const exportData = { images: selected, tags: data.tags, blockedTags: data.blockedTags, tokenTranslations: data.tokenTranslations, blockedTokens: data.blockedTokens, batchBlockedTokens: data.batchBlockedTokens };
                downloadTextFile(JSON.stringify(exportData, null, 2), 'nai_selected_export.json');
                showToast('导出选中成功', 'success');
            });
            document.getElementById('btnDeleteSelected').addEventListener('click', () => {
                if (selectedImages.size === 0) { showToast('请先选择图片', 'error'); return; }
                if (confirm(`删除选中的 ${selectedImages.size} 张图片？`)) {
                    data.images = data.images.filter(i => !selectedImages.has(i.id));
                    selectedImages.clear();
                    saveData();
                    renderGallery();
                    showToast('已删除', 'success');
                }
            });
            document.getElementById('btnCancelSelect').addEventListener('click', () => {
                selectedImages.clear();
                renderGallery();
            });

            // 筛选标签点击
            filterTagsEl.addEventListener('click', (e) => {
                const tag = e.target.dataset.tag;
                if (!tag) return;
                const idx = currentFilterTags.indexOf(tag);
                if (idx >= 0) currentFilterTags.splice(idx, 1);
                else currentFilterTags.push(tag);
                currentPage = 1;
                renderGallery();
            });
            clearFilterBtn.addEventListener('click', () => {
                currentFilterTags = [];
                currentWeightFilter = null;
                currentPage = 1;
                renderGallery();
            });

            // 权重筛选
            document.getElementById('weightFilterBar').addEventListener('click', (e) => {
                const capsule = e.target.closest('.weight-capsule');
                if (!capsule) return;
                const w = capsule.dataset.weight || null;
                currentWeightFilter = w;
                currentPage = 1;
                renderGallery();
            });

            // 词条tabs
            tokenTabs.addEventListener('click', (e) => {
                const tab = e.target.closest('.token-tab');
                if (!tab) return;
                tokenTab = tab.dataset.tab;
                document.querySelectorAll('.token-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderTokenList();
            });

            // 词条搜索
            tokenSearchInput.addEventListener('input', () => {
                tokenSearchQuery = tokenSearchInput.value.trim();
                renderTokenList();
            });

            // 词条标签筛选
            tagFilterBar.addEventListener('click', (e) => {
                const capsule = e.target.closest('.tag-filter-capsule');
                if (!capsule) return;
                const tag = capsule.dataset.tag;
                tokenFilterTag = tokenFilterTag === tag ? null : tag;
                renderTokenList();
            });

            // 批量模式
            document.getElementById('btnBatchMode').addEventListener('click', () => {
                batchMode = !batchMode;
                if (!batchMode) selectedTokens.clear();
                document.getElementById('btnBatchMode').classList.toggle('active', batchMode);
                renderTokenList();
            });

            // 批量屏蔽
            document.getElementById('btnBatchBlock').addEventListener('click', () => {
                if (selectedTokens.size === 0) { showToast('请先选择词条', 'error'); return; }
                selectedTokens.forEach(t => {
                    data.blockedTokens[t] = { method: 'batch' };
                });
                selectedTokens.clear();
                batchMode = false;
                saveData();
                renderTokenList();
                showToast('已屏蔽选中词条', 'success');
            });

            // 批量取消屏蔽
            document.getElementById('btnBatchUnblock').addEventListener('click', () => {
                if (selectedTokens.size === 0) { showToast('请先选择词条', 'error'); return; }
                selectedTokens.forEach(t => {
                    delete data.blockedTokens[t];
                    delete data.batchBlockedTokens[t];
                });
                selectedTokens.clear();
                batchMode = false;
                saveData();
                renderTokenList();
                showToast('已取消屏蔽', 'success');
            });

            // 批量打标签
            document.getElementById('btnBatchTag').addEventListener('click', () => {
                if (selectedTokens.size === 0) { showToast('请先选择词条', 'error'); return; }
                const tag = prompt('请输入标签名:');
                if (!tag || tag.trim() === '') return;
                const trimmedTag = tag.trim();
                if (!data.tags.includes(trimmedTag)) data.tags.push(trimmedTag);
                selectedTokens.forEach(t => {
                    if (!data.tokenTranslations[t]) data.tokenTranslations[t] = { translation: '', tags: [] };
                    if (!data.tokenTranslations[t].tags.includes(trimmedTag)) data.tokenTranslations[t].tags.push(trimmedTag);
                });
                saveData();
                renderTokenList();
                showToast('已打标签', 'success');
            });

            // 导出词条
            document.getElementById('btnExportTokens').addEventListener('click', () => {
                showExportTokensModal();
            });

            // 标签管理
            document.getElementById('btnManageTags').addEventListener('click', () => {
                showTagManageModal();
            });

            // 显示翻译
            document.getElementById('btnShowTranslations').addEventListener('click', () => {
                showTranslations = !showTranslations;
                document.getElementById('btnShowTranslations').classList.toggle('active', showTranslations);
                document.querySelectorAll('.token-translation').forEach(el => {
                    el.classList.toggle('show', showTranslations);
                });
            });

            // 词条列表点击事件（委托）
            tokenList.addEventListener('click', (e) => {
                const item = e.target.closest('.token-item');
                if (!item) {
                    // 检查是否是block-group-header
                    const groupHeader = e.target.closest('.block-group-header');
                    if (groupHeader) {
                        const group = groupHeader.dataset.group;
                        const content = document.getElementById('block-group-' + group);
                        if (content) content.classList.toggle('open');
                        const icon = groupHeader.querySelector('.group-toggle i');
                        if (icon) {
                            icon.classList.toggle('fa-chevron-down');
                            icon.classList.toggle('fa-chevron-up');
                        }
                        // 处理组操作
                        if (e.target.closest('.group-copy')) {
                            const tokens = getGroupTokens(group);
                            copyToClipboard(tokens.join(', '));
                        } else if (e.target.closest('.group-diff')) {
                            const tokens = getGroupTokens(group);
                            showTokenDiffModal(tokens);
                        } else if (e.target.closest('.group-unblock')) {
                            const tokens = getGroupTokens(group);
                            batchUnblockTokens(tokens);
                        }
                        return;
                    }
                    return;
                }
                const tokenName = item.dataset.token;
                if (!tokenName) return;

                // checkbox
                if (e.target.closest('.token-checkbox')) {
                    const cb = e.target.closest('.token-checkbox');
                    if (cb.checked) selectedTokens.add(tokenName);
                    else selectedTokens.delete(tokenName);
                    updateBatchBar();
                    return;
                }
                // 取消屏蔽
                if (e.target.closest('.unblock-btn')) {
                    delete data.blockedTokens[tokenName];
                    delete data.batchBlockedTokens[tokenName];
                    saveData();
                    renderTokenList();
                    showToast('已取消屏蔽', 'success');
                    return;
                }
                // 编辑翻译
                if (e.target.closest('.translate-btn')) {
                    showTranslationModal(tokenName);
                    return;
                }
                // 打标签
                if (e.target.closest('.tag-btn')) {
                    showTagSelectorModal(tokenName);
                    return;
                }
                // 屏蔽
                if (e.target.closest('.block-btn')) {
                    if (data.blockedTokens[tokenName]) {
                        delete data.blockedTokens[tokenName];
                        showToast('已取消屏蔽', 'success');
                    } else {
                        data.blockedTokens[tokenName] = { method: 'manual' };
                        showToast('已屏蔽', 'success');
                    }
                    saveData();
                    renderTokenList();
                    return;
                }
                // 点击tag-badge
                if (e.target.closest('.tag-badge')) {
                    const tag = e.target.closest('.tag-badge').dataset.tag;
                    if (tag) {
                        tokenFilterTag = tag;
                        renderTokenList();
                    }
                    return;
                }
                // 复制词条
                copyToClipboard(tokenName);
            });

            function getGroupTokens(group) {
                const allTokensMap = getAllTokensFromData();
                const result = [];
                allTokensMap.forEach((v, name) => {
                    const method = getBlockMethod(name);
                    if (method === group) result.push(name);
                });
                return result;
            }

            function batchUnblockTokens(tokens) {
                tokens.forEach(t => {
                    delete data.blockedTokens[t];
                    delete data.batchBlockedTokens[t];
                    // 如果是因为标签屏蔽，需要从blockedTags中移除相关标签
                });
                // 对于tag屏蔽，需要更复杂的处理
                if (tokens.length > 0) {
                    const firstToken = tokens[0];
                    const method = getBlockMethod(firstToken);
                    if (method === 'tag') {
                        // 找到相关标签并取消屏蔽
                        const tagsToUnblock = [];
                        tokens.forEach(t => {
                            data.blockedTags.forEach(tag => {
                                const tokensWithTag = getTokensWithTag(tag);
                                if (tokensWithTag.includes(t)) tagsToUnblock.push(tag);
                            });
                        });
                        data.blockedTags = data.blockedTags.filter(tag => !tagsToUnblock.includes(tag));
                    }
                    if (method === 'batch') {
                        tokens.forEach(t => delete data.batchBlockedTokens[t]);
                    }
                }
                saveData();
                renderTokenList();
                showToast('已批量取消屏蔽', 'success');
            }

            // ===== 弹窗函数 =====
            function showImageDetail(img) {
                modalTitle.textContent = img.name;
                const posTokens = extractTokensFromPrompt(img.positivePrompt);
                const negTokens = extractTokensFromPrompt(img.negativePrompt);
                const posWithTrans = posTokens.map(t => {
                    const trans = getTokenTranslation(t);
                    return trans ? `${t} [${trans}]` : t;
                }).join(', ');
                const negWithTrans = negTokens.map(t => {
                    const trans = getTokenTranslation(t);
                    return trans ? `${t} [${trans}]` : t;
                }).join(', ');
                const paramsHtml = Object.entries(img.params || {}).map(([k, v]) =>
                    `<div class="param-item"><span class="param-key">${k}</span><span class="param-value">${v}</span></div>`
                ).join('');
                modalBody.innerHTML = `
                    <div class="modal-image-container"><img src="${img.dataUrl}" alt="${img.name}"></div>
                    <div class="modal-section">
                        <span class="section-label"><i class="fa-solid fa-plus" style="color:var(--success);"></i>正向提示词</span>
                        <div class="prompt-text positive">${posWithTrans || '无'}</div>
                        <div class="copy-row">
                            <button class="copy-btn positive-btn" id="modalCopyPos"><i class="fa-solid fa-copy"></i>复制正向</button>
                        </div>
                    </div>
                    <div class="modal-section">
                        <span class="section-label"><i class="fa-solid fa-minus" style="color:var(--danger);"></i>负向提示词</span>
                        <div class="prompt-text negative">${negWithTrans || '无'}</div>
                        <div class="copy-row">
                            <button class="copy-btn negative-btn" id="modalCopyNeg"><i class="fa-solid fa-copy"></i>复制负向</button>
                        </div>
                    </div>
                    <div class="modal-section">
                        <span class="section-label"><i class="fa-solid fa-sliders"></i>参数</span>
                        <div class="params-grid">${paramsHtml || '<div style="font-size:12px;color:var(--text-secondary);">无参数</div>'}</div>
                    </div>
                `;
                detailModal.classList.add('active');
                document.getElementById('modalCopyPos').addEventListener('click', () => copyToClipboard(img.positivePrompt || ''));
                document.getElementById('modalCopyNeg').addEventListener('click', () => copyToClipboard(img.negativePrompt || ''));
            }

            document.getElementById('modalCloseBtn').addEventListener('click', () => {
                detailModal.classList.remove('active');
            });
            detailModal.addEventListener('click', (e) => {
                if (e.target === detailModal) detailModal.classList.remove('active');
            });

            function showTranslationModal(tokenName) {
                const currentTrans = getTokenTranslation(tokenName);
                modalTitle.textContent = '编辑翻译 - ' + tokenName;
                modalBody.innerHTML = `
                    <div class="modal-section">
                        <span class="section-label"><i class="fa-solid fa-language"></i>词条翻译</span>
                        <div class="translation-input-row">
                            <input type="text" id="translationInput" placeholder="输入中文翻译..." value="${currentTrans}">
                            <button class="translation-save-btn" id="saveTranslationBtn">保存</button>
                        </div>
                    </div>
                `;
                detailModal.classList.add('active');
                document.getElementById('saveTranslationBtn').addEventListener('click', () => {
                    const trans = document.getElementById('translationInput').value.trim();
                    if (!data.tokenTranslations[tokenName]) data.tokenTranslations[tokenName] = { translation: '', tags: [] };
                    data.tokenTranslations[tokenName].translation = trans;
                    saveData();
                    detailModal.classList.remove('active');
                    renderTokenList();
                    showToast('翻译已保存', 'success');
                });
            }

            function showTagSelectorModal(tokenName) {
                const currentTags = getTokenTags(tokenName);
                modalTitle.textContent = '选择标签 - ' + tokenName;
                const allTags = data.tags.length > 0 ? data.tags : ['角色', '场景', '风格', '动作', '表情', '服装', '其他'];
                if (data.tags.length === 0) data.tags = [...allTags];
                modalBody.innerHTML = `
                    <div class="modal-section">
                        <span class="section-label"><i class="fa-solid fa-tags"></i>选择标签</span>
                        <div class="tag-selector-list" id="tagSelectorList">
                            ${allTags.map(tag => `
                                <span class="tag-selector-item ${currentTags.includes(tag) ? 'selected' : ''}" data-tag="${tag}">
                                    <span class="tag-dot" style="background:${getTagColor(tag)};"></span>${tag}
                                </span>
                            `).join('')}
                        </div>
                        <div class="tag-add-row" style="margin-top:8px;">
                            <input type="text" id="newTagInput" placeholder="添加新标签...">
                            <button class="tag-add-btn" id="addNewTagBtn">添加</button>
                        </div>
                    </div>
                `;
                detailModal.classList.add('active');
                document.getElementById('tagSelectorList').addEventListener('click', (e) => {
                    const item = e.target.closest('.tag-selector-item');
                    if (!item) return;
                    const tag = item.dataset.tag;
                    if (!data.tokenTranslations[tokenName]) data.tokenTranslations[tokenName] = { translation: '',
                        tags: [] };
                    const tags = data.tokenTranslations[tokenName].tags;
                    const idx = tags.indexOf(tag);
                    if (idx >= 0) tags.splice(idx, 1);
                    else tags.push(tag);
                    saveData();
                    renderTokenList();
                    showTagSelectorModal(tokenName);
                });
                document.getElementById('addNewTagBtn').addEventListener('click', () => {
                    const newTag = document.getElementById('newTagInput').value.trim();
                    if (!newTag) return;
                    if (!data.tags.includes(newTag)) data.tags.push(newTag);
                    if (!data.tokenTranslations[tokenName]) data.tokenTranslations[tokenName] = { translation: '',
                        tags: [] };
                    if (!data.tokenTranslations[tokenName].tags.includes(newTag)) data.tokenTranslations[tokenName]
                        .tags.push(newTag);
                    saveData();
                    renderTokenList();
                    showTagSelectorModal(tokenName);
                });
            }

            function getTagColor(tag) {
                const colors = ['#4a6cf7', '#e74c3c', '#27ae60', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#3498db',
                    '#e84393', '#00b894', '#6c5ce7', '#fd79a8'
                ];
                let hash = 0;
                for (let i = 0; i < tag.length; i++) hash = tag.charCodeAt(i) + ((hash << 5) - hash);
                return colors[Math.abs(hash) % colors.length];
            }

            function showTagManageModal() {
                modalTitle.textContent = '标签管理';
                const tagCounts = {};
                const allTokensMap = getAllTokensFromData();
                allTokensMap.forEach((v, name) => {
                    getTokenTags(name).forEach(tag => {
                        tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                    });
                });
                const allTags = [...new Set([...data.tags, ...Object.keys(tagCounts)])];
                modalBody.innerHTML = `
                    <div class="modal-section">
                        <span class="section-label"><i class="fa-solid fa-tags"></i>所有标签</span>
                        <div class="tag-manage-list" id="tagManageList">
                            ${allTags.map(tag => {
                                const isBlocked = isTagBlocked(tag);
                                const count = tagCounts[tag] || 0;
                                return `
                                    <div class="tag-manage-item" data-tag="${tag}">
                                        <span class="tag-manage-name">
                                            <span class="tag-dot" style="width:8px;height:8px;border-radius:50%;background:${getTagColor(tag)};display:inline-block;"></span>
                                            ${tag}
                                            <span class="tag-manage-count">${count}词条</span>
                                        </span>
                                        <span style="display:flex;gap:4px;">
                                            <button class="tag-manage-block" data-tag="${tag}" title="${isBlocked ? '取消屏蔽标签' : '屏蔽标签'}">
                                                <i class="fa-solid ${isBlocked ? 'fa-lock-open' : 'fa-lock'}" style="color:${isBlocked ? 'var(--danger)' : 'var(--text-secondary)'};"></i>
                                            </button>
                                            <button class="tag-manage-delete" data-tag="${tag}" title="删除标签"><i class="fa-solid fa-trash"></i></button>
                                        </span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <div class="tag-add-row" style="margin-top:8px;">
                            <input type="text" id="newTagManageInput" placeholder="新标签名...">
                            <button class="tag-add-btn" id="addTagManageBtn">添加</button>
                        </div>
                    </div>
                `;
                detailModal.classList.add('active');
                document.getElementById('tagManageList').addEventListener('click', (e) => {
                    const btn = e.target.closest('.tag-manage-delete');
                    if (btn) {
                        const tag = btn.dataset.tag;
                        if (confirm(`删除标签 "${tag}" ？该标签将从所有词条中移除。`)) {
                            data.tags = data.tags.filter(t => t !== tag);
                            data.blockedTags = data.blockedTags.filter(t => t !== tag);
                            Object.keys(data.tokenTranslations).forEach(k => {
                                if (data.tokenTranslations[k].tags.includes(tag)) {
                                    data.tokenTranslations[k].tags = data.tokenTranslations[k].tags.filter(t =>
                                        t !== tag);
                                }
                            });
                            saveData();
                            showTagManageModal();
                            renderTokenList();
                            showToast('标签已删除', 'success');
                        }
                        return;
                    }
                    const blockBtn = e.target.closest('.tag-manage-block');
                    if (blockBtn) {
                        const tag = blockBtn.dataset.tag;
                        const idx = data.blockedTags.indexOf(tag);
                        if (idx >= 0) {
                            data.blockedTags.splice(idx, 1);
                            showToast('已取消屏蔽标签', 'success');
                        } else {
                            data.blockedTags.push(tag);
                            showToast('已屏蔽标签，该标签下所有词条将被屏蔽', 'success');
                        }
                        saveData();
                        showTagManageModal();
                        renderTokenList();
                        return;
                    }
                });
                document.getElementById('addTagManageBtn').addEventListener('click', () => {
                    const newTag = document.getElementById('newTagManageInput').value.trim();
                    if (!newTag) return;
                    if (!data.tags.includes(newTag)) data.tags.push(newTag);
                    saveData();
                    showTagManageModal();
                });
            }

            function showExportTokensModal() {
                modalTitle.textContent = '导出词条';
                modalBody.innerHTML = `
                    <div class="modal-section">
                        <span class="section-label"><i class="fa-solid fa-file-export"></i>选择导出类型</span>
                        <div class="export-option-row">
                            <label><input type="radio" name="exportTarget" value="positive" ${exportTarget === 'positive' ? 'checked' : ''}> 正向词条</label>
                            <label><input type="radio" name="exportTarget" value="negative" ${exportTarget === 'negative' ? 'checked' : ''}> 负向词条</label>
                        </div>
                        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">注意：正向和负向词条将分别导出，不会同时导出。</div>
                        <div style="display:flex;gap:8px;margin-top:12px;">
                            <button class="copy-btn" id="confirmExportTokens"><i class="fa-solid fa-file-export"></i>导出</button>
                            <button class="copy-btn" id="cancelExportTokens"><i class="fa-solid fa-xmark"></i>取消</button>
                        </div>
                    </div>
                `;
                detailModal.classList.add('active');
                document.querySelectorAll('input[name="exportTarget"]').forEach(radio => {
                    radio.addEventListener('change', () => {
                        exportTarget = radio.value;
                    });
                });
                document.getElementById('confirmExportTokens').addEventListener('click', () => {
                    doExportTokens(exportTarget);
                    detailModal.classList.remove('active');
                });
                document.getElementById('cancelExportTokens').addEventListener('click', () => {
                    detailModal.classList.remove('active');
                });
            }

            function doExportTokens(target) {
                const allTokensMap = getAllTokensFromData();
                const tokenList = [];
                allTokensMap.forEach((v, name) => {
                    if (target === 'positive' && v.posCount > 0) tokenList.push(name);
                    if (target === 'negative' && v.negCount > 0) tokenList.push(name);
                });
                if (tokenList.length === 0) { showToast('没有可导出的词条', 'error'); return; }
                const content = tokenList.join(', ');
                downloadTextFile(content, `nai_tokens_${target}.txt`);
                showToast(`已导出 ${tokenList.length} 个${target === 'positive' ? '正向' : '负向'}词条`, 'success');
            }

            function showTokenDiffModal(tokens) {
                if (tokens.length < 1) { showToast('没有词条可对比', 'error'); return; }
                modalTitle.textContent = '词条对比';
                const allTokensMap = getAllTokensFromData();
                const diffResults = [];
                tokens.forEach(t => {
                    const info = allTokensMap.get(t);
                    if (info) {
                        diffResults.push({
                            name: t,
                            posCount: info.posCount,
                            negCount: info.negCount,
                            translation: getTokenTranslation(t),
                            tags: getTokenTags(t)
                        });
                    }
                });
                modalBody.innerHTML = `
                    <div class="modal-section">
                        <span class="section-label"><i class="fa-solid fa-code-compare"></i>词条统计对比</span>
                        <div style="display:flex;flex-direction:column;gap:6px;max-height:400px;overflow-y:auto;">
                            ${diffResults.map(d => `
                                <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#f8f9fa;border-radius:8px;border:1px solid #e8e8e8;flex-wrap:wrap;gap:6px;">
                                    <span style="font-weight:600;font-size:13px;">${d.name}${d.translation ? ' <span style="color:var(--text-secondary);font-style:italic;font-size:11px;">[' + d.translation + ']</span>' : ''}</span>
                                    <span style="display:flex;gap:10px;font-size:12px;">
                                        <span style="color:var(--success);">正向: ${d.posCount}</span>
                                        <span style="color:var(--danger);">负向: ${d.negCount}</span>
                                        ${d.tags.map(t => `<span class="tag-badge" style="background:#eef1ff;color:var(--primary);">${t}</span>`).join('')}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                detailModal.classList.add('active');
            }

            // 图库选中checkbox显示控制
            function updateCheckboxVisibility() {
                const show = selectedImages.size > 0;
                document.querySelectorAll('.select-checkbox').forEach(cb => cb.classList.toggle('show', show));
            }

            // 事件监听：批量选中词条的checkbox点击
            tokenList.addEventListener('change', (e) => {
                if (e.target.classList.contains('token-checkbox')) {
                    const tokenName = e.target.dataset.token;
                    if (e.target.checked) selectedTokens.add(tokenName);
                    else selectedTokens.delete(tokenName);
                    updateBatchBar();
                }
            });

            // 初始化
            loadData();
            updateTotalSize();
            renderGallery();
            // 默认显示翻译
            showTranslations = true;
            document.getElementById('btnShowTranslations').classList.add('active');

            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (detailModal.classList.contains('active')) detailModal.classList.remove('active');
                    if (tokenSidebar.classList.contains('active')) tokenSidebar.classList.remove('active');
                }
            });

            // 点击遮罩关闭详情
            detailModal.addEventListener('click', (e) => {
                if (e.target === detailModal) detailModal.classList.remove('active');
            });

        })();
    </script>
</body>
</html>
