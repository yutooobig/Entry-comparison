<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAI 提示词管理器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/pngquant-wasm@1.1.0/dist/pngquant.min.js"></script>
    <style>
        :root {
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --sidebar-bg: #1e2a3a;
            --sidebar-text: #e0e6ed;
            --primary: #4a6cf7;
            --primary-hover: #3b5de7;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --success: #27ae60;
            --warning: #f39c12;
            --text: #2c3e50;
            --text-secondary: #7f8c8d;
            --border: #e1e5eb;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.15);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 5px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            --header-height: 60px;
            --filter-height: 48px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#c0c4cc; border-radius:3px; }
        ::-webkit-scrollbar-thumb:hover { background:#a0a4ac; }

        .app-header {
            position: sticky; top:0; z-index:100;
            background: var(--sidebar-bg); color: var(--sidebar-text);
            height: var(--header-height);
            display: flex; align-items:center; justify-content:space-between;
            padding: 0 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .app-header .logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; letter-spacing:0.5px; white-space:nowrap; }
        .app-header .logo i { color:#6c8cff; font-size:22px; }
        .header-actions { display:flex; gap:8px; align-items:center; flex-wrap:nowrap; }
        .header-btn {
            background: rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); color:#fff;
            padding:8px 14px; border-radius:var(--radius-sm); cursor:pointer; font-size:13px; font-weight:500;
            display:flex; align-items:center; gap:6px; transition:var(--transition); white-space:nowrap; font-family:var(--font);
        }
        .header-btn:hover { background:rgba(255,255,255,0.22); border-color:rgba(255,255,255,0.35); }
        .header-btn i { font-size:14px; }
        .header-btn.primary { background:var(--primary); border-color:var(--primary); }
        .header-btn.primary:hover { background:var(--primary-hover); border-color:var(--primary-hover); }
        .header-btn.danger { background:var(--danger); border-color:var(--danger); }
        .header-btn.danger:hover { background:var(--danger-hover); border-color:var(--danger-hover); }

        /* 总大小显示 */
        .total-size-display {
            display:flex; align-items:center; gap:4px; font-size:12px; color:#b0b8c4;
            background:rgba(255,255,255,0.08); padding:4px 10px; border-radius:20px;
            white-space:nowrap; user-select:none;
        }
        .total-size-display i { font-size:11px; }
        .total-size-display span { font-weight:600; }

        .filter-bar {
            position: sticky; top:var(--header-height); z-index:90;
            background: var(--card-bg); padding:8px 16px; border-bottom:1px solid var(--border);
            display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-height:var(--filter-height);
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .filter-bar .filter-label { font-size:13px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; font-weight:500; white-space:nowrap; }
        .filter-tags { display:flex; gap:6px; flex-wrap:wrap; align-items:center; flex:1; }
        .filter-tag {
            display:inline-flex; align-items:center; gap:5px; background:#eef1ff; color:var(--primary);
            padding:4px 10px; border-radius:20px; font-size:12px; font-weight:500; cursor:pointer; transition:var(--transition); border:1px solid #d5dcff;
        }
        .filter-tag:hover { background:#dfe5ff; }
        .filter-tag i { font-size:10px; cursor:pointer; opacity:0.7; }
        .filter-tag i:hover { opacity:1; }
        .clear-filter-btn { background:none; border:none; color:var(--text-secondary); cursor:pointer; font-size:12px; display:flex; align-items:center; gap:4px; padding:4px 8px; border-radius:var(--radius-xs); transition:var(--transition); font-family:var(--font); }
        .clear-filter-btn:hover { color:var(--danger); background:#fef0ef; }
        .download-actions { display:none; gap:6px; align-items:center; flex-wrap:wrap; }
        .download-actions.active { display:flex; }
        .download-actions .btn-sm { padding:5px 10px; font-size:11px; border-radius:6px; border:1px solid var(--border); background:#f8f9fa; cursor:pointer; transition:var(--transition); font-family:var(--font); color:var(--text); display:flex; align-items:center; gap:4px; }
        .download-actions .btn-sm:hover { background:#e9ecef; }
        .download-actions .btn-sm.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
        .download-actions .btn-sm.primary:hover { background:var(--primary-hover); }
        .download-actions .btn-sm.danger { background:var(--danger); color:#fff; border-color:var(--danger); }
        .download-actions .btn-sm.danger:hover { background:var(--danger-hover); }

        /* 压缩进度条 */
        .compress-progress {
            width:100%; display:none; align-items:center; gap:8px; padding:4px 0;
        }
        .compress-progress .progress-bar {
            flex:1; height:6px; background:#e9ecef; border-radius:3px; overflow:hidden;
        }
        .compress-progress .progress-bar-inner {
            height:100%; width:0%; background:var(--primary); border-radius:3px; transition:width 0.3s;
        }
        .compress-progress .progress-text { font-size:11px; color:var(--text-secondary); white-space:nowrap; }

        .main-content { display:flex; min-height:calc(100vh - var(--header-height) - var(--filter-height)); }
        .gallery { flex:1; padding:16px; overflow-y:auto; }
        .gallery-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px; }
        .gallery-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:50vh; color:var(--text-secondary); gap:14px; text-align:center; padding:20px; }
        .gallery-empty i { font-size:60px; opacity:0.4; }
        .gallery-empty p { font-size:15px; max-width:320px; line-height:1.6; }
        .gallery-empty .upload-hint-btn { background:var(--primary); color:#fff; border:none; padding:10px 20px; border-radius:var(--radius-sm); cursor:pointer; font-size:14px; font-weight:500; transition:var(--transition); font-family:var(--font); display:flex; align-items:center; gap:8px; }
        .gallery-empty .upload-hint-btn:hover { background:var(--primary-hover); }

        .image-card { background:var(--card-bg); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); transition:var(--transition); cursor:pointer; position:relative; border:2px solid transparent; display:flex; flex-direction:column; }
        .image-card:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
        .image-card.selected { border-color:var(--primary); box-shadow:0 0 0 3px rgba(74,108,247,0.2); }
        .image-card .thumb-wrapper { position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; background:#f0f0f0; flex-shrink:0; }
        .image-card .thumb-wrapper img { width:100%; height:100%; object-fit:cover; display:block; transition:transform 0.3s ease; }
        .image-card:hover .thumb-wrapper img { transform:scale(1.04); }
        .image-card .select-checkbox { position:absolute; top:8px; left:8px; width:20px; height:20px; accent-color:var(--primary); cursor:pointer; z-index:5; display:none; }
        .image-card .select-checkbox.show { display:block; }
        .image-card .card-info { padding:10px 12px; flex:1; display:flex; flex-direction:column; gap:4px; }
        .image-card .card-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .image-card .card-prompt-preview { font-size:11px; color:var(--text-secondary); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-all; }
        .image-card .card-actions { display:flex; gap:4px; padding:6px 8px; border-top:1px solid #f0f0f0; flex-shrink:0; }
        .card-action-btn { background:none; border:1px solid var(--border); border-radius:var(--radius-xs); padding:5px 8px; cursor:pointer; font-size:11px; color:var(--text-secondary); transition:var(--transition); display:flex; align-items:center; gap:3px; font-family:var(--font); flex:1; justify-content:center; }
        .card-action-btn:hover { background:#f5f6fa; color:var(--text); }
        .card-action-btn.copy-pos:hover { background:#eef7f0; color:var(--success); border-color:var(--success); }
        .card-action-btn.copy-neg:hover { background:#fdf0ef; color:var(--danger); border-color:var(--danger); }
        .card-action-btn.delete-btn:hover { background:#fdf0ef; color:var(--danger); border-color:var(--danger); }

        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.55); z-index:200; display:none; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(3px); animation:fadeIn 0.2s ease; }
        .modal-overlay.active { display:flex; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        @keyframes slideUp { from { transform:translateY(30px); opacity:0; } to { transform:translateY(0); opacity:1; } }
        .modal-content { background:var(--card-bg); border-radius:var(--radius); max-width:720px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-lg); animation:slideUp 0.25s ease; display:flex; flex-direction:column; }
        .modal-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); flex-shrink:0; position:sticky; top:0; background:var(--card-bg); z-index:1; }
        .modal-header h3 { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70%; }
        .modal-close-btn { background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-secondary); padding:4px 8px; border-radius:var(--radius-xs); transition:var(--transition); }
        .modal-close-btn:hover { background:#f0f0f0; color:var(--text); }
        .modal-body { padding:20px; display:flex; flex-direction:column; gap:16px; }
        .modal-image-container { width:100%; max-height:320px; display:flex; justify-content:center; background:#f8f9fa; border-radius:var(--radius-sm); overflow:hidden; }
        .modal-image-container img { max-width:100%; max-height:320px; object-fit:contain; }
        .modal-section { display:flex; flex-direction:column; gap:8px; }
        .modal-section .section-label { font-size:12px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px; display:flex; align-items:center; gap:6px; }
        .prompt-text { background:#f8f9fa; padding:12px; border-radius:var(--radius-sm); font-size:13px; line-height:1.6; word-break:break-all; max-height:180px; overflow-y:auto; white-space:pre-wrap; font-family:'Consolas','Monaco','Courier New',monospace; border:1px solid #e8e8e8; }
        .prompt-text.negative { border-left:3px solid var(--danger); }
        .prompt-text.positive { border-left:3px solid var(--success); }
        .copy-row { display:flex; gap:6px; flex-wrap:wrap; }
        .copy-btn { background:#f0f2f5; border:1px solid var(--border); padding:6px 12px; border-radius:var(--radius-xs); cursor:pointer; font-size:12px; display:flex; align-items:center; gap:5px; transition:var(--transition); font-family:var(--font); color:var(--text); }
        .copy-btn:hover { background:#e4e7eb; }
        .copy-btn.positive-btn:hover { background:#eef7f0; color:var(--success); border-color:var(--success); }
        .copy-btn.negative-btn:hover { background:#fdf0ef; color:var(--danger); border-color:var(--danger); }
        .params-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:8px; }
        .param-item { background:#f8f9fa; padding:8px 10px; border-radius:var(--radius-xs); font-size:12px; display:flex; flex-direction:column; gap:2px; border:1px solid #e8e8e8; }
        .param-item .param-key { font-weight:600; color:var(--text-secondary); font-size:10px; text-transform:uppercase; letter-spacing:0.3px; }
        .param-item .param-value { font-weight:500; word-break:break-all; }

        .token-sidebar { position:fixed; top:0; right:-420px; width:400px; max-width:90vw; height:100vh; background:var(--card-bg); box-shadow:-4px 0 20px rgba(0,0,0,0.15); z-index:300; transition:right 0.3s cubic-bezier(0.4,0,0.2,1); display:flex; flex-direction:column; }
        .token-sidebar.active { right:0; }
        .token-sidebar-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; background:var(--sidebar-bg); color:#fff; }
        .token-sidebar-header h3 { font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
        .token-sidebar-close { background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:4px 8px; border-radius:var(--radius-xs); transition:var(--transition); }
        .token-sidebar-close:hover { background:rgba(255,255,255,0.15); }
        .token-tabs { display:flex; gap:4px; padding:10px 16px; background:#f8f9fa; border-bottom:1px solid var(--border); flex-shrink:0; }
        .token-tab { padding:7px 16px; border-radius:20px; border:none; cursor:pointer; font-size:12px; font-weight:500; transition:var(--transition); font-family:var(--font); background:transparent; color:var(--text-secondary); }
        .token-tab.active { background:var(--primary); color:#fff; }
        .token-tab:hover:not(.active) { background:#e9ecf5; }
        .token-list { flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
        .token-item { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:#f8f9fa; border-radius:var(--radius-sm); cursor:pointer; transition:var(--transition); border:1px solid transparent; gap:8px; }
        .token-item:hover { background:#eef1ff; border-color:#d5dcff; }
        .token-item .token-name { font-size:12px; font-weight:500; word-break:break-all; flex:1; line-height:1.3; cursor:pointer; }
        .token-item .token-count { font-size:11px; color:var(--text-secondary); background:#e9ecef; padding:2px 8px; border-radius:10px; font-weight:600; flex-shrink:0; }
        .token-item .token-count.pos { background:#d4edda; color:#155724; }
        .token-item .token-count.neg { background:#f8d7da; color:#721c24; }
        .token-item .filter-token-btn { background:none; border:none; color:var(--text-secondary); cursor:pointer; font-size:12px; padding:4px; border-radius:4px; transition:var(--transition); flex-shrink:0; }
        .token-item .filter-token-btn:hover { color:var(--primary); background:#e0e5ff; }

        .token-weight-bar { padding:8px 16px; border-bottom:1px solid var(--border); background:#fcfcfc; flex-shrink:0; }
        .token-weight-bar .weight-capsule { display:inline-flex; align-items:center; gap:4px; background:#f0f2f5; border-radius:20px; padding:6px 12px; font-size:13px; font-weight:500; border:1px solid #d0d5dd; cursor:pointer; transition:var(--transition); }
        .token-weight-bar .weight-capsule:hover { background:#e0e5ff; border-color:var(--primary); }
        .token-weight-bar .weight-capsule .weight-count { background:var(--primary); color:#fff; border-radius:10px; padding:2px 6px; font-size:10px; font-weight:700; }
        .token-search { padding:10px 16px; flex-shrink:0; position:relative; }
        .token-search input { width:100%; padding:8px 12px 8px 36px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px; font-family:var(--font); outline:none; transition:var(--transition); background:#f8f9fa; }
        .token-search input:focus { border-color:var(--primary); background:#fff; box-shadow:0 0 0 3px rgba(74,108,247,0.1); }
        .token-search i { position:absolute; left:26px; top:50%; transform:translateY(-50%); color:var(--text-secondary); font-size:13px; }

        .similarity-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:250; display:none; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(3px); }
        .similarity-overlay.active { display:flex; }
        .similarity-panel { background:var(--card-bg); border-radius:var(--radius); max-width:800px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-lg); animation:slideUp 0.25s ease; display:flex; flex-direction:column; }
        .similarity-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; position:sticky; top:0; background:var(--card-bg); z-index:1; }
        .similarity-header h3 { font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
        .similarity-body { padding:16px 20px; display:flex; flex-direction:column; gap:12px; }
        .threshold-control { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 0; }
        .threshold-control label { font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px; }
        .threshold-control input[type="range"] { flex:1; min-width:120px; accent-color:var(--primary); }
        .threshold-value { font-weight:700; color:var(--primary); font-size:14px; min-width:40px; text-align:center; }
        .exclude-common-label { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); cursor:pointer; user-select:none; }
        .exclude-common-label input[type="checkbox"] { accent-color:var(--primary); width:15px; height:15px; cursor:pointer; }
        .similarity-results { display:flex; flex-direction:column; gap:10px; max-height:400px; overflow-y:auto; }
        .sim-pair { display:flex; align-items:center; gap:10px; padding:10px; background:#f8f9fa; border-radius:var(--radius-sm); border:1px solid #e8e8e8; flex-wrap:wrap; transition:var(--transition); }
        .sim-pair:hover { background:#f0f2f5; border-color:#d0d5dd; }
        .sim-pair .sim-thumbs { display:flex; gap:6px; flex-shrink:0; }
        .sim-pair .sim-thumbs img { width:50px; height:50px; border-radius:var(--radius-xs); object-fit:cover; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.1); cursor:pointer; transition:var(--transition); }
        .sim-pair .sim-thumbs img:hover { transform:scale(1.1); }
        .sim-pair .sim-info { flex:1; min-width:150px; }
        .sim-pair .sim-score { font-size:13px; font-weight:700; color:var(--primary); display:flex; align-items:center; gap:4px; }
        .sim-pair .sim-score.high { color:var(--danger); }
        .sim-pair .sim-common-tokens { font-size:11px; color:var(--text-secondary); line-height:1.4; word-break:break-all; margin-top:2px; }
        .sim-pair .sim-actions { display:flex; gap:4px; flex-shrink:0; flex-wrap:wrap; }
        .sim-action-btn { background:none; border:1px solid var(--border); border-radius:var(--radius-xs); padding:4px 8px; cursor:pointer; font-size:10px; transition:var(--transition); font-family:var(--font); color:var(--text-secondary); display:flex; align-items:center; gap:3px; }
        .sim-action-btn:hover { background:#e9ecef; }
        .sim-action-btn.delete:hover { background:#fdf0ef; color:var(--danger); border-color:var(--danger); }
        .sim-action-btn.diff-btn { background:#eef1ff; color:var(--primary); border-color:#d5dcff; }
        .sim-action-btn.diff-btn:hover { background:#dfe5ff; }
        .sim-action-btn.weight-diff-btn { background:#fff8e1; color:#b7791f; border-color:#f0d77b; }
        .sim-action-btn.weight-diff-btn:hover { background:#fff3cd; }

        .toast-container { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:500; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
        .toast { background:#333; color:#fff; padding:10px 20px; border-radius:var(--radius-sm); font-size:13px; font-weight:500; box-shadow:var(--shadow-lg); animation:toastIn 0.3s ease, toastOut 0.3s ease 2.2s forwards; pointer-events:auto; display:flex; align-items:center; gap:8px; }
        .toast.success { background:var(--success); }
        .toast.error { background:var(--danger); }
        .toast.info { background:var(--primary); }
        @keyframes toastIn { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }
        @keyframes toastOut { from { opacity:1; } to { opacity:0; transform:translateY(-10px); } }

        #fileInput { display:none; }

        .diff-container { display:flex; gap:16px; flex-wrap:wrap; }
        .diff-card { flex:1 1 200px; background:#f8f9fa; padding:12px; border-radius:var(--radius-sm); border:1px solid #e8e8e8; }
        .diff-card .diff-title { font-weight:600; font-size:13px; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
        .diff-token-list { display:flex; flex-wrap:wrap; gap:4px; }
        .diff-token { font-size:11px; background:#fff; border:1px solid #d0d5dd; padding:2px 6px; border-radius:12px; color:var(--text); }
        .diff-token.positive { border-color:#b7e4c7; background:#eef7f0; }
        .diff-token.negative { border-color:#f5c6cb; background:#fdf0ef; }

        .weight-diff-list { display:flex; flex-direction:column; gap:8px; }
        .weight-diff-row { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:#f8f9fa; border-radius:var(--radius-sm); border:1px solid #e8e8e8; flex-wrap:wrap; gap:8px; }
        .weight-diff-row .diff-token-name { font-weight:600; font-size:13px; flex:1; }
        .weight-diff-row .diff-weight { font-size:12px; color:var(--text-secondary); }

        @media (max-width:768px) {
            .gallery-grid { grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px; padding:10px; }
            .app-header { padding:0 10px; height:52px; }

    <script>
        (function() {
            const DB_NAME = 'pngGalleryDB';
            const DB_VERSION = 1;
            const STORE_NAME = 'images';
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    if (db) { resolve(db); return; }
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const database = e.target.result;
                        if (!database.objectStoreNames.contains(STORE_NAME)) {
                            const store = database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                            store.createIndex('timestamp', 'timestamp', { unique: false });
                        }
                    };
                    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                    req.onerror = (e) => reject(e.target.error);
                });
            }

            function dbAddImage(imageData) {
                return new Promise((resolve, reject) => {
                    openDB().then((database) => {
                        const tx = database.transaction(STORE_NAME, 'readwrite');
                        const store = tx.objectStore(STORE_NAME);
                        store.put(imageData);
                        tx.oncomplete = () => resolve();
                        tx.onerror = (e) => reject(e.target.error);
                    }).catch(reject);
                });
            }

            function dbGetAllImages() {
                return new Promise((resolve, reject) => {
                    openDB().then((database) => {
                        const tx = database.transaction(STORE_NAME, 'readonly');
                        const store = tx.objectStore(STORE_NAME);
                        const index = store.index('timestamp');
                        const req = index.getAll();
                        req.onsuccess = () => resolve(req.result || []);
                        req.onerror = (e) => reject(e.target.error);
                    }).catch(reject);
                });
            }

            function dbDeleteImage(id) {
                return new Promise((resolve, reject) => {
                    openDB().then((database) => {
                        const tx = database.transaction(STORE_NAME, 'readwrite');
                        const store = tx.objectStore(STORE_NAME);
                        store.delete(id);
                        tx.oncomplete = () => resolve();
                        tx.onerror = (e) => reject(e.target.error);
                    }).catch(reject);
                });
            }

            function parsePNGMetadata(arrayBuffer) {
                const bytes = new Uint8Array(arrayBuffer);
                if (bytes.length < 8) return null;
                const signature = [137,80,78,71,13,10,26,10];
                for (let i=0; i<8; i++) if (bytes[i] !== signature[i]) return null;
                let offset = 8;
                let metadata = null;
                while (offset < bytes.length) {
                    if (offset + 8 > bytes.length) break;
                    const length = (bytes[offset]<<24)|(bytes[offset+1]<<16)|(bytes[offset+2]<<8)|bytes[offset+3];
                    const type = String.fromCharCode(bytes[offset+4],bytes[offset+5],bytes[offset+6],bytes[offset+7]);
                    const dataStart = offset + 8;
                    const dataEnd = dataStart + length;
                    if (dataEnd > bytes.length) break;
                    if (type === 'tEXt' || type === 'iTXt') {
                        const chunkData = bytes.slice(dataStart, dataEnd);
                        let keyword = '';
                        let textContent = '';
                        if (type === 'tEXt') {
                            let nullIdx = -1;
                            for (let i=0; i<chunkData.length; i++) if (chunkData[i]===0) { nullIdx=i; break; }
                            if (nullIdx > -1) {
                                const keywordBytes = chunkData.slice(0, nullIdx);
                                keyword = new TextDecoder('latin1').decode(keywordBytes);
                                const textBytes = chunkData.slice(nullIdx+1);
                                textContent = new TextDecoder('latin1').decode(textBytes);
                            }
                        } else {
                            let nullIdx1 = -1;
                            for (let i=0; i<chunkData.length; i++) if (chunkData[i]===0) { nullIdx1=i; break; }
                            if (nullIdx1 > -1) {
                                const keywordBytes = chunkData.slice(0, nullIdx1);
                                keyword = new TextDecoder('utf-8').decode(keywordBytes);
                                const restIdx = nullIdx1 + 1;
                                if (restIdx + 2 <= chunkData.length) {
                                    let nullIdx2 = -1;
                                    for (let i=restIdx+2; i<chunkData.length; i++) if (chunkData[i]===0) { nullIdx2=i; break; }
                                    if (nullIdx2 > -1) {
                                        let nullIdx3 = -1;
                                        for (let i=nullIdx2+1; i<chunkData.length; i++) if (chunkData[i]===0) { nullIdx3=i; break; }
                                        const textStart = nullIdx3 > -1 ? nullIdx3 + 1 : nullIdx2 + 1;
                                        const textBytes = chunkData.slice(textStart);
                                        textContent = new TextDecoder('utf-8').decode(textBytes);
                                    }
                                }
                            }
                        }
                        if (keyword === 'Comment' || keyword === 'parameters' || keyword === 'prompt' || keyword === 'description') {
                            if (textContent && textContent.trim().startsWith('{')) {
                                try { metadata = JSON.parse(textContent); } catch(e) {
                                    const jsonMatch = textContent.match(/\{[\s\S]*\}/);
                                    if (jsonMatch) { try { metadata = JSON.parse(jsonMatch[0]); } catch(e2) { metadata = null; } }
                                }
                            }
                            if (metadata) break;
                        }
                    }
                    offset = dataEnd + 4;
                }
                return metadata;
            }

            function extractTokenData(promptStr) {
                if (!promptStr) return { tokens: [], weights: {} };
                let cleaned = promptStr;
                cleaned = cleaned.replace(/\{\{tar\}\}/g, '');
                cleaned = cleaned.replace(/\d+(?:\.\d+)?\s*::/g, ',');
                cleaned = cleaned.replace(/\d+(?:\.\d+)?\s*:/g, ',');
                cleaned = cleaned.replace(/::/g, ',');
                const parts = cleaned.split(',');
                const tokens = new Set();
                const weights = {};
                for (let part of parts) {
                    let segment = part.trim();
                    if (!segment) continue;
                    let weight = 1.0;
                    let tokenPart = segment;
                    const weightMatch = segment.match(/(.+?):\s*(-?\d+(?:\.\d+)?)\s*$/);
                    if (weightMatch) {
                        tokenPart = weightMatch[1];
                        weight = parseFloat(weightMatch[2]);
                        if (isNaN(weight)) weight = 1.0;
                    }
                    tokenPart = tokenPart.trim();
                    tokenPart = tokenPart.replace(/[\(\)\[\]<>]/g, '');
                    tokenPart = tokenPart.replace(/\s+/g, ' ').trim();
                    tokenPart = tokenPart.replace(/^[\d\s.]+/, '').trim();
                    if (!tokenPart || tokenPart.length < 1 || tokenPart.length >= 200) continue;
                    tokens.add(tokenPart);
                    weights[tokenPart] = weight;
                }
                return { tokens: Array.from(tokens), weights };
            }

            function extractTokens(promptStr) {
                return extractTokenData(promptStr).tokens;
            }

            function jaccardSimilarity(setA, setB) {
                if (setA.length === 0 && setB.length === 0) return 0;
                const intersection = setA.filter(t => setB.includes(t));
                const union = new Set([...setA, ...setB]);
                if (union.size === 0) return 0;
                return intersection.length / union.size;
            }

            function getFilteredTokens(image, excludeCommon, commonThreshold = 0.5, allImages = null) {
                let tokens = [...image.promptTokens];
                if (excludeCommon && allImages && allImages.length > 1) {
                    const totalImages = allImages.length;
                    tokens = tokens.filter(token => {
                        const count = allImages.filter(img => img.promptTokens.includes(token)).length;
                        return count <= totalImages * commonThreshold;
                    });
                }
                return tokens;
            }

            function calculateSimilarities(images, threshold, excludeCommon) {
                const results = [];
                const n = images.length;
                for (let i=0; i<n; i++) {
                    for (let j=i+1; j<n; j++) {
                        const tokensA = getFilteredTokens(images[i], excludeCommon, 0.5, images);
                        const tokensB = getFilteredTokens(images[j], excludeCommon, 0.5, images);
                        const sim = jaccardSimilarity(tokensA, tokensB);
                        if (sim >= threshold) {
                            const commonTokens = tokensA.filter(t => tokensB.includes(t));
                            results.push({ imgA: images[i], imgB: images[j], similarity: sim, commonTokens: commonTokens });
                        }
                    }
                }
                results.sort((a,b) => b.similarity - a.similarity);
                return results;
            }

            const crcTable = (() => { let c; const table = []; for (let n=0; n<256; n++) { c = n; for (let k=0; k<8; k++) { c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); } table[n] = c >>> 0; } return table; })();
            function crc32(bytes) { let crc = 0xFFFFFFFF; for (let i=0; i<bytes.length; i++) { crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xFF]; } return (crc ^ 0xFFFFFFFF) >>> 0; }
            function uint32ToBytes(num) { return [num >>> 24, (num >>> 16) & 0xFF, (num >>> 8) & 0xFF, num & 0xFF]; }
            function createPNGChunk(type, data) {
                const typeBytes = [...type].map(c => c.charCodeAt(0));
                const dataBytes = data instanceof Uint8Array ? data : new TextEncoder().encode(data);
                const length = dataBytes.length;
                const chunk = new Uint8Array(4 + 4 + length + 4);
                chunk.set(uint32ToBytes(length), 0);
                chunk.set(typeBytes, 4);
                chunk.set(dataBytes, 8);
                const crc = crc32(new Uint8Array([...typeBytes, ...dataBytes]));
                chunk.set(uint32ToBytes(crc), 8 + length);
                return chunk;
            }

            function removePNGMetadata(blob) {
                return new Promise(async (resolve, reject) => {
                    try {
                        const arrayBuffer = await blob.arrayBuffer();
                        const bytes = new Uint8Array(arrayBuffer);
                        if (bytes.length < 8) { resolve(blob); return; }
                        const signature = [137,80,78,71,13,10,26,10];
                        for (let i=0; i<8; i++) if (bytes[i] !== signature[i]) { resolve(blob); return; }
                        const chunks = [];
                        let offset = 8;
                        while (offset < bytes.length) {
                            if (offset + 8 > bytes.length) break;
                            const length = (bytes[offset]<<24)|(bytes[offset+1]<<16)|(bytes[offset+2]<<8)|bytes[offset+3];
                            const type = String.fromCharCode(bytes[offset+4],bytes[offset+5],bytes[offset+6],bytes[offset+7]);
                            const dataStart = offset + 8;
                            const dataEnd = dataStart + length;
                            if (dataEnd + 4 > bytes.length) break;
                            if (type !== 'tEXt' && type !== 'iTXt' && type !== 'zTXt') {
                                chunks.push(bytes.slice(offset, dataEnd + 4));
                            }
                            offset = dataEnd + 4;
                        }
                        const signatureBytes = bytes.slice(0, 8);
                        const totalLength = chunks.reduce((sum, c) => sum + c.length, 0) + 8;
                        const result = new Uint8Array(totalLength);
                        result.set(signatureBytes, 0);
                        let pos = 8;
                        for (const chunk of chunks) { result.set(chunk, pos); pos += chunk.length; }
                        resolve(new Blob([result], { type: 'image/png' }));
                    } catch (e) { reject(e); }
                });
            }

            function createPNGWithMetadata(pngBlob, metadataObj) {
                return new Promise(async (resolve, reject) => {
                    try {
                        const arrayBuffer = await pngBlob.arrayBuffer();
                        const bytes = new Uint8Array(arrayBuffer);
                        const sig = [137,80,78,71,13,10,26,10];
                        for (let i=0; i<8; i++) if (bytes[i] !== sig[i]) { resolve(pngBlob); return; }
                        let iendOffset = -1;
                        for (let i = bytes.length - 8; i >= 8; i--) {
                            const type = String.fromCharCode(bytes[i+4], bytes[i+5], bytes[i+6], bytes[i+7]);
                            if (type === 'IEND') { iendOffset = i; break; }
                        }
                        if (iendOffset === -1) { resolve(pngBlob); return; }
                        const metadataStr = JSON.stringify(metadataObj);
                        const keyword = 'Comment';
                        const textBytes = new TextEncoder().encode(keyword + '\0' + metadataStr);
                        const textChunk = createPNGChunk('tEXt', textBytes);
                        const before = bytes.slice(0, iendOffset);
                        const iendChunk = bytes.slice(iendOffset);
                        const result = new Uint8Array(before.length + textChunk.length + iendChunk.length);
                        result.set(before, 0);
                        result.set(textChunk, before.length);
                        result.set(iendChunk, before.length + textChunk.length);
                        resolve(new Blob([result], { type: 'image/png' }));
                    } catch (e) { reject(e); }
                });
            }

            let allImages = [];
            let filteredImages = [];
            let activeFilters = [];
            let currentTokenTab = 'positive';
            let tokenStats = { positive: {}, negative: {} };
            let selectedImageId = null;

            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', info:'fa-info-circle' };
                toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i> ${message}`;
                toastContainer.appendChild(toast);
                setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 2600);

            function formatBytes(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            function getTotalSize() {
                return allImages.reduce((sum, img) => sum + (img.fileBlob ? img.fileBlob.size : 0), 0);

                totalSizeValue.textContent = formatBytes(getTotalSize());
