<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAI 提示词管理器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* === 原有样式保持不变 === */
        :root {
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --sidebar-bg: #1e2a3a;
            --sidebar-text: #e0e6ed;
            --primary: #4a6cf7;
            --primary-hover: #3b5de7;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --success: #27ae60;
            --warning: #f39c12;
            --text: #2c3e50;
            --text-secondary: #7f8c8d;
            --border: #e1e5eb;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.15);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 5px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            --header-height: 60px;
            --filter-height: 48px;
            --tag-color-bg: #eef1ff;
            --tag-color-text: #4a6cf7;
            --tag-color-border: #d5dcff;
            --label-palette: #eef1ff, #fdf0ef, #eef7f0, #fff8e1, #f3e8ff, #e8f4fd, #fde8e8, #e8fde8,
                #f0e8fd, #fde8f0, #e8f0fd, #fdf0e8, #e8fdf0, #f0f0e8, #e8e8fd, #fde8e8;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c0c4cc;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a0a4ac;
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .app-header .logo i {
            color: #6c8cff;
            font-size: 22px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: nowrap;
        }
        .header-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            white-space: nowrap;
            font-family: var(--font);
        }
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.35);
        }
        .header-btn i {
            font-size: 14px;
        }
        .header-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
        }
        .header-btn.primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        .header-btn.danger {
            background: var(--danger);
            border-color: var(--danger);
        }
        .header-btn.danger:hover {
            background: var(--danger-hover);
            border-color: var(--danger-hover);
        }

        .total-size-display {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #b0b8c4;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 10px;
            border-radius: 20px;
            white-space: nowrap;
            user-select: none;
        }
        .total-size-display i {
            font-size: 11px;
        }
        .total-size-display span {
            font-weight: 600;
        }

        .filter-bar {
            position: sticky;
            top: var(--header-height);
            z-index: 90;
            background: var(--card-bg);
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            min-height: var(--filter-height);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        .filter-bar .filter-label {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            white-space: nowrap;
        }
        .filter-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }
        .filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #eef1ff;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid #d5dcff;
        }
        .filter-tag:hover {
            background: #dfe5ff;
        }
        .filter-tag i {
            font-size: 10px;
            cursor: pointer;
            opacity: 0.7;
        }
        .filter-tag i:hover {
            opacity: 1;
        }
        .clear-filter-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: var(--transition);
            font-family: var(--font);
        }
        .clear-filter-btn:hover {
            color: var(--danger);
            background: #fef0ef;
        }
        .download-actions {
            display: none;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .download-actions.active {
            display: flex;
        }
        .download-actions .btn-sm {
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #f8f9fa;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .download-actions .btn-sm:hover {
            background: #e9ecef;
        }
        .download-actions .btn-sm.primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .download-actions .btn-sm.primary:hover {
            background: var(--primary-hover);
        }
        .download-actions .btn-sm.danger {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }
        .download-actions .btn-sm.danger:hover {
            background: var(--danger-hover);
        }

        .weight-filter-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            width: 100%;
            padding-top: 6px;
            border-top: 1px dashed var(--border);
            margin-top: 6px;
        }
        .weight-filter-bar .weight-filter-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .weight-filter-bar .weight-capsule {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f0f2f5;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid #d0d5dd;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }
        .weight-filter-bar .weight-capsule:hover {
            background: #e0e5ff;
            border-color: var(--primary);
        }
        .weight-filter-bar .weight-capsule.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .weight-filter-bar .weight-capsule .weight-count {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 0 5px;
            font-size: 10px;
            font-weight: 700;
        }
        .weight-filter-bar .weight-capsule.active .weight-count {
            background: rgba(255, 255, 255, 0.3);
        }

        .main-content {
            display: flex;
            min-height: calc(100vh - var(--header-height) - var(--filter-height));
        }
        .gallery {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }
        .gallery-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
            color: var(--text-secondary);
            gap: 14px;
            text-align: center;
            padding: 20px;
        }
        .gallery-empty i {
            font-size: 60px;
            opacity: 0.4;
        }
        .gallery-empty p {
            font-size: 15px;
            max-width: 320px;
            line-height: 1.6;
        }
        .gallery-empty .upload-hint-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .gallery-empty .upload-hint-btn:hover {
            background: var(--primary-hover);
        }

        .image-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
        }
        .image-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }
        .image-card.selected {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.2);
        }
        .image-card .thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            background: #f0f0f0;
            flex-shrink: 0;
        }
        .image-card .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .image-card:hover .thumb-wrapper img {
            transform: scale(1.04);
        }
        .image-card .select-checkbox {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
            z-index: 5;
            display: none;
        }
        .image-card .select-checkbox.show {
            display: block;
        }
        .image-card .card-info {
            padding: 10px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .image-card .card-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .image-card .card-prompt-preview {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-all;
        }
        .image-card .card-actions {
            display: flex;
            gap: 4px;
            padding: 6px 8px;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
        }
        .card-action-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            padding: 5px 8px;
            cursor: pointer;
            font-size: 11px;
            color: var(--text-secondary);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 3px;
            font-family: var(--font);
            flex: 1;
            justify-content: center;
        }
        .card-action-btn:hover {
            background: #f5f6fa;
            color: var(--text);
        }
        .card-action-btn.copy-pos:hover {
            background: #eef7f0;
            color: var(--success);
            border-color: var(--success);
        }
        .card-action-btn.copy-neg:hover {
            background: #fdf0ef;
            color: var(--danger);
            border-color: var(--danger);
        }
        .card-action-btn.delete-btn:hover {
            background: #fdf0ef;
            color: var(--danger);
            border-color: var(--danger);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 400;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            backdrop-filter: blur(3px);
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 1;
        }
        .modal-header h3 {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }
        .modal-close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: var(--transition);
        }
        .modal-close-btn:hover {
            background: #f0f0f0;
            color: var(--text);
        }
        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-image-container {
            width: 100%;
            max-height: 320px;
            display: flex;
            justify-content: center;
            background: #f8f9fa;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .modal-image-container img {
            max-width: 100%;
            max-height: 320px;
            object-fit: contain;
        }
        .modal-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .modal-section .section-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .prompt-text {
            background: #f8f9fa;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            line-height: 1.6;
            word-break: break-all;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            border: 1px solid #e8e8e8;
        }
        .prompt-text.negative {
            border-left: 3px solid var(--danger);
        }
        .prompt-text.positive {
            border-left: 3px solid var(--success);
        }
        .copy-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .copy-btn {
            background: #f0f2f5;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
            font-family: var(--font);
            color: var(--text);
        }
        .copy-btn:hover {
            background: #e4e7eb;
        }
        .copy-btn.positive-btn:hover {
            background: #eef7f0;
            color: var(--success);
            border-color: var(--success);
        }
        .copy-btn.negative-btn:hover {
            background: #fdf0ef;
            color: var(--danger);
            border-color: var(--danger);
        }
        .params-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
        }
        .param-item {
            background: #f8f9fa;
            padding: 8px 10px;
            border-radius: var(--radius-xs);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            border: 1px solid #e8e8e8;
        }
        .param-item .param-key {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .param-item .param-value {
            font-weight: 500;
            word-break: break-all;
        }

        .token-sidebar {
            position: fixed;
            top: 0;
            right: -440px;
            width: 420px;
            max-width: 95vw;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
            z-index: 300;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        .token-sidebar.active {
            right: 0;
        }
        .token-sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--sidebar-bg);
            color: #fff;
        }
        .token-sidebar-header h3 {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .token-sidebar-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: var(--transition);
        }
        .token-sidebar-close:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .token-tabs {
            display: flex;
            gap: 4px;
            padding: 10px 16px;
            background: #f8f9fa;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .token-tab {
            padding: 7px 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: var(--transition);
            font-family: var(--font);
            background: transparent;
            color: var(--text-secondary);
        }
        .token-tab.active {
            background: var(--primary);
            color: #fff;
        }
        .token-tab:hover:not(.active) {
            background: #e9ecf5;
        }
        .token-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .token-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            gap: 8px;
            flex-wrap: wrap;
        }
        .token-item:hover {
            background: #eef1ff;
            border-color: #d5dcff;
        }
        .token-item .token-name {
            font-size: 12px;
            font-weight: 500;
            word-break: break-all;
            flex: 1;
            line-height: 1.3;
            cursor: pointer;
            min-width: 60px;
        }
        .token-item .token-name .token-translation {
            color: var(--text-secondary);
            font-style: italic;
            font-size: 11px;
            margin-left: 4px;
        }
        .token-item .token-count {
            font-size: 11px;
            color: var(--text-secondary);
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .token-item .token-count.pos {
            background: #d4edda;
            color: #155724;
        }
        .token-item .token-count.neg {
            background: #f8d7da;
            color: #721c24;
        }
        .token-item .filter-token-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            padding: 4px;
            border-radius: 4px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .token-item .filter-token-btn:hover {
            color: var(--primary);
            background: #e0e5ff;
        }
        .token-item .tag-badge {
            display: inline-flex;
            align-items: center;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: 500;
            flex-shrink: 0;
            cursor: pointer;
            transition: var(--transition);
        }
        .token-item .tag-badge:hover {
            opacity: 0.8;
        }
        .token-item .tag-badge.more-tags {

            background: #f8d7da;
        }
        .blocked-token-chip.selected {
            background: #f5c6cb;
            border-color: #e74c3c;
            box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.2);
        }
        .blocked-token-chip .chip-translation {
            font-style: italic;
            font-size: 10px;
            color: #a94442;
        }

        /* 导出对话框 */
        .export-option-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: #f8f9fa;
            border-radius: var(--radius-sm);
            border: 1px solid #e8e8e8;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }
        .export-option-row:hover {
            background: #f0f2f5;
            border-color: #d0d5dd;
        }
        .export-option-row input[type="radio"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .export-option-row .export-option-label {
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }
        .export-option-row .export-option-desc {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .export-option-row .export-option-count {
            font-size: 11px;
            font-weight: 600;
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* 翻译编辑弹窗 */
        .translate-edit-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .translate-edit-row input {
            flex: 1;
            min-width: 150px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: var(--font);
            outline: none;
            transition: var(--transition);
        }
        .translate-edit-row input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.1);
        }
        .translate-edit-row .translate-save-btn {
            padding: 8px 16px;
            background: var(--success);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
            font-family: var(--font);
            white-space: nowrap;
        }
        .translate-edit-row .translate-save-btn:hover {
            background: #219a52;
        }

        @media (max-width:768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
                padding: 10px;
            }
            .app-header {
                padding: 0 10px;
                height: 52px;
            }
            .app-header .logo span {
                font-size: 14px;
            }
            .header-btn {
                padding: 6px 10px;
                font-size: 11px;
                gap: 4px;
            }
            .header-btn i {
                font-size: 12px;
            }
            .filter-bar {
                padding: 6px 10px;
                top: 52px;
            }
            .main-content {
                min-height: calc(100vh - 52px - 44px);
            }
            .token-sidebar {
                width: 100%;
                max-width: 100%;
            }
            .modal-content {
                max-height: 95vh;
            }
            .modal-body {
                padding: 12px;
            }
            .sim-pair {
                flex-direction: column;
                align-items: flex-start;
            }
            .sim-pair .sim-thumbs img {
                width: 40px;
                height: 40px;
            }
            .header-btn .btn-text {
                display: none;
            }
            .header-btn {
                padding: 7px 9px;
            }
            .sim-pair .sim-actions {
                width: 100%;
                justify-content: flex-end;
            }
            .download-actions {
                width: 100%;
            }
            .total-size-display {
                font-size: 10px;
                padding: 2px 8px;
            }
            .weight-filter-bar {
                padding-top: 4px;
                margin-top: 4px;
            }
            .weight-filter-bar .weight-filter-label {
                font-size: 11px;
            }
            .weight-filter-bar .weight-capsule {
                padding: 3px 8px;
                font-size: 11px;
            }
            .tag-filter-bar {
                padding: 6px 8px;
            }
            .tag-filter-capsule {
                font-size: 10px;
                padding: 3px 8px;
            }
            .token-toolbar {
                padding: 4px 8px;
            }
            .token-toolbar .toolbar-btn {
                font-size: 10px;
                padding: 4px 8px;
            }
            .token-sidebar {
                width: 100%;
                max-width: 100%;
                right: -100%;
            }
            .token-sidebar.active {
                right: 0;
            }
            .batch-action-bar {
                padding: 6px 8px;
            }
            .batch-action-bar .batch-btn {
                font-size: 10px;
                padding: 4px 8px;
            }
            .pagination-bar {
                padding: 10px 4px;
                gap: 4px;
            }
            .pagination-btn {
                padding: 5px 8px;
                font-size: 11px;
                min-width: 28px;
            }
            .page-size-selector {
                font-size: 11px;
                margin-left: 0;
                width: 100%;
                justify-content: center;
            }
            .blocked-group-header {
                padding: 6px 8px;
            }
            .blocked-group-header .group-actions .mini-btn {
                font-size: 9px;
                padding: 2px 6px;
            }
            .blocked-token-chip {
                font-size: 10px;
                padding: 3px 8px;
            }
        }
        @media (max-width:480px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
                padding: 8px;
            }
            .image-card .card-info {
                padding: 6px 8px;
            }
            .image-card .card-name {
                font-size: 11px;
            }
            .image-card .card-prompt-preview {
                font-size: 10px;
                -webkit-line-clamp: 1;
            }
            .card-action-btn {
                padding: 4px 6px;
                font-size: 10px;
            }
            .params-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .modal-body {
                padding: 10px;
                gap: 10px;
            }
            .prompt-text {
                font-size: 11px;
                max-height: 120px;
                padding: 8px;
            }
            .sim-pair .sim-actions {
                flex-wrap: wrap;
            }
            .download-actions .btn-sm {
                font-size: 10px;
                padding: 4px 6px;
            }
            .token-item {
                padding: 6px 8px;
                gap: 4px;
            }
            .token-item .token-name {
                font-size: 11px;
            }
            .token-item .tag-badge {
                font-size: 9px;
                padding: 1px 4px;
            }
            .token-item .token-count {
                font-size: 10px;
                padding: 1px 6px;
            }
            .token-item .token-action-btn {
                font-size: 10px;
                padding: 3px;
            }
            .pagination-btn.page-num {
                min-width: 26px;
                padding: 4px 6px;
                font-size: 10px;
            }
            .blocked-group-header .group-title {
                font-size: 11px;
            }
            .blocked-token-chip {
                font-size: 9px;
                padding: 2px 6px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部栏 -->
    <header class="app-header">
        <div class="logo">
            <i class="fas fa-wand-magic-sparkles"></i>
            <span>NAI 提示词管理器</span>
        </div>
        <div class="header-actions">
            <div class="total-size-display" id="totalSizeDisplay">
                <i class="fas fa-database"></i>
                <span id="totalSizeText">0 条记录</span>
            </div>
            <button class="header-btn" id="btnUpload" title="上传图片">
                <i class="fas fa-upload"></i><span class="btn-text">上传</span>
            </button>
            <button class="header-btn primary" id="btnTokenSidebar" title="词条管理">
                <i class="fas fa-list-ul"></i><span class="btn-text">词条</span>
            </button>
            <button class="header-btn" id="btnExportTokens" title="导出词条">
                <i class="fas fa-file-export"></i><span class="btn-text">导出</span>
            </button>
            <button class="header-btn danger" id="btnClearAll" title="清空全部">
                <i class="fas fa-trash-can"></i>
            </button>
        </div>
    </header>
    <input type="file" id="fileInput" accept="image/*" multiple>

    <!-- 筛选栏 -->
    <div class="filter-bar" id="filterBar">
        <span class="filter-label"><i class="fas fa-filter"></i> 筛选:</span>
        <div class="filter-tags" id="filterTagsContainer"></div>
        <button class="clear-filter-btn" id="clearFilterBtn"><i class="fas fa-times-circle"></i> 清除</button>
        <div class="download-actions" id="downloadActions">
            <button class="btn-sm danger" id="btnBatchDelete"><i class="fas fa-trash"></i> 删除</button>
            <button class="btn-sm" id="btnBatchCopyPos"><i class="fas fa-copy"></i> 复制正向</button>
            <button class="btn-sm" id="btnBatchCopyNeg"><i class="fas fa-copy"></i> 复制负向</button>
            <button class="btn-sm primary" id="btnBatchDownload"><i class="fas fa-download"></i> 下载</button>
        </div>
        <div class="weight-filter-bar" id="weightFilterBar">
            <span class="weight-filter-label"><i class="fas fa-weight-scale"></i> 权重:</span>
            <span class="weight-capsule active" data-weight-filter="all">全部</span>
            <span class="weight-capsule" data-weight-filter="high">高权重 <span class="weight-count">(≥1.3)</span></span>
            <span class="weight-capsule" data-weight-filter="normal">普通 <span class="weight-count">(0.8~1.3)</span></span>
            <span class="weight-capsule" data-weight-filter="low">低权重 <span class="weight-count">(<0.8)</span></span>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <div class="gallery" id="gallery">
            <div class="gallery-grid" id="galleryGrid"></div>
            <div class="pagination-bar" id="paginationBar" style="display:none;"></div>
            <div class="gallery-empty" id="galleryEmpty">
                <i class="fas fa-images"></i>
                <p>暂无图片。上传带有NAI格式提示词的图片开始管理。</p>
                <button class="upload-hint-btn" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-upload"></i> 上传图片
                </button>
            </div>
        </div>
    </div>

    <!-- 图片详情弹窗 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="detailModalTitle">图片详情</h3>
                <button class="modal-close-btn" onclick="closeDetailModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="detailModalBody"></div>
        </div>
    </div>

    <!-- 词条侧边栏 -->
    <div class="token-sidebar" id="tokenSidebar">
        <div class="token-sidebar-header">
            <h3><i class="fas fa-list-ul"></i> 词条管理</h3>
            <button class="token-sidebar-close" onclick="toggleTokenSidebar(false)"><i class="fas fa-times"></i></button>
        </div>
        <div class="token-tabs" id="tokenTabs">
            <button class="token-tab active" data-tab="positive">正向词</button>
            <button class="token-tab" data-tab="negative">负向词</button>
            <button class="token-tab" data-tab="blocked">已屏蔽</button>
        </div>
        <div class="token-search">
            <i class="fas fa-search"></i>
            <input type="text" id="tokenSearchInput" placeholder="搜索词条...">
        </div>
        <div class="tag-filter-bar" id="tagFilterBar"></div>
        <div class="token-toolbar" id="tokenToolbar">
            <button class="toolbar-btn" id="btnToggleSelect"><i class="fas fa-check-square"></i> 多选</button>
            <button class="toolbar-btn tag-manage-btn" id="btnTagManage"><i class="fas fa-tags"></i> 标签管理</button>
            <button class="toolbar-btn" id="btnAutoBlockSettings"><i class="fas fa-ban"></i> 自动屏蔽设置</button>
            <button class="toolbar-btn" id="btnExportTokenList"><i class="fas fa-file-export"></i> 导出</button>
        </div>
        <div class="token-list" id="tokenList"></div>
        <div class="batch-action-bar" id="batchActionBar">
            <button class="batch-btn danger" id="btnBatchBlock"><i class="fas fa-ban"></i> 批量屏蔽</button>
            <button class="batch-btn" id="btnBatchUnblock"><i class="fas fa-check"></i> 取消屏蔽</button>
            <button class="batch-btn" id="btnBatchTag"><i class="fas fa-tags"></i> 打标签</button>
            <span class="batch-selected-count" id="batchSelectedCount">已选 0 项</span>
        </div>
    </div>

    <!-- 标签管理弹窗 -->
    <div class="modal-overlay" id="tagManageModal">
        <div class="modal-content" style="max-width:500px;">
            <div class="modal-header">
                <h3><i class="fas fa-tags"></i> 标签管理</h3>
                <button class="modal-close-btn" onclick="closeTagManage()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="tag-add-row">
                    <input type="text" id="newTagNameInput" placeholder="输入新标签名...">
                    <button class="tag-add-btn" onclick="addNewTag()"><i class="fas fa-plus"></i> 添加</button>
                </div>
                <div class="tag-manage-list" id="tagManageList"></div>
            </div>
        </div>
    </div>

    <!-- 标签选择弹窗 -->
    <div class="modal-overlay" id="tagSelectorModal">
        <div class="modal-content" style="max-width:500px;">
            <div class="modal-header">
                <h3><i class="fas fa-tags"></i> 选择标签</h3>
                <button class="modal-close-btn" onclick="closeTagSelector()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="tag-selector-list" id="tagSelectorList"></div>
                <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
                    <button class="copy-btn" onclick="closeTagSelector()">取消</button>
                    <button class="copy-btn" style="background:var(--primary);color:#fff;border-color:var(--primary);" onclick="confirmTagSelection()">确认</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 自动屏蔽设置弹窗 -->
    <div class="modal-overlay" id="autoBlockModal">
        <div class="modal-content" style="max-width:450px;">
            <div class="modal-header">
                <h3><i class="fas fa-ban"></i> 自动屏蔽设置</h3>
                <button class="modal-close-btn" onclick="closeAutoBlockSettings()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="block-settings-row">
                    <input type="checkbox" id="autoBlockEnabled">
                    <div>
                        <div class="block-label">启用自动屏蔽</div>
                        <div class="block-desc">自动屏蔽出现频率超过阈值的词条</div>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:12px;">
                    <span style="font-size:13px;font-weight:500;">频率阈值:</span>
                    <input type="number" id="autoBlockThreshold" value="15" min="2" max="100" style="width:70px;padding:6px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:13px;">
                    <span style="font-size:12px;color:var(--text-secondary);">次</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 导出词条弹窗 -->
    <div class="modal-overlay" id="exportTokenModal">
        <div class="modal-content" style="max-width:500px;">
            <div class="modal-header">
                <h3><i class="fas fa-file-export"></i> 导出词条</h3>
                <button class="modal-close-btn" onclick="closeExportTokenModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p style="font-size:13px;color:var(--text-secondary);">选择要导出的词条类型：</p>
                <div class="export-option-row" onclick="selectExportType('positive')">
                    <input type="radio" name="exportType" id="exportTypePos" checked>
                    <div class="export-option-label"><i class="fas fa-plus-circle" style="color:var(--success);"></i> 正向词条</div>
                    <span class="export-option-count" id="exportPosCount">0 个</span>
                </div>
                <div class="export-option-row" onclick="selectExportType('negative')">
                    <input type="radio" name="exportType" id="exportTypeNeg">
                    <div class="export-option-label"><i class="fas fa-minus-circle" style="color:var(--danger);"></i> 负向词条</div>
                    <span class="export-option-count" id="exportNegCount">0 个</span>
                </div>
                <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
                    <button class="copy-btn" onclick="closeExportTokenModal()">取消</button>
                    <button class="copy-btn" style="background:var(--primary);color:#fff;border-color:var(--primary);" onclick="confirmExportTokens()">
                        <i class="fas fa-download"></i> 导出
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 翻译编辑弹窗 -->
    <div class="modal-overlay" id="translateModal">
        <div class="modal-content" style="max-width:420px;">
            <div class="modal-header">
                <h3><i class="fas fa-language"></i> 编辑翻译</h3>
                <button class="modal-close-btn" onclick="closeTranslateModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p style="font-size:13px;">词条: <strong id="translateTokenName"></strong></p>
                <div class="translate-edit-row">
                    <input type="text" id="translateInput" placeholder="输入中文翻译...">
                    <button class="translate-save-btn" onclick="saveTranslation()"><i class="fas fa-check"></i> 保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 相似度对比弹窗 -->
    <div class="similarity-overlay" id="similarityOverlay">
        <div class="similarity-panel">
            <div class="similarity-header">
                <h3><i class="fas fa-code-compare"></i> 相似图片分析</h3>
                <button class="modal-close-btn" onclick="closeSimilarity()"><i class="fas fa-times"></i></button>
            </div>
            <div class="similarity-body" id="similarityBody"></div>
        </div>
    </div>

    <!-- 图片差异对比弹窗 -->
    <div class="modal-overlay" id="diffModal">
        <div class="modal-content" style="max-width:700px;">
            <div class="modal-header">
                <h3><i class="fas fa-code-compare"></i> 提示词差异对比</h3>
                <button class="modal-close-btn" onclick="closeDiffModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="diffModalBody"></div>
        </div>
    </div>

    <!-- Toast容器 -->
    <div class="toast-container" id="toastContainer"></div>

        // ==================== 全局状态 ====================
        let images = [];
        let tokens = {}; // { tokenName: { token, countPos, countNeg, weight, tags: Set, blocked: Set, translation } }
        let tags = []; // { name, color, blocked }
        let blockedTokens = {}; // { tokenName: { type: 'manual'|'auto'|'tag', tagName? } }
        let selectedImageIds = new Set();
        let selectedTokenNames = new Set();
        let tokenFilterState = {
            tab: 'positive',
            search: '',
            tagFilter: null,
            weightFilter: 'all',
            selectMode: false
        };
        let currentPage = 1;
        let pageSize = 20;
        let autoBlockSettings = { enabled: false, threshold: 15 };
        let currentTagSelectorTarget = null;
        let currentTranslateTarget = null;
        let currentExportType = 'positive';
        let currentComparePair = null;

        // ==================== 工具函数 ====================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' :
                'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 2500);
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        function updateTotalSize() {
            const totalBytes = images.reduce((sum, img) => sum + (img.fileSize || 0), 0);
            const el = document.getElementById('totalSizeText');
            el.textContent = `${images.length} 条 | ${formatFileSize(totalBytes)}`;
        }

        // ==================== 词条解析 ====================
        function parsePromptTokens(prompt) {
            const result = [];
            if (!prompt) return result;
            const regex = /[\(\[\{]([^\)\]\}]+?)(?::(\d+\.?\d*))?[\)\]\}]|([^,\s]+)/g;
            let match;
            while ((match = regex.exec(prompt)) !== null) {
                let token = match[1] || match[3];
                let weight = match[2] ? parseFloat(match[2]) : 1.0;
                if (match[1]) {
                    if (match[0].startsWith('(')) {
                        if (!match[2]) weight = 1.1;
                    } else if (match[0].startsWith('[')) {
                        if (!match[2]) weight = 0.9;
                    } else {
                        weight = match[2] ? parseFloat(match[2]) : 1.0;
                    }
                }
                if (token) {
                    token = token.trim();
                    if (token) result.push({ token, weight });
                }
            }
            return result;
        }

        function rebuildTokens() {
            tokens = {};
            images.forEach(img => {
                const posTokens = parsePromptTokens(img.prompt);
                const negTokens = parsePromptTokens(img.negativePrompt);
                posTokens.forEach(t => {
                    const key = t.token.toLowerCase();
                    if (!tokens[key]) {
                        tokens[key] = { token: t.token, countPos: 0, countNeg: 0, weight: t.weight, tags: new Set(),
                            blocked: new Set(), translation: BUILTIN_TRANSLATIONS[key] || '' };
                    }
                    tokens[key].countPos++;
                    tokens[key].weight = tokens[key].weight === 0 ? t.weight : (tokens[key].weight + t.weight) / 2;
                });
                negTokens.forEach(t => {
                    const key = t.token.toLowerCase();
                    if (!tokens[key]) {
                        tokens[key] = { token: t.token, countPos: 0, countNeg: 0, weight: t.weight, tags: new Set(),
                            blocked: new Set(), translation: BUILTIN_TRANSLATIONS[key] || '' };
                    }
                    tokens[key].countNeg++;
                    tokens[key].weight = tokens[key].weight === 0 ? t.weight : (tokens[key].weight + t.weight) / 2;
                });
            });
            // 恢复屏蔽信息
            Object.keys(blockedTokens).forEach(key => {
                if (tokens[key]) {
                    const b = blockedTokens[key];
                    if (b.type === 'manual') tokens[key].blocked.add('manual');
                    else if (b.type === 'auto') tokens[key].blocked.add('auto');
                    else if (b.type === 'tag') tokens[key].blocked.add('tag:' + b.tagName);
                }
            });
            // 自动屏蔽
            if (autoBlockSettings.enabled) {
                Object.keys(tokens).forEach(key => {
                    const t = tokens[key];
                    if (t.countPos + t.countNeg >= autoBlockSettings.threshold && !t.blocked.has('auto')) {
                        t.blocked.add('auto');
                        blockedTokens[key] = { type: 'auto' };
                    }
                });
            }
        }

        function isTokenBlocked(tokenKey) {
            const t = tokens[tokenKey];
            if (!t) return false;
            return t.blocked.size > 0;
        }

        function getBlockTypes(tokenKey) {
            const t = tokens[tokenKey];
            if (!t) return [];
            return Array.from(t.blocked);
        }

        function getBlockTypeDisplay(type) {
            if (type === 'manual') return '手动屏蔽';
            if (type === 'auto') return '自动屏蔽';
            if (type.startsWith('tag:')) return '标签屏蔽';
            return type;
        }

        function toggleTokenBlock(tokenKey, blockType = 'manual', tagName = null) {
            const t = tokens[tokenKey];
            if (!t) return;
            const blockKey = blockType === 'tag' ? 'tag:' + tagName : blockType;
            if (t.blocked.has(blockKey)) {
                t.blocked.delete(blockKey);
                if (blockType === 'manual') delete blockedTokens[tokenKey];
                else if (blockType === 'auto') delete blockedTokens[tokenKey];
                else if (blockType === 'tag') delete blockedTokens[tokenKey];
                showToast(`已取消屏蔽: ${t.token}`, 'success');
            } else {
                t.blocked.add(blockKey);
                blockedTokens[tokenKey] = { type: blockType, tagName: tagName };
                showToast(`已屏蔽: ${t.token}`, 'info');
            }
            renderTokenList();
            renderBlockedGroups();
        }

        function batchUnblockTokens(tokenKeys) {
            let count = 0;
            tokenKeys.forEach(key => {
                const t = tokens[key];
                if (t && t.blocked.size > 0) {
                    t.blocked.clear();
                    delete blockedTokens[key];
                    count++;
                }
            });
            showToast(`已取消屏蔽 ${count} 个词条`, 'success');
            renderTokenList();
            renderBlockedGroups();
        }

        function batchBlockTokens(tokenKeys) {
            let count = 0;
            tokenKeys.forEach(key => {
                const t = tokens[key];
                if (t && !t.blocked.has('manual')) {
                    t.blocked.add('manual');
                    blockedTokens[key] = { type: 'manual' };
                    count++;
                }
            });
            showToast(`已屏蔽 ${count} 个词条`, 'info');
            renderTokenList();
            renderBlockedGroups();
        }

        // ==================== 标签系统 ====================
        function getTagColor(index) {
            const colors = ['#4a6cf7', '#e74c3c', '#27ae60', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#e84393',
                '#00b894', '#6c5ce7', '#fd79a8', '#00cec9', '#fdcb6e', '#e17055', '#0984e3', '#d63031'
            ];
            return colors[index % colors.length];
        }

        function addTagToToken(tokenKey, tagName) {
            const t = tokens[tokenKey];
            if (!t) return;
            t.tags.add(tagName);
            if (!tags.find(tag => tag.name === tagName)) {
                tags.push({ name: tagName, color: getTagColor(tags.length), blocked: false });
            }
            renderTokenList();
            renderTagFilterBar();
            renderTagManageList();
        }

        function removeTagFromToken(tokenKey, tagName) {
            const t = tokens[tokenKey];
            if (!t) return;
            t.tags.delete(tagName);
            renderTokenList();
        }

        function toggleTagBlocked(tagName) {
            const tag = tags.find(t => t.name === tagName);
            if (!tag) return;
            tag.blocked = !tag.blocked;
            // 屏蔽/取消屏蔽该标签下的所有词条
            Object.keys(tokens).forEach(key => {
                const t = tokens[key];
                if (t.tags.has(tagName)) {
                    if (tag.blocked) {
                        t.blocked.add('tag:' + tagName);
                        blockedTokens[key] = { type: 'tag', tagName: tagName };
                    } else {
                        t.blocked.delete('tag:' + tagName);
                        delete blockedTokens[key];
                    }
                }
            });
            renderTokenList();
            renderBlockedGroups();
            renderTagManageList();
            showToast(`标签「${tagName}」${tag.blocked ? '已屏蔽' : '已取消屏蔽'}`, tag.blocked ? 'info' : 'success');
        }

        function deleteTag(tagName) {
            tags = tags.filter(t => t.name !== tagName);
            Object.keys(tokens).forEach(key => {
                const t = tokens[key];
                if (t.tags.has(tagName)) {
                    t.tags.delete(tagName);
                    t.blocked.delete('tag:' + tagName);
                }
            });
            renderTokenList();
            renderTagFilterBar();
            renderTagManageList();
            showToast(`标签「${tagName}」已删除`, 'info');
        }

        // ==================== 图片管理 ====================
        function handleFileUpload(files) {
            const validFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
            if (validFiles.length === 0) {
                showToast('请选择图片文件', 'error');
                return;
            }
            let loadedCount = 0;
            validFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        // 尝试从PNG文本块读取提示词
                        let prompt = '';
                        let negativePrompt = '';
                        let params = {};
                        try {
                            const pngText = extractPngText(file);
                            if (pngText) {
                                const parsed = parsePngText(pngText);
                                prompt = parsed.prompt;
                                negativePrompt = parsed.negativePrompt;
                                params = parsed.params;
                            }
                        } catch (err) { /* 忽略 */ }

                        images.push({
                            id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                            fileName: file.name,
                            fileSize: file.size,
                            dataUrl: e.target.result,
                            prompt: prompt || '未找到提示词',
                            negativePrompt: negativePrompt || '',
                            params: params
                        });
                        loadedCount++;
                        if (loadedCount === validFiles.length) {
                            rebuildTokens();
                            renderGallery();
                            renderTokenList();
                            renderBlockedGroups();
                            updateTotalSize();
                            showToast(`成功导入 ${loadedCount} 张图片`, 'success');
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function extractPngText(file) {
            // 简化版PNG文本提取
            return null;
        }

        function parsePngText(text) {
            let prompt = '';
            let negativePrompt = '';
            let params = {};
            const lines = text.split('\n');
            lines.forEach(line => {
                if (line.startsWith('Negative prompt:')) {
                    negativePrompt = line.replace('Negative prompt:', '').trim();
                } else if (line.startsWith('Steps:')) {
                    const parts = line.split(',');
                    parts.forEach(p => {
                        const kv = p.trim().split(':');
                        if (kv.length === 2) params[kv[0].trim()] = kv[1].trim();
                    });
                } else if (line.trim() && !line.startsWith('Negative prompt:') && !line.startsWith('Steps:')) {
                    prompt += line.trim() + ' ';
                }
            });
            return { prompt: prompt.trim(), negativePrompt, params };
        }

                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                showToast(`${label}已复制`, 'success');
            });
        }

        function renderPagination(totalPages, totalItems) {
            const bar = document.getElementById('paginationBar');
            if (totalPages <= 1 && pageSize >= totalItems) {
                bar.style.display = 'none';
                return;
            }
            bar.style.display = 'flex';
            bar.innerHTML = '';

            const pageSizeOptions = [10, 20, 50, 100];
            if (!pageSizeOptions.includes(pageSize)) pageSizeOptions.push(pageSize);
            pageSizeOptions.sort((a, b) => a - b);

            const pageSizeSelector = document.createElement('div');
            pageSizeSelector.className = 'page-size-selector';
            pageSizeSelector.innerHTML = `
                <span>每页</span>
                <select id="pageSizeSelect">
                    ${pageSizeOptions.map(s => `<option value="${s}" ${s === pageSize ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
                <span>张</span>
            `;
            bar.appendChild(pageSizeSelector);

            const pageInfo = document.createElement('span');
            pageInfo.className = 'page-info';
            pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页 (共${totalItems}张)`;
            bar.appendChild(pageInfo);

            const btnContainer = document.createElement('div');
            btnContainer.style.cssText = 'display:flex;gap:4px;flex-wrap:wrap;align-items:center;';

            const prevBtn = document.createElement('button');
            prevBtn.className = 'pagination-btn';
            prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
            prevBtn.disabled = currentPage <= 1;
            prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--;
                    renderGallery(); } });
            btnContainer.appendChild(prevBtn);

            const maxVisible = 7;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            if (endPage - startPage < maxVisible - 1) startPage = Math.max(1, endPage - maxVisible + 1);

            if (startPage > 1) {
                const firstBtn = document.createElement('button');
                firstBtn.className = 'pagination-btn page-num';
                firstBtn.textContent = '1';
                firstBtn.addEventListener('click', () => { currentPage = 1;
                    renderGallery(); });
                btnContainer.appendChild(firstBtn);
                if (startPage > 2) {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '...';
                    ellipsis.style.cssText = 'padding:0 4px;color:var(--text-secondary);font-size:12px;';
                    btnContainer.appendChild(ellipsis);
                }
            }
            for (let i = startPage; i <= endPage; i++) {
                const btn = document.createElement('button');
                btn.className = 'pagination-btn page-num' + (i === currentPage ? ' active' : '');
                btn.textContent = i;
                btn.addEventListener('click', () => { currentPage = i;
                    renderGallery(); });
                btnContainer.appendChild(btn);
            }
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '...';
                    ellipsis.style.cssText = 'padding:0 4px;color:var(--text-secondary);font-size:12px;';
                    btnContainer.appendChild(ellipsis);
                }
                const lastBtn = document.createElement('button');
                lastBtn.className = 'pagination-btn page-num';
                lastBtn.textContent = totalPages;
                lastBtn.addEventListener('click', () => { currentPage = totalPages;
                    renderGallery(); });
                btnContainer.appendChild(lastBtn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'pagination-btn';
            nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
            nextBtn.disabled = currentPage >= totalPages;
            nextBtn.addEventListener('click', () => { if (currentPage < totalPages) { currentPage++;
                    renderGallery(); } });
            btnContainer.appendChild(nextBtn);

            bar.appendChild(btnContainer);

            document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
                pageSize = parseInt(e.target.value);
                currentPage = 1;
                renderGallery();
            });
        }

        function getFilteredTokens() {
            const { tab, search, tagFilter, weightFilter } = tokenFilterState;
            let list = Object.keys(tokens);
            list = list.filter(key => {
                const t = tokens[key];
                const isBlocked = t.blocked.size > 0;
                if (tab === 'positive' && isBlocked) return false;
                if (tab === 'negative' && isBlocked) return false;
                if (tab === 'blocked' && !isBlocked) return false;
                if (tab === 'positive' && t.countPos === 0) return false;
                if (tab === 'negative' && t.countNeg === 0) return false;
                if (search && !t.token.toLowerCase().includes(search.toLowerCase()) &&
                    !(t.translation && t.translation.includes(search))) return false;
                if (tagFilter && !t.tags.has(tagFilter)) return false;
                if (weightFilter === 'high' && t.weight < 1.3) return false;
                if (weightFilter === 'normal' && (t.weight < 0.8 || t.weight >= 1.3)) return false;
                if (weightFilter === 'low' && t.weight >= 0.8) return false;
                return true;
            });
            list.sort((a, b) => {
                const ta = tokens[a],
                    tb = tokens[b];
                if (tab === 'positive') return tb.countPos - ta.countPos;
                if (tab === 'negative') return tb.countNeg - ta.countNeg;
                return (tb.countPos + tb.countNeg) - (ta.countPos + ta.countNeg);
            });
            return list;
        }
