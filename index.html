<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAI解析 - 词条库导出与AI标注导入</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4a6cf7;
            --primary-light: #eef1ff;
            --danger: #e74c3c;
            --danger-light: #fdf0ef;
            --success: #27ae60;
            --warning: #f39c12;
            --text: #2c3e50;
            --text-secondary: #7f8c8d;
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --border: #e8ecf4;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --radius-sm: 8px;
            --header-height: 60px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c5cbd8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8b0c0;
        }

        /* ===== 头部 ===== */
        .app-header {
            height: var(--header-height);
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
            cursor: default;
        }
        .logo i {
            font-size: 26px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .total-size-display {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 20px;
            background: var(--bg);
            border: 1px solid var(--border);
            white-space: nowrap;
        }
        .total-size-display i {
            color: var(--primary);
            font-size: 13px;
        }
        .header-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            white-space: nowrap;
        }
        .header-btn:hover {
            background: var(--bg);
            border-color: #d0d8e8;
            transform: translateY(-1px);
        }
        .header-btn.primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .header-btn.primary:hover {
            background: #3a5ce5;
            border-color: #3a5ce5;
        }
        .header-btn i {
            font-size: 13px;
        }

        /* ===== 筛选栏 ===== */
        .filter-bar {
            padding: 10px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            flex-shrink: 0;
            min-height: 48px;
        }
        .filter-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            flex: 1;
            min-width: 100px;
        }
        .filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--primary-light);
            color: var(--primary);
            padding: 5px 10px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .filter-tag:hover {
            background: #e0e6ff;
            border-color: var(--primary);
        }
        .filter-tag i {
            font-size: 10px;
            opacity: 0.7;
        }
        .clear-filter-btn {
            padding: 5px 12px;
            border-radius: 16px;
            border: 1px solid var(--danger);
            background: var(--danger-light);
            color: var(--danger);
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
            white-space: nowrap;
        }
        .clear-filter-btn:hover {
            background: #fbd9d5;
        }
        .download-actions {
            display: none;
            gap: 5px;
            flex-wrap: wrap;
            align-items: center;
        }
        .download-actions.active {
            display: flex;
        }
        .btn-sm {
            padding: 5px 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: var(--transition);
            white-space: nowrap;
        }
        .btn-sm:hover {
            background: var(--bg);
            border-color: #c5cbd8;
        }
        .btn-sm.primary {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }
        .btn-sm.primary:hover {
            background: #e0e6ff;
        }
        .btn-sm.danger {
            background: var(--danger-light);
            color: var(--danger);
            border-color: var(--danger);
        }
        .btn-sm.danger:hover {
            background: #fbd9d5;
        }
        .weight-filter-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            width: 100%;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed var(--border);
            font-size: 12px;
        }
        .weight-filter-label {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            font-weight: 600;
            white-space: nowrap;
        }
        .weight-capsule {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--bg);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: var(--transition);
            white-space: nowrap;
        }
        .weight-capsule:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .weight-capsule.active {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
            font-weight: 600;
        }
        .weight-count {
            background: rgba(0, 0, 0, 0.06);
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: 500;
        }

        /* ===== 主内容区 ===== */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
        }
        .gallery {
            flex: 1;
            min-height: 200px;
        }
        .gallery-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 300px;
            color: var(--text-secondary);
            text-align: center;
            gap: 14px;
        }
        .gallery-empty i {
            font-size: 52px;
            opacity: 0.4;
            color: var(--primary);
        }
        .gallery-empty p {
            font-size: 14px;
            line-height: 1.6;
        }
        .upload-hint-btn {
            padding: 10px 22px;
            border-radius: 22px;
            border: 2px dashed var(--primary);
            background: var(--primary-light);
            color: var(--primary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        .upload-hint-btn:hover {
            background: #e0e6ff;
            border-color: var(--primary);
            transform: scale(1.03);
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }
        .image-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            border: 2px solid transparent;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .image-card:hover {
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }
        .image-card.selected {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light), var(--shadow);
        }
        .thumb-wrapper {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            background: #f0f2f8;
        }
        .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .select-checkbox {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
            opacity: 0;
            transition: var(--transition);
            z-index: 5;
        }
        .select-checkbox.show {
            opacity: 1;
        }
        .image-card:hover .select-checkbox {
            opacity: 1;
        }
        .card-info {
            padding: 10px 12px;
            flex: 1;
        }
        .card-name {
            font-size: 13px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 4px;
        }
        .card-prompt-preview {
            font-size: 11px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card-actions {
            display: flex;
            gap: 4px;
            padding: 8px 10px;
            border-top: 1px solid var(--border);
        }
        .card-action-btn {
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 10px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: var(--transition);
            flex: 1;
            justify-content: center;
        }
        .card-action-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }
        .card-action-btn.delete-btn:hover {
            background: var(--danger-light);
            color: var(--danger);
            border-color: var(--danger);
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 640px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 5;
            border-radius: var(--radius) var(--radius) 0 0;
        }
        .modal-header h3 {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-header h3 i {
            color: var(--primary);
        }
        .modal-close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--bg);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: var(--transition);
        }
        .modal-close-btn:hover {
            background: var(--danger-light);
            color: var(--danger);
        }
        .modal-body {
            padding: 20px;
        }
        .modal-section {
            margin-bottom: 16px;
        }
        .section-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .prompt-text {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 12px;
            font-size: 12px;
            line-height: 1.6;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            user-select: text;
            margin-bottom: 8px;
        }
        .prompt-text.positive {
            border-left: 3px solid var(--primary);
        }
        .prompt-text.negative {
            border-left: 3px solid var(--danger);
        }
        .copy-btn {
            padding: 7px 14px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
        }
        .copy-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .copy-btn.positive-btn {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }
        .copy-btn.negative-btn {
            background: var(--danger-light);
            color: var(--danger);
            border-color: var(--danger);
        }
        .params-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
        }
        .param-item {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .param-key {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
        }
        .param-value {
            font-size: 14px;
            font-weight: 600;
        }
        .modal-image-container {
            text-align: center;
            margin-bottom: 16px;
        }
        .modal-image-container img {
            max-width: 180px;
            max-height: 180px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
        }

        /* ===== 词条库侧边栏 ===== */
        .token-sidebar {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            max-width: 95vw;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.15);
            z-index: 150;
            display: flex;
            flex-direction: column;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 1px solid var(--border);
        }
        .token-sidebar.active {
            right: 0;
        }
        .token-sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .token-sidebar-header h3 {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .token-sidebar-header h3 i {
            color: var(--primary);
        }
        .token-sidebar-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--bg);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: var(--transition);
        }
        .token-sidebar-close:hover {
            background: var(--danger-light);
            color: var(--danger);
        }
        .token-search {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .token-search i {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .token-search input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 13px;
            color: var(--text);
            outline: none;
            padding: 4px 0;
        }
        .token-search input::placeholder {
            color: #b0b8c8;
        }
        .tag-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .tag-filter-capsule {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            cursor: pointer;
            background: var(--bg);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            transition: var(--transition);
            white-space: nowrap;
        }
        .tag-filter-capsule:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .tag-filter-capsule.active {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
            font-weight: 600;
        }
        .tag-count {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            padding: 0 5px;
            font-size: 9px;
        }
        .token-toolbar {
            display: flex;
            gap: 6px;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .toolbar-btn {
            padding: 5px 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: var(--transition);
            white-space: nowrap;
        }
        .toolbar-btn:hover {
            background: var(--bg);
            border-color: #c5cbd8;
            color: var(--text);
        }
        .toolbar-btn.active {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }
        .toolbar-btn.tag-manage-btn {
            background: var(--bg);
        }
        .token-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .token-tab {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: var(--transition);
            border-bottom: 2px solid transparent;
        }
        .token-tab:hover {
            color: var(--text);
        }
        .token-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .token-tab i {
            font-size: 12px;
        }
        .token-weight-bar {
            padding: 8px 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }
        .token-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            min-height: 0;
        }
        .token-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            font-size: 12px;
            border-bottom: 1px solid #f0f2f8;
        }
        .token-item:hover {
            background: var(--bg);
        }
        .token-checkbox {
            width: 15px;
            height: 15px;
            cursor: pointer;
            accent-color: var(--primary);
            opacity: 0;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .token-checkbox.show {
            opacity: 1;
        }
        .token-item:hover .token-checkbox {
            opacity: 1;
        }
        .token-name {
            flex: 1;
            font-weight: 500;
            word-break: break-all;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .token-count {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .token-count.pos {
            background: var(--primary-light);
            color: var(--primary);
        }
        .token-count.neg {
            background: var(--danger-light);
            color: var(--danger);
        }
        .tag-badge {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 600;
            flex-shrink: 0;
            cursor: pointer;
        }
        .tag-badge.more-tags {
            background: var(--bg);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            cursor: help;
        }
        .token-action-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .token-action-btn:hover {
            background: var(--bg);
            border-color: var(--primary);
            color: var(--primary);
        }
        .token-action-btn.has-tag {
            color: var(--primary);
            border-color: var(--primary);
        }
        .token-action-btn.blocked {
            color: var(--danger);
            border-color: var(--danger);
        }
        .batch-action-bar {
            display: none;
            gap: 6px;
            padding: 8px 16px;
            border-top: 1px solid var(--border);
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0;
            background: var(--bg);
        }
        .batch-action-bar.active {
            display: flex;
        }
        .batch-btn {
            padding: 5px 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: var(--transition);
        }
        .batch-btn:hover {
            background: var(--bg);
            color: var(--text);
        }
        .batch-btn.primary {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }
        .batch-selected-count {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
            white-space: nowrap;
        }

        /* ===== 相似度面板 ===== */
        .similarity-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 180;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .similarity-overlay.active {
            display: flex;
        }
        .similarity-panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.25s ease;
        }
        .similarity-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        .similarity-header h3 {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .similarity-header h3 i {
            color: var(--primary);
        }
        .similarity-body {
            padding: 16px 20px;
            overflow-y: auto;
        }
        .threshold-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .threshold-control label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
        }
        .threshold-control input[type="range"] {
            flex: 1;
            min-width: 100px;
            max-width: 200px;
            accent-color: var(--primary);
        }
        .threshold-value {
            font-weight: 700;
            color: var(--primary);
            min-width: 38px;
            text-align: center;
        }
        .exclude-common-label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .exclude-common-label input[type="checkbox"] {
            accent-color: var(--primary);
        }
        .similarity-results {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sim-pair {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: var(--radius-sm);
            background: var(--bg);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .sim-pair:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
        .sim-thumbs {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .sim-thumbs img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
        }
        .sim-thumbs img:hover {
            border-color: var(--primary);
        }
        .sim-info {
            flex: 1;
            min-width: 0;
        }
        .sim-score {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
        }
        .sim-score.high {
            color: var(--danger);
        }
        .sim-common-tokens {
            font-size: 10px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sim-actions {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .sim-action-btn {
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: var(--transition);
        }
        .sim-action-btn:hover {
            background: var(--bg);
            border-color: var(--primary);
            color: var(--primary);
        }
        .sim-action-btn.delete:hover {
            background: var(--danger-light);
            color: var(--danger);
            border-color: var(--danger);
        }

        /* ===== 差异模态框 ===== */
        .diff-container {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .diff-card {
            flex: 1;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 12px;
            border: 1px solid var(--border);
        }
        .diff-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .diff-token-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
        }
        .diff-token {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            transition: var(--transition);
        }
        .diff-token:hover {
            transform: scale(1.05);
        }
        .diff-token.positive {
            background: var(--primary-light);
            color: var(--primary);
        }
        .diff-token.negative {
            background: var(--danger-light);
            color: var(--danger);
        }
        .weight-diff-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .weight-diff-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            font-size: 12px;
        }
        .diff-token-name {
            flex: 1;
            font-weight: 600;
        }
        .diff-weight {
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .diff-weight strong {
            color: var(--primary);
        }

        /* ===== 标签管理 ===== */
        .tag-manage-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
            max-height: 300px;
            overflow-y: auto;
        }
        .tag-manage-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            font-size: 12px;
        }
        .tag-manage-name {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .tag-manage-count {
            color: var(--text-secondary);
            font-size: 11px;
            flex-shrink: 0;
        }
        .tag-manage-block,
        .tag-manage-delete {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .tag-manage-block:hover {
            border-color: var(--danger);
            color: var(--danger);
        }
        .tag-manage-delete:hover {
            border-color: var(--danger);
            color: var(--danger);
        }
        .tag-add-row {
            display: flex;
            gap: 8px;
        }
        .tag-add-row input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            outline: none;
            transition: var(--transition);
        }
        .tag-add-row input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .tag-add-btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--primary);
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
        }
        .tag-add-btn:hover {
            background: #3a5ce5;
        }
        .tag-selector-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .tag-selector-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            background: var(--bg);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            transition: var(--transition);
            user-select: none;
        }
        .tag-selector-item:hover {
            border-color: var(--primary);
        }
        .tag-selector-item.selected {
            font-weight: 600;
        }
        .tag-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .block-settings-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            cursor: pointer;
        }
        .block-settings-row input[type="checkbox"] {
            accent-color: var(--danger);
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
        }
        .block-label {
            font-weight: 600;
            font-size: 13px;
        }
        .block-desc {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 500;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            background: var(--card-bg);
            color: var(--text);
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: slideInRight 0.3s ease;
            border-left: 3px solid var(--primary);
            max-width: 360px;
        }
        .toast.success {
            border-left-color: var(--success);
        }
        .toast.error {
            border-left-color: var(--danger);
        }
        .toast.info {
            border-left-color: var(--primary);
        }
        .toast i {
            font-size: 16px;
            flex-shrink: 0;
        }
        .toast.success i {
            color: var(--success);
        }
        .toast.error i {
            color: var(--danger);
        }
        .toast.info i {
            color: var(--primary);
        }
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ===== 导出/导入模态框专属样式 ===== */
        .export-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }
        .export-option-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
        }
        .export-option-row:hover {
            border-color: var(--primary);
        }
        .export-option-row input[type="radio"],
        .export-option-row input[type="checkbox"] {
            accent-color: var(--primary);
            cursor: pointer;
            width: 16px;
            height: 16px;
        }
        .export-option-row label {
            cursor: pointer;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .export-option-row .option-desc {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 400;
        }
        .export-preview {
            background: #f8f9fc;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
            font-size: 11px;
            line-height: 1.5;
            max-height: 200px;
            overflow-y: auto;
            user-select: text;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 12px;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        .import-textarea {
            width: 100%;
            min-height: 180px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: 'Consolas', 'Courier New', monospace;
            outline: none;
            transition: var(--transition);
            resize: vertical;
            user-select: text;
        }
        .import-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .import-options {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .import-option-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .import-option-label input[type="checkbox"] {
            accent-color: var(--primary);
        }
        .btn-primary-full {
            width: 100%;
            padding: 10px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
            margin-top: 10px;
        }
        .btn-primary-full:hover {
            background: #3a5ce5;
        }
        .btn-secondary-full {
            width: 100%;
            padding: 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
            margin-top: 6px;
        }
        .btn-secondary-full:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        /* 响应式调整 */
        @media (max-width: 640px) {
            .header-btn .btn-text {
                display: none;
            }
            .header-btn {
                padding: 8px 10px;
            }
            .token-sidebar {
                width: 100vw;
                max-width: 100vw;
            }
            .diff-container {
                flex-direction: column;
            }
            .modal-content {
                width: 95%;
                max-height: 90vh;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="logo"><i class="fa-solid fa-images"></i><span>NAI解析</span></div>
        <div class="header-actions">
            <div class="total-size-display" id="totalSizeDisplay"><i class="fa-solid fa-database"></i> <span id="totalSizeValue">0 B</span></div>
            <button class="header-btn primary" id="uploadBtn"><i class="fa-solid fa-upload"></i><span class="btn-text">上传图片</span></button>
            <button class="header-btn" id="downloadModeBtn"><i class="fa-solid fa-download"></i><span class="btn-text">多选操作</span></button>
            <button class="header-btn" id="deleteDuplicatesBtn"><i class="fa-solid fa-copy"></i><span class="btn-text">删除重复</span></button>
            <button class="header-btn" id="tokenLibraryBtn"><i class="fa-solid fa-book"></i><span class="btn-text">词条库</span></button>
            <button class="header-btn" id="similarityBtn"><i class="fa-solid fa-chart-simple"></i><span class="btn-text">相似度</span></button>
        </div>
    </header>

    <div class="filter-bar" id="filterBar">
        <span class="filter-label"><i class="fa-solid fa-filter"></i> 筛选:</span>
        <div class="filter-tags" id="filterTags"></div>
        <button class="clear-filter-btn" id="clearFilterBtn" style="display:none;"><i class="fa-solid fa-times"></i> 清除</button>
        <div class="download-actions" id="downloadActions">
            <button class="btn-sm" id="selectAllBtn"><i class="fa-solid fa-check-double"></i> 全选</button>
            <button class="btn-sm" id="deselectAllBtn"><i class="fa-solid fa-square"></i> 取消全选</button>
            <button class="btn-sm" id="selectRangeBtn"><i class="fa-solid fa-arrows-left-right"></i> 选择区间</button>
            <button class="btn-sm" id="invertSelectionBtn"><i class="fa-solid fa-retweet"></i> 反选</button>
            <button class="btn-sm danger" id="deleteSelectedBtn"><i class="fa-solid fa-trash"></i> 删除选中</button>
            <button class="btn-sm primary" id="downloadWithMetaBtn"><i class="fa-solid fa-file-arrow-down"></i> 含元数据下载</button>
            <button class="btn-sm primary" id="downloadNoMetaBtn"><i class="fa-solid fa-file-arrow-down"></i> 不含元数据下载</button>
        </div>
        <div id="weightFilterBar" class="weight-filter-bar" style="display:none;"></div>
    </div>

    <div class="main-content">
        <div class="gallery" id="gallery">
            <div class="gallery-empty" id="galleryEmpty">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <p>上传PNG图片以开始管理提示词<br>支持批量上传，自动解析元数据</p>
                <button class="upload-hint-btn" id="uploadHintBtn"><i class="fa-solid fa-plus"></i> 选择图片</button>
            </div>
            <div class="gallery-grid" id="galleryGrid" style="display:none;"></div>
        </div>
    </div>

    <!-- 详情模态框 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <div class="modal-header"><h3 id="modalTitle">图片详情</h3><button class="modal-close-btn" id="modalCloseBtn"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- 差异模态框 -->
    <div class="modal-overlay" id="diffModal">
        <div class="modal-content" style="max-width:600px;">
            <div class="modal-header"><h3><i class="fa-solid fa-code-compare"></i> 提示词差异</h3><button class="modal-close-btn" id="diffModalCloseBtn"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body" id="diffModalBody"></div>
        </div>
    </div>

    <!-- 权重差异模态框 -->
    <div class="modal-overlay" id="weightDiffModal">
        <div class="modal-content" style="max-width:500px;">
            <div class="modal-header"><h3><i class="fa-solid fa-weight-scale"></i> 权重差异</h3><button class="modal-close-btn" id="weightDiffCloseBtn"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body" id="weightDiffBody"></div>
        </div>
    </div>

    <!-- 标签管理模态框 -->
    <div class="modal-overlay" id="tagManagerModal">
        <div class="modal-content" style="max-width:500px;">
            <div class="modal-header"><h3><i class="fa-solid fa-tags"></i> 标签管理</h3><button class="modal-close-btn" id="tagManagerCloseBtn"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body" id="tagManagerBody"></div>
        </div>
    </div>

    <!-- 标签选择器模态框 -->
    <div class="modal-overlay" id="tagSelectorModal">
        <div class="modal-content" style="max-width:480px;">
            <div class="modal-header"><h3 id="tagSelectorTitle"><i class="fa-solid fa-tag"></i> 选择标签</h3><button class="modal-close-btn" id="tagSelectorCloseBtn"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body" id="tagSelectorBody"></div>
        </div>
    </div>

    <!-- 屏蔽设置模态框 -->
    <div class="modal-overlay" id="blockSettingsModal">
        <div class="modal-content" style="max-width:420px;">
            <div class="modal-header"><h3 id="blockSettingsTitle"><i class="fa-solid fa-ban"></i> 屏蔽设置</h3><button class="modal-close-btn" id="blockSettingsCloseBtn"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body" id="blockSettingsBody"></div>
        </div>
    </div>

    <!-- 导出词条模态框 -->

    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            // ==================== 数据库操作 ====================
            const DB_NAME = 'pngGalleryDB';
            const DB_VERSION = 1;
            const STORE_NAME = 'images';
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    if (db) { resolve(db); return; }
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const database = e.target.result;
                        if (!database.objectStoreNames.contains(STORE_NAME)) {
                            const store = database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                            store.createIndex('timestamp', 'timestamp', { unique: false });
                        }
                    };
                    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                    req.onerror = (e) => reject(e.target.error);
                });
            }

            function dbAddImage(imageData) {
                return new Promise((resolve, reject) => {
                    openDB().then((database) => {
                        const tx = database.transaction(STORE_NAME, 'readwrite');
                        const store = tx.objectStore(STORE_NAME);
                        store.put(imageData);
                        tx.oncomplete = () => resolve();
                        tx.onerror = (e) => reject(e.target.error);
                    }).catch(reject);
                });
            }

            function dbGetAllImages() {
                return new Promise((resolve, reject) => {
                    openDB().then((database) => {
                        const tx = database.transaction(STORE_NAME, 'readonly');
                        const store = tx.objectStore(STORE_NAME);
                        const index = store.index('timestamp');
                        const req = index.getAll();
                        req.onsuccess = () => resolve(req.result || []);
                        req.onerror = (e) => reject(e.target.error);
                    }).catch(reject);
                });
            }

            function dbDeleteImage(id) {
                return new Promise((resolve, reject) => {
                    openDB().then((database) => {
                        const tx = database.transaction(STORE_NAME, 'readwrite');
                        const store = tx.objectStore(STORE_NAME);
                        store.delete(id);
                        tx.oncomplete = () => resolve();
                        tx.onerror = (e) => reject(e.target.error);
                    }).catch(reject);
                });
            }

            // ==================== PNG 元数据解析 ====================
            function parsePNGMetadata(arrayBuffer) {
                const bytes = new Uint8Array(arrayBuffer);
                if (bytes.length < 8) return null;
                const signature = [137, 80, 78, 71, 13, 10, 26, 10];
                for (let i = 0; i < 8; i++)
                    if (bytes[i] !== signature[i]) return null;
                let offset = 8;
                let metadata = null;
                while (offset < bytes.length) {
                    if (offset + 8 > bytes.length) break;
                    const length = (bytes[offset] << 24) | (bytes[offset + 1] << 16) | (bytes[offset + 2] << 8) | bytes[offset + 3];
                    const type = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
                    const dataStart = offset + 8;
                    const dataEnd = dataStart + length;
                    if (dataEnd > bytes.length) break;
                    if (type === 'tEXt' || type === 'iTXt') {
                        const chunkData = bytes.slice(dataStart, dataEnd);
                        let keyword = '';
                        let textContent = '';
                        if (type === 'tEXt') {
                            let nullIdx = -1;
                            for (let i = 0; i < chunkData.length; i++)
                                if (chunkData[i] === 0) { nullIdx = i; break; }
                            if (nullIdx > -1) {
                                const keywordBytes = chunkData.slice(0, nullIdx);
                                keyword = new TextDecoder('latin1').decode(keywordBytes);
                                const textBytes = chunkData.slice(nullIdx + 1);
                                textContent = new TextDecoder('latin1').decode(textBytes);
                            }
                        } else {
                            let nullIdx1 = -1;
                            for (let i = 0; i < chunkData.length; i++)
                                if (chunkData[i] === 0) { nullIdx1 = i; break; }
                            if (nullIdx1 > -1) {
                                const keywordBytes = chunkData.slice(0, nullIdx1);
                                keyword = new TextDecoder('utf-8').decode(keywordBytes);
                                const restIdx = nullIdx1 + 1;
                                if (restIdx + 2 <= chunkData.length) {
                                    let nullIdx2 = -1;
                                    for (let i = restIdx + 2; i < chunkData.length; i++)
                                        if (chunkData[i] === 0) { nullIdx2 = i; break; }
                                    if (nullIdx2 > -1) {
                                        let nullIdx3 = -1;
                                        for (let i = nullIdx2 + 1; i < chunkData.length; i++)
                                            if (chunkData[i] === 0) { nullIdx3 = i; break; }
                                        const textStart = nullIdx3 > -1 ? nullIdx3 + 1 : nullIdx2 + 1;
                                        const textBytes = chunkData.slice(textStart);
                                        textContent = new TextDecoder('utf-8').decode(textBytes);
                                    }
                                }
                            }
                        }
                        if (keyword === 'Comment' || keyword === 'parameters' || keyword === 'prompt' || keyword ===
                            'description') {
                            if (textContent && textContent.trim().startsWith('{')) {
                                try { metadata = JSON.parse(textContent); } catch (e) {
                                    const jsonMatch = textContent.match(/\{[\s\S]*\}/);
                                    if (jsonMatch) { try { metadata = JSON.parse(jsonMatch[0]); } catch (e2) { metadata =
                                            null; } }
                                }
                            }
                            if (metadata) break;
                        }
                    }
                    offset = dataEnd + 4;
                }
                return metadata;
            }

            // ==================== 词条提取 ====================
            function parseBrackets(rawToken) {
                let token = rawToken.trim();
                let multiplier = 1.0;
                let changed = true;
                while (changed) {
                    changed = false;
                    if (token.startsWith('{') && token.endsWith('}')) {
                        multiplier *= 1.05;
                        token = token.slice(1, -1).trim();
                        changed = true;
                    }
                    if (token.startsWith('[') && token.endsWith(']')) {
                        multiplier *= 1 / 1.05;
                        token = token.slice(1, -1).trim();
                        changed = true;
                    }
                }
                return { token, multiplier };
            }

            function extractTokenData(promptStr) {
                if (!promptStr) return { tokens: [], weights: {} };
                let cleaned = promptStr;
                cleaned = cleaned.replace(/\{\{tar\}\}/g, '');
                const tokensSet = new Set();
                const weights = {};

                function processPlainToken(rawToken) {
                    let token = rawToken.trim();
                    if (!token) return null;
                    const bracket = parseBrackets(token);
                    token = bracket.token;
                    let weight = bracket.multiplier;
                    const suffixMatch = token.match(/(.+?):\s*(-?\d+(?:\.\d+)?)\s*$/);
                    if (suffixMatch) {
                        token = suffixMatch[1].trim();
                        const w = parseFloat(suffixMatch[2]);
                        if (!isNaN(w)) weight = w;
                    }
                    token = token.replace(/[()\[\]<>]/g, '');
                    token = token.replace(/\s+/g, ' ').trim();
                    token = token.replace(/^[\d\s.]+/, '').trim();
                    if (!token || token.length < 1 || token.length >= 200) return null;
                    return { token, weight };
                }
                const weightBlocks = [];
                const blockRegex = /(-?\d+(?:\.\d+)?)\s*::\s*([\s\S]*?)\s*::/g;
                let match;
                let remainingStr = cleaned;
                while ((match = blockRegex.exec(cleaned)) !== null) {
                    const blockWeight = parseFloat(match[1]);
                    const blockContent = match[2];
                    weightBlocks.push({ weight: blockWeight, content: blockContent });
                    remainingStr = remainingStr.replace(match[0], '');
                }
                const parts = remainingStr.split(',');
                for (let part of parts) {
                    const result = processPlainToken(part);
                    if (result) {
                        tokensSet.add(result.token);
                        weights[result.token] = result.weight;
                    }
                }
                for (const block of weightBlocks) {
                    const blockWeight = block.weight;
                    const blockTokens = block.content.split(',');
                    for (let rawToken of blockTokens) {
                        rawToken = rawToken.trim();
                        if (!rawToken) continue;
                        const bracket = parseBrackets(rawToken);
                        let token = bracket.token;
                        let weight = blockWeight * bracket.multiplier;
                        token = token.replace(/[()\[\]<>]/g, '');
                        token = token.replace(/\s+/g, ' ').trim();
                        token = token.replace(/^[\d\s.]+/, '').trim();
                        if (!token || token.length < 1 || token.length >= 200) continue;
                        tokensSet.add(token);
                        weights[token] = weight;
                    }
                }
                return { tokens: Array.from(tokensSet), weights };
            }

            function extractTokens(promptStr) {
                return extractTokenData(promptStr).tokens;
            }

            // ==================== 标签与屏蔽数据管理 (localStorage) ====================
            const LS_PREFIX = 'naiTagManager_';
            const LS_CUSTOM_LABELS = LS_PREFIX + 'customLabels';
            const LS_TOKEN_LABELS = LS_PREFIX + 'tokenLabels';
            const LS_BLOCKED_TOKENS = LS_PREFIX + 'blockedTokens';
            const LS_BLOCKED_LABELS = LS_PREFIX + 'blockedLabels';

            function loadCustomLabels() {
                try { return JSON.parse(localStorage.getItem(LS_CUSTOM_LABELS)) || []; } catch (e) { return []; }
            }

            function saveCustomLabels(labels) {
                localStorage.setItem(LS_CUSTOM_LABELS, JSON.stringify(labels));
            }

            function loadTokenLabels() {
                try { return JSON.parse(localStorage.getItem(LS_TOKEN_LABELS)) || {}; } catch (e) { return {}; }
            }

            function saveTokenLabels(data) {
                localStorage.setItem(LS_TOKEN_LABELS, JSON.stringify(data));
            }

            function loadBlockedTokens() {
                try { return JSON.parse(localStorage.getItem(LS_BLOCKED_TOKENS)) || {}; } catch (e) { return {}; }
            }

            function saveBlockedTokens(data) {
                localStorage.setItem(LS_BLOCKED_TOKENS, JSON.stringify(data));
            }

            function loadBlockedLabels() {
                try { return JSON.parse(localStorage.getItem(LS_BLOCKED_LABELS)) || {}; } catch (e) { return {}; }
            }

            function saveBlockedLabels(data) {
                localStorage.setItem(LS_BLOCKED_LABELS, JSON.stringify(data));
            }

            // 标签颜色分配
            const LABEL_COLORS = [
                '#4a6cf7', '#e74c3c', '#27ae60', '#f39c12', '#9b59b6', '#3498db',
                '#e74c3c', '#2ecc71', '#1abc9c', '#e67e22', '#34495e', '#7f8c8d',
                '#c0392b', '#16a085', '#2980b9', '#8e44ad'
            ];

            function getLabelColor(label) {
                const labels = loadCustomLabels();
                const idx = labels.indexOf(label);
                if (idx >= 0) return LABEL_COLORS[idx % LABEL_COLORS.length];
                let hash = 0;
                for (let i = 0; i < label.length; i++) hash = (hash * 31 + label.charCodeAt(i)) & 0xffffffff;
                return LABEL_COLORS[hash % LABEL_COLORS.length];
            }

            function getTokenLabels(token) {
                const tokenLabels = loadTokenLabels();
                return tokenLabels[token] || [];
            }

            function addTokenLabel(token, label) {
                const tokenLabels = loadTokenLabels();
                if (!tokenLabels[token]) tokenLabels[token] = [];
                if (!tokenLabels[token].includes(label)) {
                    tokenLabels[token].push(label);
                    saveTokenLabels(tokenLabels);
                }
            }

            function removeTokenLabel(token, label) {
                const tokenLabels = loadTokenLabels();
                if (tokenLabels[token]) {
                    tokenLabels[token] = tokenLabels[token].filter(l => l !== label);
                    if (tokenLabels[token].length === 0) delete tokenLabels[token];
                    saveTokenLabels(tokenLabels);
                }
            }

            function batchAddTokenLabels(tokens, labels) {
                const tokenLabels = loadTokenLabels();
                tokens.forEach(token => {
                    if (!tokenLabels[token]) tokenLabels[token] = [];
                    labels.forEach(label => {
                        if (!tokenLabels[token].includes(label)) tokenLabels[token].push(label);
                    });
                });
                saveTokenLabels(tokenLabels);
            }

            function getEffectiveBlockSettings(token) {
                const blockedTokens = loadBlockedTokens();
                const blockedLabels = loadBlockedLabels();
                const tokenLabels = getTokenLabels(token);
                const settings = { display: false, copy: false, diff: false };
                tokenLabels.forEach(label => {
                    if (blockedLabels[label]) {
                        if (blockedLabels[label].display) settings.display = true;
                        if (blockedLabels[label].copy) settings.copy = true;
                        if (blockedLabels[label].diff) settings.diff = true;
                    }
                });
                if (blockedTokens[token]) {
                    if (blockedTokens[token].display !== undefined) settings.display = blockedTokens[token].display;
                    if (blockedTokens[token].copy !== undefined) settings.copy = blockedTokens[token].copy;
                    if (blockedTokens[token].diff !== undefined) settings.diff = blockedTokens[token].diff;
                }
                return settings;
            }

            function getBlockedTokensForCopy() {
                const blocked = new Set();
                const blockedTokens = loadBlockedTokens();
                const blockedLabels = loadBlockedLabels();
                const tokenLabels = loadTokenLabels();
                for (const [token, settings] of Object.entries(blockedTokens)) {
                    if (settings.copy) blocked.add(token);
                }
                for (const [label, settings] of Object.entries(blockedLabels)) {
                    if (settings.copy) {
                        for (const [token, labels] of Object.entries(tokenLabels)) {
                            if (labels.includes(label)) blocked.add(token);
                        }
                    }
                }
                return blocked;
            }

            function getBlockedTokensForDiff() {
                const blocked = new Set();
                const blockedTokens = loadBlockedTokens();
                const blockedLabels = loadBlockedLabels();
                const tokenLabels = loadTokenLabels();
                for (const [token, settings] of Object.entries(blockedTokens)) {
                    if (settings.diff) blocked.add(token);
                }
                for (const [label, settings] of Object.entries(blockedLabels)) {
                    if (settings.diff) {
                        for (const [token, labels] of Object.entries(tokenLabels)) {
                            if (labels.includes(label)) blocked.add(token);
                        }
                    }
                }
                return blocked;
            }

            function removeBlockedTokensFromPrompt(prompt, blockedTokens) {
                if (!prompt || blockedTokens.size === 0) return prompt;
                const weightBlockRegex = /(-?\d+(?:\.\d+)?)\s*::\s*([\s\S]*?)\s*::/g;
                let result = '';
                let lastIndex = 0;
                let match;
                const filterPlainPart = (text) => {
                    if (!text) return text;
                    const parts = text.split(',');
                    const filtered = parts.filter(part => {
                        const trimmed = part.trim();
                        if (!trimmed) return false;
                        const tokenData = extractTokenData(trimmed);
                        return !tokenData.tokens.some(t => blockedTokens.has(t));
                    });
                    return filtered.join(',');
                };
                const filterBlockContent = (content) => {
                    if (!content) return '';
                    const parts = content.split(',');
                    const filtered = parts.filter(part => {
                        const trimmed = part.trim();
                        if (!trimmed) return false;
                        const tokenData = extractTokenData(trimmed);
                        return !tokenData.tokens.some(t => blockedTokens.has(t));
                    });
                    return filtered.join(',');
                };
                while ((match = weightBlockRegex.exec(prompt)) !== null) {
                    const before = prompt.slice(lastIndex, match.index);
                    result += filterPlainPart(before);
                    const blockWeight = match[1];
                    const blockContent = match[2];
                    const filteredContent = filterBlockContent(blockContent);
                    if (filteredContent) {
                        result += `${blockWeight}::${filteredContent}::`;
                    }
                    lastIndex = weightBlockRegex.lastIndex;
                }
                const tail = prompt.slice(lastIndex);
                result += filterPlainPart(tail);
                result = result.replace(/,\s*,/g, ',').replace(/^,\s*/, '').replace(/,\s*$/, '').trim();
                return result;
            }

            // ==================== 相似度计算 ====================
            function jaccardSimilarity(setA, setB) {
                if (setA.length === 0 && setB.length === 0) return 0;
                const intersection = setA.filter(t => setB.includes(t));
                const union = new Set([...setA, ...setB]);
                if (union.size === 0) return 0;
                return intersection.length / union.size;
            }

            function getFilteredTokens(image, excludeCommon, commonThreshold = 0.5, allImages = null) {
                let tokens = [...image.promptTokens];
                const blockedDiff = getBlockedTokensForDiff();
                tokens = tokens.filter(t => !blockedDiff.has(t));
                if (excludeCommon && allImages && allImages.length > 1) {
                    const totalImages = allImages.length;
                    tokens = tokens.filter(token => {
                        const count = allImages.filter(img => img.promptTokens.includes(token)).length;
                        return count <= totalImages * commonThreshold;
                    });
                }
                return tokens;
            }

            function calculateSimilarities(images, threshold, excludeCommon) {
                const results = [];
                const n = images.length;
                for (let i = 0; i < n; i++) {
                    for (let j = i + 1; j < n; j++) {
                        const tokensA = getFilteredTokens(images[i], excludeCommon, 0.5, images);
                        const tokensB = getFilteredTokens(images[j], excludeCommon, 0.5, images);
                        const sim = jaccardSimilarity(tokensA, tokensB);
                        if (sim >= threshold) {
                            const commonTokens = tokensA.filter(t => tokensB.includes(t));
                            results.push({ imgA: images[i], imgB: images[j], similarity: sim, commonTokens: commonTokens });
                        }
                    }
                }
                results.sort((a, b) => b.similarity - a.similarity);
                return results;
            }

            // ==================== PNG 工具函数 ====================
            const crcTable = (() => { let c; const table = []; for (let n = 0; n < 256; n++) { c = n; for (let k = 0; k <
                    8; k++) { c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); } table[n] = c >>> 0; } return table; })();

            function crc32(bytes) { let crc = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) { crc = (crc >>> 8) ^
                    crcTable[(crc ^ bytes[i]) & 0xFF]; } return (crc ^ 0xFFFFFFFF) >>> 0; }

            function uint32ToBytes(num) { return [num >>> 24, (num >>> 16) & 0xFF, (num >>> 8) & 0xFF, num & 0xFF]; }

            function createPNGChunk(type, data) {
                const typeBytes = [...type].map(c => c.charCodeAt(0));
                const dataBytes = data instanceof Uint8Array ? data : new TextEncoder().encode(data);
                const length = dataBytes.length;
                const chunk = new Uint8Array(4 + 4 + length + 4);
                chunk.set(uint32ToBytes(length), 0);
                chunk.set(typeBytes, 4);
                chunk.set(dataBytes, 8);
                const crc = crc32(new Uint8Array([...typeBytes, ...dataBytes]));
                chunk.set(uint32ToBytes(crc), 8 + length);
                return chunk;
            }

            function removePNGMetadata(blob) {
                return new Promise(async (resolve, reject) => {
                    try {
                        const arrayBuffer = await blob.arrayBuffer();
                        const bytes = new Uint8Array(arrayBuffer);
                        if (bytes.length < 8) { resolve(blob); return; }
                        const signature = [137, 80, 78, 71, 13, 10, 26, 10];
                        for (let i = 0; i < 8; i++)
                            if (bytes[i] !== signature[i]) { resolve(blob); return; }
                        const chunks = [];
                        let offset = 8;
                        while (offset < bytes.length) {
                            if (offset + 8 > bytes.length) break;
                            const length = (bytes[offset] << 24) | (bytes[offset + 1] << 16) | (bytes[offset + 2] << 8) |
                                bytes[offset + 3];
                            const type = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[
                                offset + 7]);
                            const dataStart = offset + 8;
                            const dataEnd = dataStart + length;
                            if (dataEnd + 4 > bytes.length) break;
                            if (type !== 'tEXt' && type !== 'iTXt' && type !== 'zTXt') {
                                chunks.push(bytes.slice(offset, dataEnd + 4));
                            }
                            offset = dataEnd + 4;
                        }
                        const signatureBytes = bytes.slice(0, 8);
                        const totalLength = chunks.reduce((sum, c) => sum + c.length, 0) + 8;
                        const result = new Uint8Array(totalLength);
                        result.set(signatureBytes, 0);
                        let pos = 8;
                        for (const chunk of chunks) { result.set(chunk, pos);
                            pos += chunk.length; }
                        resolve(new Blob([result], { type: 'image/png' }));
                    } catch (e) { reject(e); }
                });
            }

            function formatBytes(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
