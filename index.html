<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PNG 提示词管理器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --sidebar-bg: #1e2a3a;
            --sidebar-text: #e0e6ed;
            --primary: #4a6cf7;
            --primary-hover: #3b5de7;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --success: #27ae60;
            --warning: #f39c12;
            --text: #2c3e50;
            --text-secondary: #7f8c8d;
            --border: #e1e5eb;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.15);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 5px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            --header-height: 60px;
            --filter-height: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c0c4cc;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a0a4ac;
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .app-header .logo i {
            color: #6c8cff;
            font-size: 22px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: nowrap;
        }
        .header-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            white-space: nowrap;
            font-family: var(--font);
        }
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.35);
        }
        .header-btn i {
            font-size: 14px;
        }
        .header-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
        }
        .header-btn.primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .filter-bar {
            position: sticky;
            top: var(--header-height);
            z-index: 90;
            background: var(--card-bg);
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            min-height: var(--filter-height);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        .filter-bar .filter-label {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            white-space: nowrap;
        }
        .filter-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }
        .filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #eef1ff;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid #d5dcff;
        }
        .filter-tag:hover {
            background: #dfe5ff;
        }
        .filter-tag i {
            font-size: 10px;
            cursor: pointer;
            opacity: 0.7;
        }
        .filter-tag i:hover {
            opacity: 1;
        }
        .clear-filter-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: var(--transition);
            font-family: var(--font);
        }
        .clear-filter-btn:hover {
            color: var(--danger);
            background: #fef0ef;
        }

        .main-content {
            display: flex;
            min-height: calc(100vh - var(--header-height) - var(--filter-height));
        }

        .gallery {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }
        .gallery-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
            color: var(--text-secondary);
            gap: 14px;
            text-align: center;
            padding: 20px;
        }
        .gallery-empty i {
            font-size: 60px;
            opacity: 0.4;
        }
        .gallery-empty p {
            font-size: 15px;
            max-width: 320px;
            line-height: 1.6;
        }
        .gallery-empty .upload-hint-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .gallery-empty .upload-hint-btn:hover {
            background: var(--primary-hover);
        }

        .image-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
        }
        .image-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }
        .image-card.selected {
            border-color: var(--primary);
        }
        .image-card .thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            background: #f0f0f0;
            flex-shrink: 0;
        }
        .image-card .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .image-card:hover .thumb-wrapper img {
            transform: scale(1.04);
        }
        .image-card .card-info {
            padding: 10px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .image-card .card-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .image-card .card-prompt-preview {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-all;
        }
        .image-card .card-actions {
            display: flex;
            gap: 4px;
            padding: 6px 8px;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
        }
        .card-action-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            padding: 5px 8px;
            cursor: pointer;
            font-size: 11px;
            color: var(--text-secondary);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 3px;
            font-family: var(--font);
            flex: 1;
            justify-content: center;
        }
        .card-action-btn:hover {
            background: #f5f6fa;
            color: var(--text);
        }
        .card-action-btn.copy-pos:hover {
            background: #eef7f0;
            color: var(--success);
            border-color: var(--success);
        }
        .card-action-btn.copy-neg:hover {
            background: #fdf0ef;
            color: var(--danger);
            border-color: var(--danger);
        }
        .card-action-btn.delete-btn:hover {
            background: #fdf0ef;
            color: var(--danger);
            border-color: var(--danger);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            backdrop-filter: blur(3px);
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 1;
        }
        .modal-header h3 {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }
        .modal-close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: var(--transition);
        }
        .modal-close-btn:hover {
            background: #f0f0f0;
            color: var(--text);
        }
        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-image-container {
            width: 100%;
            max-height: 320px;
            display: flex;
            justify-content: center;
            background: #f8f9fa;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .modal-image-container img {
            max-width: 100%;
            max-height: 320px;
            object-fit: contain;
        }
        .modal-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .modal-section .section-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .prompt-text {
            background: #f8f9fa;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            line-height: 1.6;
            word-break: break-all;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            border: 1px solid #e8e8e8;
        }
        .prompt-text.negative {
            border-left: 3px solid var(--danger);
        }
        .prompt-text.positive {
            border-left: 3px solid var(--success);
        }
        .copy-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .copy-btn {
            background: #f0f2f5;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
            font-family: var(--font);
            color: var(--text);
        }
        .copy-btn:hover {
            background: #e4e7eb;
        }
        .copy-btn.positive-btn:hover {
            background: #eef7f0;
            color: var(--success);
            border-color: var(--success);
        }
        .copy-btn.negative-btn:hover {
            background: #fdf0ef;
            color: var(--danger);
            border-color: var(--danger);
        }
        .params-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
        }
        .param-item {
            background: #f8f9fa;
            padding: 8px 10px;
            border-radius: var(--radius-xs);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            border: 1px solid #e8e8e8;
        }
        .param-item .param-key {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .param-item .param-value {
            font-weight: 500;
            word-break: break-all;
        }

        .token-sidebar {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            max-width: 90vw;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
            z-index: 300;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        .token-sidebar.active {
            right: 0;
        }
        .token-sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--sidebar-bg);
            color: #fff;
        }
        .token-sidebar-header h3 {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .token-sidebar-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: var(--transition);
        }
        .token-sidebar-close:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .token-tabs {
            display: flex;
            gap: 4px;
            padding: 10px 16px;
            background: #f8f9fa;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .token-tab {
            padding: 7px 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: var(--transition);
            font-family: var(--font);
            background: transparent;
            color: var(--text-secondary);
        }
        .token-tab.active {
            background: var(--primary);
            color: #fff;
        }
        .token-tab:hover:not(.active) {
            background: #e9ecf5;
        }
        .token-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .token-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            gap: 8px;
        }
        .token-item:hover {
            background: #eef1ff;
            border-color: #d5dcff;
        }
        .token-item .token-name {
            font-size: 12px;
            font-weight: 500;
            word-break: break-all;
            flex: 1;
            line-height: 1.3;
        }
        .token-item .token-count {
            font-size: 11px;
            color: var(--text-secondary);
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .token-item .token-count.pos {
            background: #d4edda;
            color: #155724;
        }
        .token-item .token-count.neg {
            background: #f8d7da;
            color: #721c24;
        }
        .token-search {
            padding: 10px 16px;
            flex-shrink: 0;
            position: relative;
        }
        .token-search input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: var(--font);
            outline: none;
            transition: var(--transition);
            background: #f8f9fa;
        }
        .token-search input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.1);
        }
        .token-search i {
            position: absolute;
            left: 26px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 13px;
        }

        .similarity-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 250;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            backdrop-filter: blur(3px);
        }
        .similarity-overlay.active {
            display: flex;
        }
        .similarity-panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .similarity-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 1;
        }
        .similarity-header h3 {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .similarity-body {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .threshold-control {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 10px 0;
        }
        .threshold-control label {
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .threshold-control input[type="range"] {
            flex: 1;
            min-width: 120px;
            accent-color: var(--primary);
        }
        .threshold-value {
            font-weight: 700;
            color: var(--primary);
            font-size: 14px;
            min-width: 40px;
            text-align: center;
        }
        .exclude-common-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }
        .exclude-common-label input[type="checkbox"] {
            accent-color: var(--primary);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }
        .similarity-results {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        .sim-pair {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: var(--radius-sm);
            border: 1px solid #e8e8e8;
            flex-wrap: wrap;
            transition: var(--transition);
        }
        .sim-pair:hover {
            background: #f0f2f5;
            border-color: #d0d5dd;
        }
        .sim-pair .sim-thumbs {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .sim-pair .sim-thumbs img {
            width: 50px;
            height: 50px;
            border-radius: var(--radius-xs);
            object-fit: cover;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: var(--transition);
        }
        .sim-pair .sim-thumbs img:hover {
            transform: scale(1.1);
        }
        .sim-pair .sim-info {
            flex: 1;
            min-width: 150px;
        }
        .sim-pair .sim-score {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sim-pair .sim-score.high {
            color: var(--danger);
        }
        .sim-pair .sim-common-tokens {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
            word-break: break-all;
            margin-top: 2px;
        }
        .sim-pair .sim-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .sim-action-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            padding: 4px 8px;
            cursor: pointer;
            font-size: 10px;
            transition: var(--transition);
            font-family: var(--font);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 3px;
        }

    <script>
        (function() {
            const DB_NAME = 'pngGalleryDB';
            const DB_VERSION = 1;
            const STORE_NAME = 'images';
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    if (db) { resolve(db); return; }
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const database = e.target.result;
                        if (!database.objectStoreNames.contains(STORE_NAME)) {
                            const store = database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                            store.createIndex('timestamp', 'timestamp', { unique: false });
                        }
                    };
                    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                    req.onerror = (e) => reject(e.target.error);
                });
            }

            function dbAddImage(imageData) {
                return new Promise((resolve, reject) => {
                    openDB().then((database) => {
                        const tx = database.transaction(STORE_NAME, 'readwrite');
                        const store = tx.objectStore(STORE_NAME);
                        store.put(imageData);
                        tx.oncomplete = () => resolve();
                        tx.onerror = (e) => reject(e.target.error);
                    }).catch(reject);
                });
            }

            function dbGetAllImages() {
                return new Promise((resolve, reject) => {
                    openDB().then((database) => {
                        const tx = database.transaction(STORE_NAME, 'readonly');
                        const store = tx.objectStore(STORE_NAME);
                        const index = store.index('timestamp');
                        const req = index.getAll();
                        req.onsuccess = () => resolve(req.result || []);
                        req.onerror = (e) => reject(e.target.error);
                    }).catch(reject);
                });
            }

            function dbDeleteImage(id) {
                return new Promise((resolve, reject) => {
                    openDB().then((database) => {
                        const tx = database.transaction(STORE_NAME, 'readwrite');
                        const store = tx.objectStore(STORE_NAME);
                        store.delete(id);
                        tx.oncomplete = () => resolve();
                        tx.onerror = (e) => reject(e.target.error);
                    }).catch(reject);
                });
            }

            function parsePNGMetadata(arrayBuffer) {
                const bytes = new Uint8Array(arrayBuffer);
                if (bytes.length < 8) return null;
                const signature = [137, 80, 78, 71, 13, 10, 26, 10];
                for (let i = 0; i < 8; i++) if (bytes[i] !== signature[i]) return null;
                let offset = 8;
                let metadata = null;
                while (offset < bytes.length) {
                    if (offset + 8 > bytes.length) break;
                    const length = (bytes[offset] << 24) | (bytes[offset + 1] << 16) | (bytes[offset + 2] << 8) | bytes[offset + 3];
                    const type = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
                    const dataStart = offset + 8;
                    const dataEnd = dataStart + length;
                    if (dataEnd > bytes.length) break;
                    if (type === 'tEXt' || type === 'iTXt') {
                        const chunkData = bytes.slice(dataStart, dataEnd);
                        let keyword = '';
                        let textContent = '';
                        if (type === 'tEXt') {
                            let nullIdx = -1;
                            for (let i = 0; i < chunkData.length; i++) if (chunkData[i] === 0) { nullIdx = i; break; }
                            if (nullIdx > -1) {
                                const keywordBytes = chunkData.slice(0, nullIdx);
                                keyword = new TextDecoder('latin1').decode(keywordBytes);
                                const textBytes = chunkData.slice(nullIdx + 1);
                                textContent = new TextDecoder('latin1').decode(textBytes);
                            }
                        } else {
                            let nullIdx1 = -1;
                            for (let i = 0; i < chunkData.length; i++) if (chunkData[i] === 0) { nullIdx1 = i; break; }
                            if (nullIdx1 > -1) {
                                const keywordBytes = chunkData.slice(0, nullIdx1);
                                keyword = new TextDecoder('utf-8').decode(keywordBytes);
                                const restIdx = nullIdx1 + 1;
                                if (restIdx + 2 <= chunkData.length) {
                                    let nullIdx2 = -1;
                                    for (let i = restIdx + 2; i < chunkData.length; i++) if (chunkData[i] === 0) { nullIdx2 = i; break; }
                                    if (nullIdx2 > -1) {
                                        let nullIdx3 = -1;
                                        for (let i = nullIdx2 + 1; i < chunkData.length; i++) if (chunkData[i] === 0) { nullIdx3 = i; break; }
                                        const textStart = nullIdx3 > -1 ? nullIdx3 + 1 : nullIdx2 + 1;
                                        const textBytes = chunkData.slice(textStart);
                                        textContent = new TextDecoder('utf-8').decode(textBytes);
                                    }
                                }
                            }
                        }
                        if (keyword === 'Comment' || keyword === 'parameters' || keyword === 'prompt' || keyword === 'description') {
                            if (textContent && textContent.trim().startsWith('{')) {
                                try { metadata = JSON.parse(textContent); } catch (e) {
                                    const jsonMatch = textContent.match(/\{[\s\S]*\}/);
                                    if (jsonMatch) { try { metadata = JSON.parse(jsonMatch[0]); } catch (e2) { metadata = null; } }
                                }
                            }
                            if (metadata) break;
                        }
                    }
                    offset = dataEnd + 4;
                }
                return metadata;
            }

            function extractTokens(promptStr) {
                if (!promptStr) return [];
                let cleaned = promptStr;
                cleaned = cleaned.replace(/\{\{tar\}\}/g, '');
                cleaned = cleaned.replace(/\d+(?:\.\d+)?\s*::/g, ',');
                cleaned = cleaned.replace(/\d+(?:\.\d+)?\s*:/g, ',');
                cleaned = cleaned.replace(/::/g, ',');
                const parts = cleaned.split(',');
                const tokens = new Set();
                for (let part of parts) {
                    let token = part.trim();
                    if (!token) continue;
                    token = token.replace(/^[\d\s.]+/, '').trim();
                    if (!token) continue;
                    token = token.replace(/\s+/g, ' ');
                    if (token.length > 0 && token.length < 200) tokens.add(token);
                }
                return Array.from(tokens);
            }

            function jaccardSimilarity(setA, setB) {
                if (setA.length === 0 && setB.length === 0) return 0;
                const intersection = setA.filter(t => setB.includes(t));
                const union = new Set([...setA, ...setB]);
                if (union.size === 0) return 0;
                return intersection.length / union.size;
            }

            function getFilteredTokens(image, excludeCommon, commonThreshold = 0.5, allImages = null) {
                let tokens = [...image.promptTokens];
                if (excludeCommon && allImages && allImages.length > 1) {
                    const totalImages = allImages.length;
                    tokens = tokens.filter(token => {
                        const count = allImages.filter(img => img.promptTokens.includes(token)).length;
                        return count <= totalImages * commonThreshold;
                    });
                }
                return tokens;
            }

            function calculateSimilarities(images, threshold, excludeCommon) {
                const results = [];
                const n = images.length;
                for (let i = 0; i < n; i++) {
                    for (let j = i + 1; j < n; j++) {
                        const tokensA = getFilteredTokens(images[i], excludeCommon, 0.5, images);
                        const tokensB = getFilteredTokens(images[j], excludeCommon, 0.5, images);
                        const sim = jaccardSimilarity(tokensA, tokensB);
                        if (sim >= threshold) {
                            const commonTokens = tokensA.filter(t => tokensB.includes(t));
                            results.push({ imgA: images[i], imgB: images[j], similarity: sim, commonTokens: commonTokens });
                        }
                    }
                }
                results.sort((a, b) => b.similarity - a.similarity);
                return results;
            }

            let allImages = [];
            let filteredImages = [];
            let activeFilters = [];
            let currentTokenTab = 'positive';
            let tokenStats = { positive: {}, negative: {} };
            let selectedImageId = null;

            const galleryGrid = document.getElementById('galleryGrid');
            const galleryEmpty = document.getElementById('galleryEmpty');
            const filterTags = document.getElementById('filterTags');
            const clearFilterBtn = document.getElementById('clearFilterBtn');
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const uploadHintBtn = document.getElementById('uploadHintBtn');
            const tokenLibraryBtn = document.getElementById('tokenLibraryBtn');
            const similarityBtn = document.getElementById('similarityBtn');
            const tokenSidebar = document.getElementById('tokenSidebar');
            const tokenSidebarClose = document.getElementById('tokenSidebarClose');
            const tokenList = document.getElementById('tokenList');
            const tokenSearchInput = document.getElementById('tokenSearchInput');
            const tabPositive = document.getElementById('tabPositive');
            const tabNegative = document.getElementById('tabNegative');
            const detailModal = document.getElementById('detailModal');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const similarityOverlay = document.getElementById('similarityOverlay');
            const similarityCloseBtn = document.getElementById('similarityCloseBtn');
            const thresholdSlider = document.getElementById('thresholdSlider');
            const thresholdValue = document.getElementById('thresholdValue');
            const excludeCommonCheckbox = document.getElementById('excludeCommonCheckbox');
            const similarityResults = document.getElementById('similarityResults');
            const toastContainer = document.getElementById('toastContainer');
            const diffModal = document.getElementById('diffModal');
            const diffModalCloseBtn = document.getElementById('diffModalCloseBtn');
            const diffModalBody = document.getElementById('diffModalBody');

            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
                toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i> ${message}`;
                toastContainer.appendChild(toast);
                setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 2600);
            }

            function generateThumbnail(file, maxSize = 300) {
                return new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(file);
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width;
                        let h = img.height;
                        if (w > maxSize || h > maxSize) {
                            const ratio = Math.min(maxSize / w, maxSize / h);
                            w = Math.round(w * ratio);
                            h = Math.round(h * ratio);
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        URL.revokeObjectURL(url);
                        resolve(canvas.toDataURL('image/webp', 0.8));
                    };
                    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('缩略图生成失败')); };
                    img.src = url;
                });
            }

            async function handleFiles(files) {
                const allFiles = Array.from(files);
                if (allFiles.length === 0) return;
                // 过滤出图片文件（PNG优先，但接受所有图片格式）
                const imageFiles = allFiles.filter(f => f.type.startsWith('image/') || f.name.toLowerCase().match(/\.(png|jpg|jpeg|webp|gif|bmp)$/));
                if (imageFiles.length === 0) {
                    showToast('未选择图片文件', 'error');
                    return;
                }
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                if (isMobile && imageFiles.length === 1) {
                    showToast('已添加1张，可再次点击上传继续添加', 'info');
                }
                let successCount = 0;
                let failCount = 0;
                for (const file of imageFiles) {
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const metadata = parsePNGMetadata(arrayBuffer);
                        if (!metadata || !metadata.prompt) {
                            failCount++;
                            showToast(`"${file.name}" 未找到有效元数据（可能不是PNG或缺少提示词）`, 'error');
                            continue;
                        }
                        const thumbnailDataURL = await generateThumbnail(file);
                        const imageData = {
                            id: generateId(),
                            name: file.name,
                            fileBlob: file,
                            thumbnailDataURL: thumbnailDataURL,
                            prompt: metadata.prompt || '',
                            negativePrompt: metadata.uc || '',
                            seed: metadata.seed !== undefined ? metadata.seed : null,
                            steps: metadata.steps !== undefined ? metadata.steps : null,
                            sampler: metadata.sampler || '',
                            scale: metadata.scale !== undefined ? metadata.scale : null,
                            promptTokens: extractTokens(metadata.prompt),
                            negativeTokens: extractTokens(metadata.uc || ''),
                            timestamp: Date.now(),
                        };
                        await dbAddImage(imageData);
                        successCount++;
                    } catch (err) {
                        failCount++;
                        console.error('Upload error:', err);
                        showToast(`"${file.name}" 处理失败: ${err.message}`, 'error');
                    }
                }
                if (successCount > 0) {
                    showToast(`成功导入 ${successCount} 张图片${failCount > 0 ? '，' + failCount + ' 张失败' : ''}`, successCount > 0 && failCount === 0 ? 'success' : 'info');
                    await loadAllImages();
                }
            }

            function generateId() {
                return 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            async function loadAllImages() {
                try {
                    allImages = await dbGetAllImages();
                    allImages.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    applyFilters();
                    updateTokenStats();
                    if (tokenSidebar.classList.contains('active')) renderTokenList();
                } catch (err) {
                    console.error('Load images error:', err);
                    showToast('加载图片失败', 'error');
                }
            }

            function applyFilters() {
                if (activeFilters.length === 0) {
                    filteredImages = [...allImages];
                } else {
                    filteredImages = allImages.filter(img => {
                        const allTokens = [...img.promptTokens, ...img.negativeTokens];
                        return activeFilters.every(filter => allTokens.includes(filter));
                    });
                }
                renderGallery();
                renderFilterTags();
            }

            function addFilter(token) {
                if (!activeFilters.includes(token)) {
                    activeFilters.push(token);
                    applyFilters();
                }
            }

            function removeFilter(token) {
                activeFilters = activeFilters.filter(t => t !== token);
                applyFilters();
            }

            function clearAllFilters() {
                activeFilters = [];
                applyFilters();
            }

            function renderFilterTags() {
                filterTags.innerHTML = '';
                activeFilters.forEach(token => {
                    const tag = document.createElement('span');
                    tag.className = 'filter-tag';
                    tag.innerHTML = `${token} <i class="fa-solid fa-times" data-token="${token}"></i>`;
                    tag.querySelector('i').addEventListener('click', (e) => {
                        e.stopPropagation();
                        removeFilter(token);
                    });
                    tag.addEventListener('click', () => removeFilter(token));
                    filterTags.appendChild(tag);
                });
                clearFilterBtn.style.display = activeFilters.length > 0 ? 'flex' : 'none';
            }

            function renderGallery() {
                if (filteredImages.length === 0) {
                    galleryGrid.style.display = 'none';
                    galleryEmpty.style.display = 'flex';
                    if (allImages.length === 0) {
                        galleryEmpty.querySelector('p').innerHTML = '上传PNG图片以开始管理提示词<br>支持批量上传，自动解析元数据<br><strong>手机若无法多选，请多次点击上传</strong>';
                    } else {
                        galleryEmpty.querySelector('p').innerHTML = '没有匹配筛选条件的图片<br>尝试调整筛选词条';
                    }
                    return;
                }
                galleryEmpty.style.display = 'none';
                galleryGrid.style.display = 'grid';
                galleryGrid.innerHTML = '';
                filteredImages.forEach(img => {
                    const card = document.createElement('div');
                    card.className = 'image-card';
                    card.dataset.id = img.id;
                    const previewText = img.prompt ? img.prompt.substring(0, 80) : '无提示词';
                    card.innerHTML = `
                        <div class="thumb-wrapper">
                            <img src="${img.thumbnailDataURL}" alt="${img.name}" loading="lazy">
                        </div>
                        <div class="card-info">
                            <div class="card-name" title="${img.name}">${img.name}</div>
                            <div class="card-prompt-preview">${previewText}</div>
                        </div>
                        <div class="card-actions">
                            <button class="card-action-btn copy-pos" data-id="${img.id}" title="复制正向提示词"><i class="fa-solid fa-copy"></i> 正向</button>
                            <button class="card-action-btn copy-neg" data-id="${img.id}" title="复制负向提示词"><i class="fa-solid fa-copy"></i> 负向</button>
                            <button class="card-action-btn delete-btn" data-id="${img.id}" title="删除"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    card.querySelector('.thumb-wrapper').addEventListener('click', () => openDetail(img.id));
                    card.querySelector('.card-info').addEventListener('click', () => openDetail(img.id));
                    card.querySelector('.copy-pos').addEventListener('click', (e) => { e.stopPropagation(); copyText(img.prompt, '正向提示词'); });
                    card.querySelector('.copy-neg').addEventListener('click', (e) => { e.stopPropagation(); copyText(img.negativePrompt, '负向提示词'); });
                    card.querySelector('.delete-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteImage(img.id); });
                    galleryGrid.appendChild(card);
                });
            }

            async function copyText(text, label) {
                if (!text) { showToast(`${label}为空`, 'error'); return; }
                try {
                    await navigator.clipboard.writeText(text);
                    showToast(`${label}已复制`, 'success');
                } catch (e) {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast(`${label}已复制`, 'success');
                }
            }

            async function deleteImage(id) {
                if (!confirm('确定删除这张图片吗？此操作不可恢复。')) return;
                try {
                    await dbDeleteImage(id);
                    allImages = allImages.filter(img => img.id !== id);
                    if (activeFilters.length > 0) {
                        applyFilters();
                    } else {
                        filteredImages = filteredImages.filter(img => img.id !== id);
                        renderGallery();
                    }
                    updateTokenStats();
                    showToast('已删除', 'success');
                } catch (err) {
                    console.error('Delete error:', err);
                    showToast('删除失败', 'error');
                }
            }

            function openDetail(id) {
                const img = allImages.find(i => i.id === id);
                if (!img) return;
                selectedImageId = id;
                modalTitle.textContent = img.name;
                const paramsHtml = `
                    <div class="params-grid">
                        ${img.seed !== null ? `<div class="param-item"><span class="param-key">Seed</span><span class="param-value">${img.seed}</span></div>` : ''}
                        ${img.steps !== null ? `<div class="param-item"><span class="param-key">Steps</span><span class="param-value">${img.steps}</span></div>` : ''}
                        ${img.sampler ? `<div class="param-item"><span class="param-key">Sampler</span><span class="param-value">${img.sampler}</span></div>` : ''}
                        ${img.scale !== null ? `<div class="param-item"><span class="param-key">Scale</span><span class="param-value">${img.scale}</span></div>` : ''}
                    </div>
                `;
                modalBody.innerHTML = `
                    <div class="modal-image-container"><img src="${img.thumbnailDataURL}" alt="${img.name}"></div>
                    <div class="modal-section">
                        <span class="section-label"><i class="fa-solid fa-plus-circle" style="color:var(--success);"></i> 正向提示词</span>
                        <div class="prompt-text positive">${img.prompt || '无'}</div>
                        <div class="copy-row"><button class="copy-btn positive-btn" id="copyPosBtn"><i class="fa-solid fa-copy"></i> 复制正向提示词</button></div>
                    </div>
                    <div class="modal-section">
                        <span class="section-label"><i class="fa-solid fa-minus-circle" style="color:var(--danger);"></i> 负向提示词</span>
                        <div class="prompt-text negative">${img.negativePrompt || '无'}</div>
                        <div class="copy-row"><button class="copy-btn negative-btn" id="copyNegBtn"><i class="fa-solid fa-copy"></i> 复制负向提示词</button></div>
                    </div>
                    <div class="modal-section">
                        <span class="section-label"><i class="fa-solid fa-gear"></i> 生成参数</span>
                        ${paramsHtml}
                    </div>
                    <div class="modal-section">
                        <span class="section-label"><i class="fa-solid fa-tags"></i> 正向词条 (${img.promptTokens.length})</span>
                        <div style="display:flex;flex-wrap:wrap;gap:6px;">${img.promptTokens.map(t => `<span style="font-size:11px;background:#eef1ff;color:var(--primary);padding:3px 8px;border-radius:12px;">${t}</span>`).join('')}</div>
                    </div>
                    <div class="modal-section">
                        <span class="section-label"><i class="fa-solid fa-tags"></i> 负向词条 (${img.negativeTokens.length})</span>
                        <div style="display:flex;flex-wrap:wrap;gap:6px;">${img.negativeTokens.map(t => `<span style="font-size:11px;background:#fdf0ef;color:var(--danger);padding:3px 8px;border-radius:12px;">${t}</span>`).join('')}</div>
                    </div>
                `;
                document.getElementById('copyPosBtn').addEventListener('click', () => copyText(img.prompt, '正向提示词'));
                document.getElementById('copyNegBtn').addEventListener('click', () => copyText(img.negativePrompt, '负向提示词'));
                detailModal.classList.add('active');
            }

            function closeDetail() {
                detailModal.classList.remove('active');
                selectedImageId = null;
            }

            function openDiffModal(imgA, imgB) {
                const commonPos = imgA.promptTokens.filter(t => imgB.promptTokens.includes(t));
                const commonNeg = imgA.negativeTokens.filter(t => imgB.negativeTokens.includes(t));
                const diffPosA = imgA.promptTokens.filter(t => !imgB.promptTokens.includes(t));
                const diffPosB = imgB.promptTokens.filter(t => !imgA.promptTokens.includes(t));
                const diffNegA = imgA.negativeTokens.filter(t => !imgB.negativeTokens.includes(t));
                const diffNegB = imgB.negativeTokens.filter(t => !imgA.negativeTokens.includes(t));
                const renderTokenList = (tokens, type) => {
                    return tokens.map(t => `<span class="diff-token ${type}">${t}</span>`).join('') || '<span style="color:#aaa;">无</span>';
                };
                diffModalBody.innerHTML = `
                    <div class="diff-container">
                        <div class="diff-card">
                            <div class="diff-title"><i class="fa-solid fa-image"></i> ${imgA.name}</div>
                            <div class="modal-section"><span class="section-label" style="color:var(--success);">正向独有</span><div class="diff-token-list">${renderTokenList(diffPosA, 'positive')}</div></div>
                            <div class="modal-section"><span class="section-label" style="color:var(--danger);">负向独有</span><div class="diff-token-list">${renderTokenList(diffNegA, 'negative')}</div></div>
                        </div>
                        <div class="diff-card">
                            <div class="diff-title"><i class="fa-solid fa-image"></i> ${imgB.name}</div>
                            <div class="modal-section"><span class="section-label" style="color:var(--success);">正向独有</span><div class="diff-token-list">${renderTokenList(diffPosB, 'positive')}</div></div>
                            <div class="modal-section"><span class="section-label" style="color:var(--danger);">负向独有</span><div class="diff-token-list">${renderTokenList(diffNegB, 'negative')}</div></div>
                        </div>
                    </div>
                    <div class="modal-section"><span class="section-label"><i class="fa-solid fa-circle-check"></i> 共同正向词条</span><div class="diff-token-list">${renderTokenList(commonPos, 'positive')}</div></div>
                    <div class="modal-section"><span class="section-label"><i class="fa-solid fa-circle-check"></i> 共同负向词条</span><div class="diff-token-list">${renderTokenList(commonNeg, 'negative')}</div></div>
                `;
                diffModal.classList.add('active');
            }

            function closeDiffModal() {
                diffModal.classList.remove('active');
            }

            function updateTokenStats() {
                tokenStats = { positive: {}, negative: {} };
                allImages.forEach(img => {
                    img.promptTokens.forEach(token => {
                        if (!tokenStats.positive[token]) tokenStats.positive[token] = 0;
                        tokenStats.positive[token]++;
                    });
                    img.negativeTokens.forEach(token => {
                        if (!tokenStats.negative[token]) tokenStats.negative[token] = 0;
                        tokenStats.negative[token]++;
                    });
                });
            }

            function renderTokenList() {
                const searchTerm = tokenSearchInput.value.trim().toLowerCase();
                const stats = currentTokenTab === 'positive' ? tokenStats.positive : tokenStats.negative;
                const entries = Object.entries(stats).sort((a, b) => b[1] - a[1]);
                const filtered = entries.filter(([token, count]) => {
                    if (!searchTerm) return true;
                    return token.toLowerCase().includes(searchTerm);
                });
                if (filtered.length === 0) {
                    tokenList.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;"><i class="fa-solid fa-inbox" style="font-size:30px;opacity:0.4;display:block;margin-bottom:10px;"></i>暂无词条</div>';
                    return;
                }
                tokenList.innerHTML = '';
                filtered.forEach(([token, count]) => {
                    const item = document.createElement('div');
                    item.className = 'token-item';
                    const isActive = activeFilters.includes(token);
                    item.style.borderColor = isActive ? 'var(--primary)' : 'transparent';
                    item.style.background = isActive ? '#eef1ff' : '#f8f9fa';
                    const countClass = currentTokenTab === 'positive' ? 'pos' : 'neg';
                    item.innerHTML = `<span class="token-name">${token}</span><span class="token-count ${countClass}">${count} 次</span>`;
                    item.addEventListener('click', () => {
                        if (isActive) { removeFilter(token); } else { addFilter(token); }
                        renderTokenList();
                    });
                    tokenList.appendChild(item);
                });
            }

            function openTokenSidebar() {
                tokenSidebar.classList.add('active');
                updateTokenStats();
                renderTokenList();
            }

            function closeTokenSidebar() {
                tokenSidebar.classList.remove('active');
            }

            function openSimilarity() {
                if (allImages.length < 2) {
                    showToast('至少需要2张图片才能进行相似度比对', 'error');
                    return;
                }
                similarityOverlay.classList.add('active');
                renderSimilarityResults();
            }

            function closeSimilarity() {
                similarityOverlay.classList.remove('active');
            }

            function renderSimilarityResults() {
                const threshold = parseFloat(thresholdSlider.value);
                const excludeCommon = excludeCommonCheckbox.checked;
                const results = calculateSimilarities(allImages, threshold, excludeCommon);
                if (results.length === 0) {
                    similarityResults.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;"><i class="fa-solid fa-check-circle" style="font-size:30px;opacity:0.4;display:block;margin-bottom:10px;"></i>没有找到超过阈值的相似图片对</div>';
                    return;
                }
                similarityResults.innerHTML = '';
                results.forEach(result => {
                    const pair = document.createElement('div');
                    pair.className = 'sim-pair';
                    const isHigh = result.similarity >= 0.6;
                    pair.innerHTML = `
                        <div class="sim-thumbs">
                            <img src="${result.imgA.thumbnailDataURL}" alt="${result.imgA.name}" data-id="${result.imgA.id}" title="${result.imgA.name}">
                            <img src="${result.imgB.thumbnailDataURL}" alt="${result.imgB.name}" data-id="${result.imgB.id}" title="${result.imgB.name}">
                        </div>
                        <div class="sim-info">
                            <div class="sim-score ${isHigh ? 'high' : ''}"><i class="fa-solid ${isHigh ? 'fa-triangle-exclamation' : 'fa-chart-line'}"></i> 相似度: ${(result.similarity * 100).toFixed(1)}%</div>
                            <div class="sim-common-tokens">共同词条: ${result.commonTokens.slice(0, 8).join(', ')}${result.commonTokens.length > 8 ? '...' : ''}</div>
                        </div>
                        <div class="sim-actions">
                            <button class="sim-action-btn diff-btn" data-diff="true" data-a="${result.imgA.id}" data-b="${result.imgB.id}"><i class="fa-solid fa-code-compare"></i> 差异</button>
                            <button class="sim-action-btn delete" data-id="${result.imgA.id}" title="删除左侧图片"><i class="fa-solid fa-trash"></i> 左</button>
                            <button class="sim-action-btn delete" data-id="${result.imgB.id}" title="删除右侧图片"><i class="fa-solid fa-trash"></i> 右</button>
                        </div>
                    `;
                    pair.querySelector('.diff-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        const imgAId = e.currentTarget.dataset.a;
                        const imgBId = e.currentTarget.dataset.b;
                        const imgA = allImages.find(i => i.id === imgAId);
                        const imgB = allImages.find(i => i.id === imgBId);
                        if (imgA && imgB) openDiffModal(imgA, imgB);
                    });
                    pair.querySelectorAll('.sim-thumbs img').forEach(imgEl => {
                        imgEl.addEventListener('click', () => openDetail(imgEl.dataset.id));
                    });
                    pair.querySelectorAll('.sim-action-btn.delete').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const id = e.currentTarget.dataset.id;
                            deleteImage(id);
                            setTimeout(renderSimilarityResults, 300);
                        });
                    });
                    similarityResults.appendChild(pair);
                });
            }

            uploadBtn.addEventListener('click', () => fileInput.click());
            uploadHintBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    handleFiles(e.target.files);
                    fileInput.value = '';
                }
            });

            const galleryArea = document.getElementById('gallery');
            galleryArea.addEventListener('dragover', (e) => { e.preventDefault(); galleryArea.style.backgroundColor = '#eef1ff'; });
            galleryArea.addEventListener('dragleave', (e) => { e.preventDefault(); galleryArea.style.backgroundColor = ''; });
            galleryArea.addEventListener('drop', (e) => {
                e.preventDefault();
                galleryArea.style.backgroundColor = '';
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
            });

            clearFilterBtn.addEventListener('click', clearAllFilters);
            modalCloseBtn.addEventListener('click', closeDetail);
            detailModal.addEventListener('click', (e) => { if (e.target === detailModal) closeDetail(); });
            diffModalCloseBtn.addEventListener('click', closeDiffModal);
            diffModal.addEventListener('click', (e) => { if (e.target === diffModal) closeDiffModal(); });
            tokenLibraryBtn.addEventListener('click', openTokenSidebar);
            tokenSidebarClose.addEventListener('click', closeTokenSidebar);
            tabPositive.addEventListener('click', () => { currentTokenTab = 'positive'; tabPositive.classList.add('active'); tabNegative.classList.remove('active'); renderTokenList(); });
            tabNegative.addEventListener('click', () => { currentTokenTab = 'negative'; tabNegative.classList.add('active'); tabPositive.classList.remove('active'); renderTokenList(); });
            tokenSearchInput.addEventListener('input', renderTokenList);
            similarityBtn.addEventListener('click', openSimilarity);
            similarityCloseBtn.addEventListener('click', closeSimilarity);
            similarityOverlay.addEventListener('click', (e) => { if (e.target === similarityOverlay) closeSimilarity(); });
            thresholdSlider.addEventListener('input', () => { thresholdValue.textContent = parseFloat(thresholdSlider.value).toFixed(2); renderSimilarityResults(); });
            excludeCommonCheckbox.addEventListener('change', renderSimilarityResults);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (detailModal.classList.contains('active')) closeDetail();
                    if (diffModal.classList.contains('active')) closeDiffModal();
                    if (similarityOverlay.classList.contains('active')) closeSimilarity();
                    if (tokenSidebar.classList.contains('active')) closeTokenSidebar();
                }
            });

            async function init() {
                await loadAllImages();
                if (allImages.length > 0) {
                    galleryEmpty.style.display = 'none';
                    galleryGrid.style.display = 'grid';
                }
            }

            init().catch(err => {
                console.error('Init error:', err);
                showToast('初始化失败，请刷新页面重试', 'error');
            });
        })();
    </script>
</body>
</html>
