<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
    <title>NAI 提示词管理器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --sidebar-bg: #1e2a3a;
            --sidebar-text: #e0e6ed;
            --primary: #4a6cf7;
            --primary-hover: #3b5de7;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --success: #27ae60;
            --warning: #f39c12;
            --text: #2c3e50;
            --text-secondary: #7f8c8d;
            --border: #e1e5eb;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.15);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 5px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            --header-height: 60px;
            --filter-height: 48px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c0c4cc; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a0a4ac; }

        .app-header {
            position: sticky; top: 0; z-index: 100;
            background: var(--sidebar-bg); color: var(--sidebar-text);
            height: var(--header-height); display: flex; align-items: center;
            justify-content: space-between; padding: 0 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .app-header .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: 0.5px; white-space: nowrap; }
        .app-header .logo i { color: #6c8cff; font-size: 22px; }
        .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
        .header-btn {
            background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 8px 14px; border-radius: var(--radius-sm);
            cursor: pointer; font-size: 13px; font-weight: 500; display: flex;
            align-items: center; gap: 6px; transition: var(--transition); white-space: nowrap; font-family: var(--font);
        }
        .header-btn:hover { background: rgba(255, 255, 255, 0.22); border-color: rgba(255, 255, 255, 0.35); }
        .header-btn i { font-size: 14px; }
        .header-btn.primary { background: var(--primary); border-color: var(--primary); }
        .header-btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
        .header-btn.danger { background: var(--danger); border-color: var(--danger); }
        .header-btn.danger:hover { background: var(--danger-hover); border-color: var(--danger-hover); }

        .total-size-display { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #b0b8c4; background: rgba(255, 255, 255, 0.08); padding: 4px 10px; border-radius: 20px; white-space: nowrap; user-select: none; }
        .total-size-display i { font-size: 11px; }
        .total-size-display span { font-weight: 600; }

        .filter-bar {
            position: sticky; top: var(--header-height); z-index: 90;
            background: var(--card-bg); padding: 8px 16px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: var(--filter-height); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        .filter-bar .filter-label { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; }
        .filter-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex: 1; }
        .filter-tag { display: inline-flex; align-items: center; gap: 5px; background: #eef1ff; color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; transition: var(--transition); border: 1px solid #d5dcff; }
        .filter-tag:hover { background: #dfe5ff; }
        .filter-tag i { font-size: 10px; cursor: pointer; opacity: 0.7; }
        .filter-tag i:hover { opacity: 1; }
        .clear-filter-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: var(--radius-xs); transition: var(--transition); font-family: var(--font); }
        .clear-filter-btn:hover { color: var(--danger); background: #fef0ef; }
        .download-actions { display: none; gap: 6px; align-items: center; flex-wrap: wrap; }
        .download-actions.active { display: flex; }
        .download-actions .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 6px; border: 1px solid var(--border); background: #f8f9fa; cursor: pointer; transition: var(--transition); font-family: var(--font); color: var(--text); display: flex; align-items: center; gap: 4px; }
        .download-actions .btn-sm:hover { background: #e9ecef; }
        .download-actions .btn-sm.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .download-actions .btn-sm.primary:hover { background: var(--primary-hover); }
        .download-actions .btn-sm.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
        .download-actions .btn-sm.danger:hover { background: var(--danger-hover); }

        .weight-filter-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; width: 100%; padding-top: 6px; border-top: 1px dashed var(--border); margin-top: 6px; }
        .weight-filter-bar .weight-filter-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .weight-filter-bar .weight-capsule { display: inline-flex; align-items: center; gap: 4px; background: #f0f2f5; border-radius: 20px; padding: 4px 10px; font-size: 12px; font-weight: 500; border: 1px solid #d0d5dd; cursor: pointer; transition: var(--transition); user-select: none; }
        .weight-filter-bar .weight-capsule:hover { background: #e0e5ff; border-color: var(--primary); }
        .weight-filter-bar .weight-capsule.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .weight-filter-bar .weight-capsule .weight-count { background: rgba(255, 255, 255, 0.3); border-radius: 10px; padding: 0 5px; font-size: 10px; font-weight: 700; }
        .weight-filter-bar .weight-capsule.active .weight-count { background: rgba(255, 255, 255, 0.3); }

        .main-content { display: flex; min-height: calc(100vh - var(--header-height) - var(--filter-height)); }
        .gallery { flex: 1; padding: 16px; overflow-y: auto; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
        .gallery-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; color: var(--text-secondary); gap: 14px; text-align: center; padding: 20px; }
        .gallery-empty i { font-size: 60px; opacity: 0.4; }
        .gallery-empty p { font-size: 15px; max-width: 320px; line-height: 1.6; }
        .gallery-empty .upload-hint-btn { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; font-weight: 500; transition: var(--transition); font-family: var(--font); display: flex; align-items: center; gap: 8px; }
        .gallery-empty .upload-hint-btn:hover { background: var(--primary-hover); }

        .image-card { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: var(--transition); cursor: pointer; position: relative; border: 2px solid transparent; display: flex; flex-direction: column; }
        .image-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
        .image-card.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.2); }
        .image-card .thumb-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; background: #f0f0f0; flex-shrink: 0; }
        .image-card .thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease; }
        .image-card:hover .thumb-wrapper img { transform: scale(1.04); }
        .image-card .select-checkbox { position: absolute; top: 8px; left: 8px; width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; z-index: 5; display: none; }
        .image-card .select-checkbox.show { display: block; }
        .image-card .card-info { padding: 10px 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .image-card .card-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .image-card .card-prompt-preview { font-size: 11px; color: var(--text-secondary); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
        .image-card .card-actions { display: flex; gap: 4px; padding: 6px 8px; border-top: 1px solid #f0f0f0; flex-shrink: 0; }
        .card-action-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 5px 8px; cursor: pointer; font-size: 11px; color: var(--text-secondary); transition: var(--transition); display: flex; align-items: center; gap: 3px; font-family: var(--font); flex: 1; justify-content: center; }
        .card-action-btn:hover { background: #f5f6fa; color: var(--text); }
        .card-action-btn.copy-pos:hover { background: #eef7f0; color: var(--success); border-color: var(--success); }
        .card-action-btn.copy-neg:hover { background: #fdf0ef; color: var(--danger); border-color: var(--danger); }
        .card-action-btn.delete-btn:hover { background: #fdf0ef; color: var(--danger); border-color: var(--danger); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.55); z-index: 400; display: none; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(3px); animation: fadeIn 0.2s ease; }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-content { background: var(--card-bg); border-radius: var(--radius); max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: slideUp 0.25s ease; display: flex; flex-direction: column; }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; position: sticky; top: 0; background: var(--card-bg); z-index: 1; }
        .modal-header h3 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
        .modal-close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-secondary); padding: 4px 8px; border-radius: var(--radius-xs); transition: var(--transition); }
        .modal-close-btn:hover { background: #f0f0f0; color: var(--text); }
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .modal-image-container { width: 100%; max-height: 320px; display: flex; justify-content: center; background: #f8f9fa; border-radius: var(--radius-sm); overflow: hidden; }
        .modal-image-container img { max-width: 100%; max-height: 320px; object-fit: contain; }
        .modal-section { display: flex; flex-direction: column; gap: 8px; }
        .modal-section .section-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
        .prompt-text { background: #f8f9fa; padding: 12px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.6; word-break: break-all; max-height: 180px; overflow-y: auto; white-space: pre-wrap; font-family: 'Consolas', 'Monaco', 'Courier New', monospace; border: 1px solid #e8e8e8; }
        .prompt-text.negative { border-left: 3px solid var(--danger); }
        .prompt-text.positive { border-left: 3px solid var(--success); }
        .copy-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .copy-btn { background: #f0f2f5; border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius-xs); cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px; transition: var(--transition); font-family: var(--font); color: var(--text); }
        .copy-btn:hover { background: #e4e7eb; }
        .copy-btn.positive-btn:hover { background: #eef7f0; color: var(--success); border-color: var(--success); }
        .copy-btn.negative-btn:hover { background: #fdf0ef; color: var(--danger); border-color: var(--danger); }
        .params-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
        .param-item { background: #f8f9fa; padding: 8px 10px; border-radius: var(--radius-xs); font-size: 12px; display: flex; flex-direction: column; gap: 2px; border: 1px solid #e8e8e8; }
        .param-item .param-key { font-weight: 600; color: var(--text-secondary); font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; }
        .param-item .param-value { font-weight: 500; word-break: break-all; }

        .token-sidebar { position: fixed; top: 0; right: -500px; width: 480px; max-width: 95vw; height: 100vh; background: var(--card-bg); box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15); z-index: 300; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
        .token-sidebar.active { right: 0; }
        .token-sidebar-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; background: var(--sidebar-bg); color: #fff; }
        .token-sidebar-header h3 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .token-sidebar-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: var(--radius-xs); transition: var(--transition); }
        .token-sidebar-close:hover { background: rgba(255, 255, 255, 0.15); }
        .token-tabs { display: flex; gap: 4px; padding: 10px 16px; background: #f8f9fa; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .token-tab { padding: 7px 16px; border-radius: 20px; border: none; cursor: pointer; font-size: 12px; font-weight: 500; transition: var(--transition); font-family: var(--font); background: transparent; color: var(--text-secondary); }
        .token-tab.active { background: var(--primary); color: #fff; }
        .token-tab:hover:not(.active) { background: #e9ecf5; }
        .token-list { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
        .token-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #f8f9fa; border-radius: var(--radius-sm); border: 1px solid transparent; gap: 8px; flex-wrap: wrap; }
        .token-item:hover { background: #eef1ff; border-color: #d5dcff; }
        .token-item .token-name { font-size: 12px; font-weight: 500; word-break: break-all; flex: 1; line-height: 1.3; cursor: pointer; min-width: 60px; }
        .token-item .token-translation { font-size: 11px; color: #888; font-weight: 400; margin-left: 6px; }
        .token-item .token-count { font-size: 11px; color: var(--text-secondary); background: #e9ecef; padding: 2px 8px; border-radius: 10px; font-weight: 600; flex-shrink: 0; }
        .token-item .token-count.pos { background: #d4edda; color: #155724; }
        .token-item .token-count.neg { background: #f8d7da; color: #721c24; }
        .token-item .filter-token-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 12px; padding: 4px; border-radius: 4px; transition: var(--transition); flex-shrink: 0; }
        .token-item .filter-token-btn:hover { color: var(--primary); background: #e0e5ff; }
        .token-item .tag-badge { display: inline-flex; align-items: center; font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 500; flex-shrink: 0; cursor: pointer; transition: var(--transition); }
        .token-item .tag-badge:hover { opacity: 0.8; }
        .token-item .tag-badge.more-tags { background: #f0f0f0; color: #888; cursor: default; }
        .token-item .token-checkbox { accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; display: none; }
        .token-item .token-checkbox.show { display: block; }
        .token-item .token-action-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 12px; padding: 4px; border-radius: 4px; transition: var(--transition); flex-shrink: 0; }
        .token-item .token-action-btn:hover { background: #e9ecef; }
        .token-item .token-action-btn.tag-btn:hover { color: var(--warning); background: #fff8e1; }
        .token-item .token-action-btn.block-btn:hover { color: var(--danger); background: #fdf0ef; }
        .token-item .token-action-btn.edit-trans-btn:hover { color: var(--primary); background: #e0e5ff; }

        .token-weight-bar { padding: 8px 16px; border-bottom: 1px solid var(--border); background: #fcfcfc; flex-shrink: 0; }
        .token-weight-bar .weight-capsule { display: inline-flex; align-items: center; gap: 4px; background: #f0f2f5; border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 500; border: 1px solid #d0d5dd; cursor: pointer; transition: var(--transition); }
        .token-weight-bar .weight-capsule:hover { background: #e0e5ff; border-color: var(--primary); }
        .token-weight-bar .weight-capsule .weight-count { background: var(--primary); color: #fff; border-radius: 10px; padding: 2px 6px; font-size: 10px; font-weight: 700; }
        .token-search { padding: 10px 16px; flex-shrink: 0; position: relative; }
        .token-search input { width: 100%; padding: 8px 12px 8px 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font); outline: none; transition: var(--transition); background: #f8f9fa; }
        .token-search input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.1); }
        .token-search i { position: absolute; left: 26px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 13px; }

        .tag-filter-bar { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
        .tag-filter-bar::-webkit-scrollbar { height: 3px; }
        .tag-filter-capsule { display: inline-flex; align-items: center; gap: 5px; background: #f0f2f5; border-radius: 20px; padding: 4px 10px; font-size: 11px; font-weight: 500; border: 1px solid #d0d5dd; cursor: pointer; transition: var(--transition); user-select: none; white-space: nowrap; flex-shrink: 0; }
        .tag-filter-capsule:hover { background: #e0e5ff; border-color: var(--primary); }
        .tag-filter-capsule.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .tag-filter-capsule .tag-count { background: rgba(255, 255, 255, 0.3); border-radius: 10px; padding: 0 5px; font-size: 10px; font-weight: 700; }

        .token-toolbar { display: flex; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: #fafbfc; flex-wrap: wrap; align-items: center;}
        .token-toolbar .toolbar-btn { padding: 5px 10px; font-size: 11px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; transition: var(--transition); font-family: var(--font); color: var(--text); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .token-toolbar .toolbar-btn:hover { background: #f0f2f5; }
        .token-toolbar .toolbar-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .token-toolbar .toolbar-btn.tag-manage-btn:hover { color: var(--warning); border-color: var(--warning); }
        .token-toolbar .toolbar-btn.ai-export-btn { color: #8e44ad; border-color: #d2b4de; }
        .token-toolbar .toolbar-btn.ai-export-btn:hover { background: #f4ecf7; }
        .token-toolbar .toolbar-btn.ai-import-btn { color: #27ae60; border-color: #a3e4d7; }
        .token-toolbar .toolbar-btn.ai-import-btn:hover { background: #e8f8f5; }

        .batch-action-bar { display: none; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); flex-shrink: 0; background: #fafbfc; align-items: center; flex-wrap: wrap; }
        .batch-action-bar.active { display: flex; }
        .batch-action-bar .batch-btn { padding: 5px 10px; font-size: 11px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; transition: var(--transition); font-family: var(--font); color: var(--text); display: flex; align-items: center; gap: 4px; }
        .batch-action-bar .batch-btn:hover { background: #f0f2f5; }

        .tag-selector-list { display: flex; flex-wrap: wrap; gap: 8px; max-height: 200px; overflow-y: auto; padding: 4px; }
        .tag-selector-item { display: inline-flex; align-items: center; gap: 5px; background: #f0f2f5; border-radius: 16px; padding: 5px 12px; font-size: 12px; font-weight: 500; border: 2px solid transparent; cursor: pointer; transition: var(--transition); user-select: none; }
        .tag-selector-item:hover { background: #e0e5ff; }
        .tag-selector-item.selected { border-color: var(--primary); background: #eef1ff; color: var(--primary); }
        .tag-selector-item .tag-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

        .tag-manage-list { display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; }
        .tag-manage-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #f8f9fa; border-radius: var(--radius-sm); border: 1px solid #e8e8e8; gap: 8px; }
        .tag-manage-item .tag-manage-name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .tag-manage-item .tag-manage-count { font-size: 11px; color: var(--text-secondary); background: #e9ecef; padding: 2px 8px; border-radius: 10px; }
        .tag-manage-item .tag-manage-delete, .tag-manage-item .tag-manage-block { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 14px; padding: 4px; border-radius: 4px; transition: var(--transition); flex-shrink: 0; }
        .tag-manage-item .tag-manage-delete:hover { color: var(--danger); background: #fdf0ef; }

    <script>
(function() {
    // ==================== 数据库操作 ====================
    const DB_NAME = 'pngGalleryDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'images';
    let db = null;

    function openDB() {
        return new Promise((resolve, reject) => {
            if (db) { resolve(db); return; }
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = (e) => {
                const database = e.target.result;
                if (!database.objectStoreNames.contains(STORE_NAME)) {
                    const store = database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    store.createIndex('timestamp', 'timestamp', { unique: false });
                }
            };
            req.onsuccess = (e) => { db = e.target.result; resolve(db); };
            req.onerror = (e) => reject(e.target.error);
        });
    }

    function dbAddImage(imageData) {
        return new Promise((resolve, reject) => {
            openDB().then((database) => {
                const tx = database.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put(imageData);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            }).catch(reject);
        });
    }

    function dbGetAllImages() {
        return new Promise((resolve, reject) => {
            openDB().then((database) => {
                const tx = database.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const index = store.index('timestamp');
                const req = index.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = (e) => reject(e.target.error);
            }).catch(reject);
        });
    }

    function dbDeleteImage(id) {
        return new Promise((resolve, reject) => {
            openDB().then((database) => {
                const tx = database.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.delete(id);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            }).catch(reject);
        });
    }

    // ==================== PNG 元数据解析 ====================
    function parsePNGMetadata(arrayBuffer) {
        const bytes = new Uint8Array(arrayBuffer);
        if (bytes.length < 8) return null;
        const signature = [137, 80, 78, 71, 13, 10, 26, 10];
        for (let i = 0; i < 8; i++) if (bytes[i] !== signature[i]) return null;
        let offset = 8;
        let metadata = null;
        while (offset < bytes.length) {
            if (offset + 8 > bytes.length) break;
            const length = (bytes[offset] << 24) | (bytes[offset + 1] << 16) | (bytes[offset + 2] << 8) | bytes[offset + 3];
            const type = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
            const dataStart = offset + 8;
            const dataEnd = dataStart + length;
            if (dataEnd > bytes.length) break;
            if (type === 'tEXt' || type === 'iTXt') {
                const chunkData = bytes.slice(dataStart, dataEnd);
                let keyword = '';
                let textContent = '';
                if (type === 'tEXt') {
                    let nullIdx = -1;
                    for (let i = 0; i < chunkData.length; i++) if (chunkData[i] === 0) { nullIdx = i; break; }
                    if (nullIdx > -1) {
                        keyword = new TextDecoder('latin1').decode(chunkData.slice(0, nullIdx));
                        textContent = new TextDecoder('latin1').decode(chunkData.slice(nullIdx + 1));
                    }
                } else {
                    let nullIdx1 = -1;
                    for (let i = 0; i < chunkData.length; i++) if (chunkData[i] === 0) { nullIdx1 = i; break; }
                    if (nullIdx1 > -1) {
                        keyword = new TextDecoder('utf-8').decode(chunkData.slice(0, nullIdx1));
                        const restIdx = nullIdx1 + 1;
                        if (restIdx + 2 <= chunkData.length) {
                            let nullIdx2 = -1;
                            for (let i = restIdx + 2; i < chunkData.length; i++) if (chunkData[i] === 0) { nullIdx2 = i; break; }
                            if (nullIdx2 > -1) {
                                let nullIdx3 = -1;
                                for (let i = nullIdx2 + 1; i < chunkData.length; i++) if (chunkData[i] === 0) { nullIdx3 = i; break; }
                                const textStart = nullIdx3 > -1 ? nullIdx3 + 1 : nullIdx2 + 1;
                                textContent = new TextDecoder('utf-8').decode(chunkData.slice(textStart));
                            }
                        }
                    }
                }
                if (keyword === 'Comment' || keyword === 'parameters' || keyword === 'prompt' || keyword === 'description') {
                    if (textContent && textContent.trim().startsWith('{')) {
                        try { metadata = JSON.parse(textContent); } catch (e) {
                            const jsonMatch = textContent.match(/{[\s\S]*}/);
                            if (jsonMatch) { try { metadata = JSON.parse(jsonMatch[0]); } catch (e2) { metadata = null; } }
                        }
                    }
                    if (metadata) break;
                }
            }
            offset = dataEnd + 4;
        }
        return metadata;
    }

    // ==================== 词条提取 ====================
    function parseBrackets(rawToken) {
        let token = rawToken.trim();
        let multiplier = 1.0;
        let changed = true;
        while (changed) {
            changed = false;
            if (token.startsWith('{') && token.endsWith('}')) { multiplier *= 1.05; token = token.slice(1, -1).trim(); changed = true; }
            if (token.startsWith('[') && token.endsWith(']')) { multiplier *= 1 / 1.05; token = token.slice(1, -1).trim(); changed = true; }
        }
        return { token, multiplier };
    }

    function extractTokenData(promptStr) {
        if (!promptStr) return { tokens: [], weights: {} };
        let cleaned = promptStr.replace(/{{tar}}/g, '');
        const tokensSet = new Set();
        const weights = {};

        function processPlainToken(rawToken) {
            let token = rawToken.trim();
            if (!token) return null;
            const bracket = parseBrackets(token);
            token = bracket.token;
            let weight = bracket.multiplier;
            const suffixMatch = token.match(/(.+?):\s*(-?\d+(?:\.\d+)?)\s*$/);
            if (suffixMatch) {
                token = suffixMatch[1].trim();
                const w = parseFloat(suffixMatch[2]);
                if (!isNaN(w)) weight = w;
            }
            token = token.replace(/[()\[\]<>]/g, '').replace(/\s+/g, ' ').trim().replace(/^[\d\s.]+/, '').trim();
            if (!token || token.length < 1 || token.length >= 200) return null;
            return { token, weight };
        }

        const weightBlocks = [];
        const blockRegex = /(-?\d+(?:\.\d+)?)\s*::\s*([\s\S]*?)\s*::/g;
        let match;
        let remainingStr = cleaned;
        while ((match = blockRegex.exec(cleaned)) !== null) {
            weightBlocks.push({ weight: parseFloat(match[1]), content: match[2] });
            remainingStr = remainingStr.replace(match[0], '');
        }

        for (let part of remainingStr.split(',')) {
            const result = processPlainToken(part);
            if (result) { tokensSet.add(result.token); weights[result.token] = result.weight; }
        }
        for (const block of weightBlocks) {
            for (let rawToken of block.content.split(',')) {
                if (!rawToken.trim()) continue;
                const bracket = parseBrackets(rawToken);
                let token = bracket.token.replace(/[()\[\]<>]/g, '').replace(/\s+/g, ' ').trim().replace(/^[\d\s.]+/, '').trim();
                if (!token || token.length < 1 || token.length >= 200) continue;
                tokensSet.add(token);
                weights[token] = block.weight * bracket.multiplier;
            }
        }
        return { tokens: Array.from(tokensSet), weights };
    }

    // ==================== 存储管理 (localStorage) ====================
    const LS_PREFIX = 'naiTagManager_';
    const LS_CUSTOM_LABELS = LS_PREFIX + 'customLabels';
    const LS_TOKEN_LABELS = LS_PREFIX + 'tokenLabels';
    const LS_BLOCKED_TOKENS = LS_PREFIX + 'blockedTokens';
    const LS_BLOCKED_LABELS = LS_PREFIX + 'blockedLabels';
    const LS_TOKEN_TRANSLATIONS = LS_PREFIX + 'tokenTranslations';
    const LS_SHOW_TRANSLATION = LS_PREFIX + 'showTranslation';

    function loadCustomLabels() { try { return JSON.parse(localStorage.getItem(LS_CUSTOM_LABELS)) || []; } catch(e){return [];} }
    function saveCustomLabels(data) { localStorage.setItem(LS_CUSTOM_LABELS, JSON.stringify(data)); }

    function loadTokenLabels() { try { return JSON.parse(localStorage.getItem(LS_TOKEN_LABELS)) || {}; } catch(e){return {};} }
    function saveTokenLabels(data) { localStorage.setItem(LS_TOKEN_LABELS, JSON.stringify(data)); }

    function loadBlockedTokens() { try { return JSON.parse(localStorage.getItem(LS_BLOCKED_TOKENS)) || {}; } catch(e){return {};} }
    function saveBlockedTokens(data) { localStorage.setItem(LS_BLOCKED_TOKENS, JSON.stringify(data)); }

    function loadBlockedLabels() { try { return JSON.parse(localStorage.getItem(LS_BLOCKED_LABELS)) || {}; } catch(e){return {};} }
    function saveBlockedLabels(data) { localStorage.setItem(LS_BLOCKED_LABELS, JSON.stringify(data)); }

    // 翻译相关
    function loadTranslations() { try { return JSON.parse(localStorage.getItem(LS_TOKEN_TRANSLATIONS)) || {}; } catch(e){return {};} }

    // 全局翻译开关
    let showTranslation = localStorage.getItem(LS_SHOW_TRANSLATION) !== 'false';

    const LABEL_COLORS = [
        '#4a6cf7', '#e74c3c', '#27ae60', '#f39c12', '#9b59b6', '#3498db',
        '#e74c3c', '#2ecc71', '#1abc9c', '#e67e22', '#34495e', '#7f8c8d',
        '#c0392b', '#16a085', '#2980b9', '#8e44ad'
    ];
    function getLabelColor(label) {
        const labels = loadCustomLabels();
        const idx = labels.indexOf(label);
        if (idx >= 0) return LABEL_COLORS[idx % LABEL_COLORS.length];
        let hash = 0;
        for (let i = 0; i < label.length; i++) hash = (hash * 31 + label.charCodeAt(i)) & 0xffffffff;
        return LABEL_COLORS[hash % LABEL_COLORS.length];
    }

    function getTokenLabels(token) { return loadTokenLabels()[token] || []; }
    function addTokenLabel(token, label) {
        const data = loadTokenLabels();
        if (!data[token]) data[token] = [];
        if (!data[token].includes(label)) { data[token].push(label); saveTokenLabels(data); }
    }
    function removeTokenLabel(token, label) {
        const data = loadTokenLabels();
        if (data[token]) {
            data[token] = data[token].filter(l => l !== label);
            if (data[token].length === 0) delete data[token];
            saveTokenLabels(data);
        }
    }

    function getEffectiveBlockSettings(token) {
        const blockedTokens = loadBlockedTokens();
        const blockedLabels = loadBlockedLabels();
        const tokenLabels = getTokenLabels(token);
        const settings = { display: false, copy: false, diff: false };
        tokenLabels.forEach(label => {
            if (blockedLabels[label]) {
                if (blockedLabels[label].display) settings.display = true;
                if (blockedLabels[label].copy) settings.copy = true;
                if (blockedLabels[label].diff) settings.diff = true;
            }
        });
        if (blockedTokens[token]) {
            if (blockedTokens[token].display !== undefined) settings.display = blockedTokens[token].display;
            if (blockedTokens[token].copy !== undefined) settings.copy = blockedTokens[token].copy;
            if (blockedTokens[token].diff !== undefined) settings.diff = blockedTokens[token].diff;
        }
        return settings;
    }

    function getBlockedTokensForCopy() {
        const blocked = new Set();
        const blockedTokens = loadBlockedTokens();
        const blockedLabels = loadBlockedLabels();
        const tokenLabels = loadTokenLabels();
        for (const [token, s] of Object.entries(blockedTokens)) if (s.copy) blocked.add(token);
        for (const [label, s] of Object.entries(blockedLabels)) if (s.copy) for (const [token, labels] of Object.entries(tokenLabels)) if (labels.includes(label)) blocked.add(token);
        return blocked;
    }
    function getBlockedTokensForDiff() {
        const blocked = new Set();
        const blockedTokens = loadBlockedTokens();
        const blockedLabels = loadBlockedLabels();
        const tokenLabels = loadTokenLabels();
        for (const [token, s] of Object.entries(blockedTokens)) if (s.diff) blocked.add(token);
        for (const [label, s] of Object.entries(blockedLabels)) if (s.diff) for (const [token, labels] of Object.entries(tokenLabels)) if (labels.includes(label)) blocked.add(token);
        return blocked;
    }

    function removeBlockedTokensFromPrompt(prompt, blockedTokens) {
        if (!prompt || blockedTokens.size === 0) return prompt;
        const weightBlockRegex = /(-?\d+(?:\.\d+)?)\s*::\s*([\s\S]*?)\s*::/g;
        let result = ''; let lastIndex = 0; let match;
        const filterStr = (text) => text.split(',').filter(p => {
            const tr = p.trim();
            if (!tr) return false;
            return !extractTokenData(tr).tokens.some(t => blockedTokens.has(t));
        }).join(',');

        while ((match = weightBlockRegex.exec(prompt)) !== null) {
            result += filterStr(prompt.slice(lastIndex, match.index));
            const filteredContent = filterStr(match[2]);
            if (filteredContent) result += `${match[1]}::${filteredContent}::`;
            lastIndex = weightBlockRegex.lastIndex;
        }
        result += filterStr(prompt.slice(lastIndex));
        return result.replace(/,\s*,/g, ',').replace(/^,\s*/, '').replace(/,\s*$/, '').trim();
    }

    function getTranslationHtml(token) {
        if (!showTranslation) return '';
        const trans = loadTranslations()[token];
        return trans ? `<span class="token-translation">(${trans})</span>` : '';
    }

    // ==================== 相似度计算 ====================
    function jaccardSimilarity(setA, setB) {
        if (setA.length === 0 && setB.length === 0) return 0;
        const intersection = setA.filter(t => setB.includes(t));
        const union = new Set([...setA, ...setB]);
        if (union.size === 0) return 0;
        return intersection.length / union.size;
    }
    function getFilteredTokens(image, excludeCommon, commonThreshold = 0.5, allImages = null) {
        let tokens = [...image.promptTokens].filter(t => !getBlockedTokensForDiff().has(t));
        if (excludeCommon && allImages && allImages.length > 1) {
            const total = allImages.length;
            tokens = tokens.filter(token => allImages.filter(img => img.promptTokens.includes(token)).length <= total * commonThreshold);
        }
        return tokens;
    }
    function calculateSimilarities(images, threshold, excludeCommon) {
        const results = [];
        for (let i = 0; i < images.length; i++) {
            for (let j = i + 1; j < images.length; j++) {
                const tokensA = getFilteredTokens(images[i], excludeCommon, 0.5, images);
                const tokensB = getFilteredTokens(images[j], excludeCommon, 0.5, images);
                const sim = jaccardSimilarity(tokensA, tokensB);
                if (sim >= threshold) results.push({ imgA: images[i], imgB: images[j], similarity: sim, commonTokens: tokensA.filter(t => tokensB.includes(t)) });
            }
        }
        return results.sort((a, b) => b.similarity - a.similarity);
    }

    async function loadAllImages() {

    function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function applyFilters() { /* 代码保留原逻辑，精简省略展示 */
        if (activeFilters.length === 0) filteredImages = [...allImages];
        else {
            filteredImages = allImages.filter(img => activeFilters.every(f => {
                if (f.type === 'positive') return img.promptTokens.includes(f.token);
                if (f.type === 'negative') return img.negativeTokens.includes(f.token);
                return img.promptTokens.includes(f.token) || img.negativeTokens.includes(f.token);
            }));
        }
        renderGallery(); renderFilterTags();
    }

    function addFilter(f) { if(!activeFilters.some(a=>a.token===f.token && a.type===f.type)) activeFilters.push(f); applyFilters(); }

        catch(e) { const ta = document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast(`${label}已复制`, 'success'); }

    function renderTagFilterBar() {

        if(activeTagFilters.length > 0) entries = entries.filter(([t])=> activeTagFilters.every(l=>(tokenLabels[t]||[]).includes(l)));
        if(searchTerm) entries = entries.filter(([t])=> t.toLowerCase().includes(searchTerm) || (translations[t]||'').includes(searchTerm) || (tokenLabels[t]||[]).some(l=>l.toLowerCase().includes(searchTerm)));
        if(!batchLabelMode && currentTokenTab !== 'blocked') entries = entries.filter(([t]) => !getEffectiveBlockSettings(t).display);

    document.getElementById('aiConfirmImportBtn').addEventListener('click', () => {
        let text = document.getElementById('aiTextArea').value.trim();
        if(!text) return showToast('内容为空', 'error');
        text = text.replace(/^```json/m, '').replace(/^```/m, '').replace(/```$/m, '').trim();

        try {
            const data = JSON.parse(text);
            const customLabels = loadCustomLabels();
            const tokenLabels = loadTokenLabels();
            const translations = loadTranslations();

            let count = 0;
            for(const [token, info] of Object.entries(data)) {
                if(info.translation) translations[token] = info.translation;
                if(info.labels && Array.isArray(info.labels)) {
                    if(!tokenLabels[token]) tokenLabels[token] = [];
                    info.labels.forEach(l => {
                        if(!customLabels.includes(l)) customLabels.push(l);
                        if(!tokenLabels[token].includes(l)) tokenLabels[token].push(l);
                    });
                }
                count++;
            }
            saveCustomLabels(customLabels);
            saveTokenLabels(tokenLabels);
            saveTranslations(translations);

            showToast(`成功导入 ${count} 个词条的标记信息`, 'success');
            aiModal.classList.remove('active');
            renderTagFilterBar();
            renderTokenList();
            renderGallery();
        } catch(e) {
            showToast('解析 JSON 失败，请检查格式', 'error');
            console.error(e);
        }
    });

    document.getElementById('clearTranslationBtn').addEventListener('click', () => {
        if(confirm('确定要清空全局所有的翻译文本吗？操作不可恢复。')) {
            saveTranslations({});
            showToast('已清空所有翻译', 'success');
            renderTokenList();
            renderGallery();
        }
    });

    document.getElementById('aiModalCloseBtn').addEventListener('click', () => aiModal.classList.remove('active'));
    document.getElementById('modalCloseBtn').addEventListener('click', () => detailModal.classList.remove('active'));
    document.getElementById('tokenSidebarClose').addEventListener('click', () => tokenSidebar.classList.remove('active'));
    document.getElementById('tokenLibraryBtn').addEventListener('click', () => { tokenSidebar.classList.add('active'); renderTagFilterBar(); renderTokenList(); });

    ['positive', 'negative', 'blocked'].forEach(tab => {
        document.getElementById(`tab${tab.charAt(0).toUpperCase()+tab.slice(1)}`).addEventListener('click', (e) => {
            currentTokenTab = tab;
            document.querySelectorAll('.token-tab').forEach(el=>el.classList.remove('active'));
            e.target.classList.add('active');
            renderTagFilterBar(); renderTokenList();
        });
    });

    document.getElementById('tokenSearchInput').addEventListener('input', renderTokenList);

    // 图片上传绑定
    const fileInput = document.getElementById('fileInput');
    document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());
    document.getElementById('uploadHintBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files).filter(f=>f.type==='image/png');
        if(!files.length) return showToast('未选择有效PNG', 'error');
        for(let f of files) {
            const arr = await f.arrayBuffer(); const meta = parsePNGMetadata(arr);
            if(!meta || !meta.prompt) continue;
            const pData = extractTokenData(meta.prompt); const nData = extractTokenData(meta.uc||'');
            // 简单缩略图处理这里略写为objectURL方便展示，实际可换回canvas转码
            const url = URL.createObjectURL(f);
            await dbAddImage({
                id: 'img_' + Date.now() + Math.random(), name: f.name, fileBlob: f, thumbnailDataURL: url,
                prompt: meta.prompt, negativePrompt: meta.uc, promptTokens: pData.tokens, negativeTokens: nData.tokens,
                timestamp: Date.now()
            });
        }
        await loadAllImages();
        showToast('导入完成', 'success');
    });

    (async function init() { await loadAllImages(); })();
})();
    </script>
</body>
</html>
