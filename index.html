<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAI 提示词管理器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* === 基础样式 === */
        :root {
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --sidebar-bg: #1e2a3a;
            --sidebar-text: #e0e6ed;
            --primary: #4a6cf7;
            --primary-hover: #3b5de7;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --success: #27ae60;
            --warning: #f39c12;
            --text: #2c3e50;
            --text-secondary: #7f8c8d;
            --border: #e1e5eb;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.15);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 5px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --header-height: 60px;
            --filter-height: 48px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c0c4cc; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a0a4ac; }

        .app-header { position: sticky; top: 0; z-index: 100; background: var(--sidebar-bg); color: var(--sidebar-text); height: var(--header-height); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }
        .app-header .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: 0.5px; }
        .app-header .logo i { color: #6c8cff; font-size: 22px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .header-btn { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: var(--transition); white-space: nowrap; font-family: var(--font); }
        .header-btn:hover { background: rgba(255, 255, 255, 0.22); }
        .header-btn.primary { background: var(--primary); border-color: var(--primary); }
        .header-btn.primary:hover { background: var(--primary-hover); }

        .total-size-display { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #b0b8c4; background: rgba(255, 255, 255, 0.08); padding: 4px 10px; border-radius: 20px; user-select: none; }

        .filter-bar { position: sticky; top: var(--header-height); z-index: 90; background: var(--card-bg); padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: var(--filter-height); }
        .filter-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex: 1; }
        .filter-tag { display: inline-flex; align-items: center; gap: 5px; background: #eef1ff; color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 12px; cursor: pointer; }
        .clear-filter-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 4px; }
        .clear-filter-btn:hover { color: var(--danger); }

        .download-actions { display: none; gap: 6px; align-items: center; }
        .download-actions.active { display: flex; }
        .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 6px; border: 1px solid var(--border); background: #f8f9fa; cursor: pointer; color: var(--text); }
        .btn-sm:hover { background: #e9ecef; }
        .btn-sm.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-sm.danger { background: var(--danger); color: #fff; border-color: var(--danger); }

        .main-content { display: flex; min-height: calc(100vh - var(--header-height) - var(--filter-height)); }
        .gallery { flex: 1; padding: 16px; overflow-y: auto; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
        .gallery-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; color: var(--text-secondary); gap: 14px; text-align: center; }
        .gallery-empty i { font-size: 60px; opacity: 0.4; }

        .image-card { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: var(--transition); cursor: pointer; position: relative; border: 2px solid transparent; display: flex; flex-direction: column; }
        .image-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
        .image-card.selected { border-color: var(--primary); }
        .image-card .thumb-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; background: #f0f0f0; }
        .image-card img { width: 100%; height: 100%; object-fit: cover; }
        .image-card .select-checkbox { position: absolute; top: 8px; left: 8px; width: 20px; height: 20px; accent-color: var(--primary); z-index: 5; display: none; }
        .image-card .select-checkbox.show { display: block; }
        .image-card .card-info { padding: 10px 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .image-card .card-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .image-card .card-prompt-preview { font-size: 11px; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .image-card .card-actions { display: flex; gap: 4px; padding: 6px 8px; border-top: 1px solid #f0f0f0; }
        .card-action-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 5px 8px; cursor: pointer; font-size: 11px; flex: 1; display: flex; align-items: center; justify-content: center; gap: 3px; }
        .card-action-btn:hover { background: #f5f6fa; }

        /* === 模态框 === */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.55); z-index: 400; display: none; align-items: center; justify-content: center; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card-bg); border-radius: var(--radius); max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--card-bg); z-index: 1; }
        .modal-header h3 { font-size: 16px; font-weight: 600; }
        .modal-close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-secondary); }
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

        .prompt-text { background: #f8f9fa; padding: 12px; border-radius: var(--radius-sm); font-size: 13px; max-height: 180px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; font-family: monospace; border: 1px solid #e8e8e8; }
        .prompt-text.negative { border-left: 3px solid var(--danger); }
        .prompt-text.positive { border-left: 3px solid var(--success); }
        .copy-btn { background: #f0f2f5; border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius-xs); cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }

        /* === 词条侧边栏 === */
        .token-sidebar { position: fixed; top: 0; right: -480px; width: 450px; max-width: 95vw; height: 100vh; background: var(--card-bg); box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15); z-index: 300; transition: right 0.3s; display: flex; flex-direction: column; }
        .token-sidebar.active { right: 0; }
        .token-sidebar-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--sidebar-bg); color: #fff; }
        .token-sidebar-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }

        .token-tabs { display: flex; gap: 4px; padding: 10px 16px; background: #f8f9fa; border-bottom: 1px solid var(--border); }
        .token-tab { padding: 7px 16px; border-radius: 20px; border: none; cursor: pointer; font-size: 12px; font-weight: 500; background: transparent; color: var(--text-secondary); }
        .token-tab.active { background: var(--primary); color: #fff; }

        .token-toolbar { display: flex; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: #fafbfc; flex-wrap: wrap; }
        .token-toolbar .toolbar-btn { padding: 5px 10px; font-size: 11px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .token-toolbar .toolbar-btn:hover { background: #f0f2f5; }

        .token-list { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
        .token-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #f8f9fa; border-radius: var(--radius-sm); border: 1px solid transparent; gap: 8px; flex-wrap: wrap; }
        .token-item:hover { background: #eef1ff; border-color: #d5dcff; }
        .token-item .token-name { font-size: 12px; font-weight: 500; word-break: break-all; flex: 1; min-width: 60px; cursor: pointer; }
        .token-item .token-count { font-size: 11px; color: var(--text-secondary); background: #e9ecef; padding: 2px 8px; border-radius: 10px; }
        .token-item .token-action-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 12px; padding: 4px; border-radius: 4px; }
        .token-item .token-action-btn:hover { background: #e9ecef; }
        .token-item .tag-badge { display: inline-flex; align-items: center; font-size: 10px; padding: 1px 6px; border-radius: 10px; cursor: pointer; }
        .token-item .token-checkbox { display: none; }
        .token-item .token-checkbox.show { display: block; }

        /* === 翻译相关样式 === */
        .trans-text { color: #8a96a3; font-size: 0.9em; font-style: italic; user-select: none; margin-left: 4px; }
        .token-diff-item .trans-text { font-size: 0.8em; }

        textarea.ai-textarea { width: 100%; height: 200px; padding: 10px; font-family: monospace; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); resize: vertical; }

        /* Toast 弹窗 */
        .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 500; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .toast { background: #333; color: #fff; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13px; animation: toastIn 0.3s ease, toastOut 0.3s ease 2.2s forwards; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        @keyframes toastIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }

        #fileInput { display: none; }
    </style>
</head>
<body>
    <!-- 头部区域 -->
    <header class="app-header">
        <div class="logo"><i class="fa-solid fa-images"></i><span>NAI解析</span></div>
        <div class="header-actions">
            <div class="total-size-display" id="totalSizeDisplay"><i class="fa-solid fa-database"></i> <span id="totalSizeValue">0 B</span></div>
            <button class="header-btn primary" id="uploadBtn"><i class="fa-solid fa-upload"></i> 上传图片</button>
            <button class="header-btn" id="downloadModeBtn"><i class="fa-solid fa-check-square"></i> 多选操作</button>
            <button class="header-btn" id="tokenLibraryBtn"><i class="fa-solid fa-book"></i> 词条库</button>
        </div>
    </header>

    <!-- 筛选和多选操作栏 -->
    <div class="filter-bar" id="filterBar">
        <span style="font-size: 13px; color: var(--text-secondary);"><i class="fa-solid fa-filter"></i> 筛选:</span>
        <div class="filter-tags" id="filterTags"></div>
        <button class="clear-filter-btn" id="clearFilterBtn" style="display:none;"><i class="fa-solid fa-times"></i> 清除</button>

        <div class="download-actions" id="downloadActions">
            <button class="btn-sm" id="selectAllBtn">全选</button>
            <button class="btn-sm" id="deselectAllBtn">取消全选</button>
            <button class="btn-sm danger" id="deleteSelectedBtn"><i class="fa-solid fa-trash"></i> 删除选中</button>
            <button class="btn-sm primary" id="downloadWithMetaBtn"><i class="fa-solid fa-download"></i> 原图下载</button>
        </div>
    </div>

    <!-- 画廊 -->
    <div class="main-content">
        <div class="gallery" id="gallery">
            <div class="gallery-empty" id="galleryEmpty">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <p>上传PNG图片以开始管理提示词<br>支持批量上传，自动解析元数据</p>
                <button class="btn-sm primary" style="padding: 10px 20px; font-size: 14px;" id="uploadHintBtn">选择图片</button>
            </div>
            <div class="gallery-grid" id="galleryGrid" style="display:none;"></div>
        </div>
    </div>

    <!-- 词条库侧边栏 -->
    <div class="token-sidebar" id="tokenSidebar">
        <div class="token-sidebar-header">
            <h3 style="font-size:15px;"><i class="fa-solid fa-book"></i> 词条库</h3>
            <button class="token-sidebar-close" id="tokenSidebarClose"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="token-toolbar" id="tokenToolbar">
            <button class="toolbar-btn" id="tagManageBtn"><i class="fa-solid fa-tags"></i> 标签管理</button>
            <button class="toolbar-btn" id="aiExportBtn"><i class="fa-solid fa-file-export"></i> AI导出</button>
            <button class="toolbar-btn" id="aiImportBtn"><i class="fa-solid fa-file-import"></i> AI导入</button>
            <button class="toolbar-btn" id="toggleTransBtn"><i class="fa-solid fa-language"></i> 显示翻译: 开</button>
        </div>

        <div class="token-tabs">
            <button class="token-tab active" data-tab="positive" id="tabPositive">正向词</button>
            <button class="token-tab" data-tab="negative" id="tabNegative">负向词</button>
        </div>

        <div style="padding:10px 16px; border-bottom: 1px solid var(--border);">
            <input type="text" id="tokenSearchInput" placeholder="搜索词条/翻译/标签..." style="width:100%; padding:6px 10px; border-radius:4px; border:1px solid #ccc; font-size:12px;">
        </div>

        <div class="token-list" id="tokenList"></div>
    </div>

    <!-- AI 导出 Modal -->
    <div class="modal-overlay" id="aiExportModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h3><i class="fa-solid fa-file-export"></i> AI 导出生成</h3>
                <button class="modal-close-btn" onclick="document.getElementById('aiExportModal').classList.remove('active')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div style="display: flex; gap: 10px; font-size: 13px;">
                    <label>导出目标：
                        <select id="exportTarget" style="padding: 4px;">
                            <option value="tag">标签分类</option>
                            <option value="trans">词条翻译</option>
                        </select>
                    </label>
                    <label>词条极性：
                        <select id="exportPolarity" style="padding: 4px;">
                            <option value="positive">正向词条</option>
                            <option value="negative">负向词条</option>
                        </select>
                    </label>
                    <button class="copy-btn primary" id="generateExportBtn">生成 Prompt</button>
                </div>
                <textarea class="ai-textarea" id="aiExportText" readonly placeholder="点击上方生成，生成完毕后一键复制发送给 AI..."></textarea>
                <div style="text-align: right;">
                    <button class="copy-btn positive-btn" id="copyAiExportBtn"><i class="fa-solid fa-copy"></i> 复制并去求助 AI</button>
                </div>
            </div>
        </div>
    </div>

    <!-- AI 导入 Modal -->
    <div class="modal-overlay" id="aiImportModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h3><i class="fa-solid fa-file-import"></i> AI 结果导入</h3>
                <button class="modal-close-btn" onclick="document.getElementById('aiImportModal').classList.remove('active')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div style="display: flex; gap: 10px; font-size: 13px; justify-content: space-between; align-items: center;">
                    <label>导入目标：
                        <select id="importTarget" style="padding: 4px;">
                            <option value="tag">标签分类 JSON</option>
                            <option value="trans">词条翻译 JSON</option>
                        </select>
                    </label>
                    <button class="copy-btn negative-btn" id="clearAllTransBtn" style="border-color: var(--danger); color: var(--danger);"><i class="fa-solid fa-trash"></i> 清空所有翻译</button>
                </div>
                <p style="font-size: 11px; color: var(--text-secondary);">请将 AI 返回的 JSON 格式代码粘贴到下方文本框中：</p>
                <textarea class="ai-textarea" id="aiImportText" placeholder='{"1girl": "1个女孩"}'></textarea>
                <div style="text-align: right;">
                    <button class="copy-btn positive-btn" id="applyAiImportBtn"><i class="fa-solid fa-check"></i> 确认导入并解析</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 详情模态框 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <div class="modal-header"><h3 id="modalTitle">图片详情</h3><button class="modal-close-btn" id="modalCloseBtn"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <input type="file" id="fileInput" accept="image/png" multiple>

    <script>
        // === 全局数据 ===
        const DB_NAME = 'pngGalleryDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'images';
        let db = null;
        let allImages = [];
        let filteredImages = [];
        let activeFilters = [];
        let selectedIds = new Set();
        let selectionMode = false;

        let tokenStats = { positive: {}, negative: {} };
        let currentTokenTab = 'positive';
        let showTranslation = localStorage.getItem('naiTagManager_showTrans') !== 'false'; // 默认开启

        const tagStoreKey = 'naiTagManager_tokenLabels';
        const customTagStoreKey = 'naiTagManager_customLabels';
        const transStoreKey = 'naiTagManager_tokenTranslations';

        // 初始化加载
        (async function init() {
            try {
                await openDB();
                await loadAllImages();
                updateTransToggleButton();
            } catch (err) {
                showToast('初始化失败', 'error');
            }
        })();

        // === 数据库操作 (IndexedDB) ===
        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e.target.error);
            });
        }
        function dbAddImage(data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(data);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }
        function dbGetAllImages() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(tx.error);
            });
        }
        function dbDeleteImage(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(id);
                tx.oncomplete = () => resolve();
            });
        }

        // === PNG 解析及提取 ===
        // (略微简化了不相关的括号提取权重等逻辑，聚焦在 Token 拆分上)
        function parsePNGMetadata(buffer) {
            const bytes = new Uint8Array(buffer);
            let offset = 8;
            while (offset < bytes.length) {
                if (offset + 8 > bytes.length) break;
                const length = (bytes[offset]<<24) | (bytes[offset+1]<<16) | (bytes[offset+2]<<8) | bytes[offset+3];
                const type = String.fromCharCode(bytes[offset+4],bytes[offset+5],bytes[offset+6],bytes[offset+7]);
                const dataStart = offset + 8;
                if (type === 'tEXt' || type === 'iTXt') {
                    const chunk = bytes.slice(dataStart, dataStart + length);
                    const nullIdx = chunk.indexOf(0);
                    if (nullIdx > -1) {
                        const keyword = new TextDecoder('latin1').decode(chunk.slice(0, nullIdx));
                        if (['Comment', 'parameters', 'prompt', 'description'].includes(keyword)) {
                            let text = new TextDecoder('utf-8').decode(chunk.slice(nullIdx + 1));
                            // 处理 iTXt 中额外的 null byte
                            if(type === 'iTXt') {
                                text = text.replace(/^\x00[^\x00]*\x00[^\x00]*\x00/, '');
                            }
                            try {
                                const jsonMatch = text.match(/{[\s\S]*}/);
                                if (jsonMatch) return JSON.parse(jsonMatch[0]);
                            } catch(e) {}
                        }
                    }
                }
                offset = dataStart + length + 4;
            }
            return null;
        }

        function extractTokens(promptStr) {
            if (!promptStr) return [];
            let cleaned = promptStr.replace(/{{tar}}/g, '');
            // 简单处理权重及括号
            cleaned = cleaned.replace(/(-?\d+(?:\.\d+)?)\s*::\s*([\s\S]*?)\s*::/g, '$2,');
            const parts = cleaned.split(',');
            const tokens = new Set();
            parts.forEach(p => {
                let t = p.trim().replace(/[()\[\]<>]/g, '').replace(/:\s*-?\d+(?:\.\d+)?\s*$/, '').trim();
                if (t && t.length > 0 && t.length < 200) tokens.add(t);
            });
            return Array.from(tokens);
        }

        // === 存储/数据 获取 (翻译/标签) ===
        function getTranslations() {
            try { return JSON.parse(localStorage.getItem(transStoreKey)) || {}; } catch(e) { return {}; }
        }
        function saveTranslations(data) {
            localStorage.setItem(transStoreKey, JSON.stringify(data));
        }
        function getLabels() {
            try { return JSON.parse(localStorage.getItem(tagStoreKey)) || {}; } catch(e) { return {}; }
        }
        function saveLabels(data) {
            localStorage.setItem(tagStoreKey, JSON.stringify(data));
        }

        // 格式化输出带有翻译的词条 (核心功能)
        function formatToken(tokenText) {
            if (!showTranslation) return tokenText;
            const trans = getTranslations();
            if (trans[tokenText]) {
                return `${tokenText}<span class="trans-text">(${trans[tokenText]})</span>`;
            }
            return tokenText;
        }

        // === 文件处理 ===
        document.getElementById('uploadBtn').onclick = () => document.getElementById('fileInput').click();
        document.getElementById('uploadHintBtn').onclick = () => document.getElementById('fileInput').click();
        document.getElementById('fileInput').onchange = async (e) => {
            const files = Array.from(e.target.files).filter(f => f.type === 'image/png');
            let success = 0, fail = 0;
            for (let file of files) {
                try {
                    const buf = await file.arrayBuffer();
                    const meta = parsePNGMetadata(buf);
                    if (!meta || !meta.prompt) { fail++; continue; }
                    const url = URL.createObjectURL(file); // 简单缩略图
                    const img = {
                        id: 'img_' + Date.now() + Math.random().toString(36).substr(2,5),
                        name: file.name,
                        fileBlob: file,
                        thumbnailDataURL: url,
                        prompt: meta.prompt,
                        negativePrompt: meta.uc || '',
                        promptTokens: extractTokens(meta.prompt),
                        negativeTokens: extractTokens(meta.uc || ''),
                        timestamp: Date.now()
                    };
                    await dbAddImage(img);
                    success++;
                } catch(err) { fail++; }
            }
            showToast(`上传完成: 成功 ${success} 张，失败 ${fail} 张`, success > 0 ? 'success' : 'error');
            await loadAllImages();
        };

        async function loadAllImages() {
            allImages = await dbGetAllImages();
            allImages.sort((a,b) => b.timestamp - a.timestamp);
            document.getElementById('totalSizeValue').textContent = allImages.length + ' 张';
            updateStats();
            applyFilters();
        }

        function updateStats() {
            tokenStats = { positive: {}, negative: {} };
            allImages.forEach(img => {
                img.promptTokens.forEach(t => tokenStats.positive[t] = (tokenStats.positive[t]||0)+1);
                img.negativeTokens.forEach(t => tokenStats.negative[t] = (tokenStats.negative[t]||0)+1);
            });
        }

        // === UI 渲染及筛选 ===
        function applyFilters() {
            if (activeFilters.length === 0) filteredImages = [...allImages];
            else {
                filteredImages = allImages.filter(img => {
                    return activeFilters.every(f => (f.type==='positive' ? img.promptTokens : img.negativeTokens).includes(f.token));
                });
            }
            renderGallery();
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            const empty = document.getElementById('galleryEmpty');
            if (filteredImages.length === 0) { grid.style.display = 'none'; empty.style.display = 'flex'; return; }
            grid.style.display = 'grid'; empty.style.display = 'none';
            grid.innerHTML = '';

            filteredImages.forEach(img => {
                const card = document.createElement('div');
                card.className = `image-card ${selectedIds.has(img.id)?'selected':''}`;
                card.innerHTML = `
                    <div class="thumb-wrapper">
                        <img src="${img.thumbnailDataURL}">
                        <input type="checkbox" class="select-checkbox ${selectionMode?'show':''}" ${selectedIds.has(img.id)?'checked':''}>
                    </div>
                    <div class="card-info">
                        <div class="card-name">${img.name}</div>
                        <div class="card-prompt-preview">${img.prompt}</div>
                    </div>
                    <div class="card-actions">
                        <button class="card-action-btn copy-pos"><i class="fa-solid fa-copy"></i> 正向</button>
                        <button class="card-action-btn del-btn"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;

                card.querySelector('.copy-pos').onclick = (e) => { e.stopPropagation(); copyText(img.prompt); };
                card.querySelector('.del-btn').onclick = (e) => { e.stopPropagation(); deleteImg(img.id); };
                card.querySelector('.thumb-wrapper').onclick = () => { if(!selectionMode) openDetail(img); };
                const cb = card.querySelector('input');
                cb.onclick = (e) => e.stopPropagation();
                cb.onchange = (e) => {
                    if(e.target.checked) selectedIds.add(img.id); else selectedIds.delete(img.id);
                    card.classList.toggle('selected', e.target.checked);
                };
                if(selectionMode) card.onclick = () => { cb.checked = !cb.checked; cb.dispatchEvent(new Event('change')); };

                grid.appendChild(card);
            });
        }

        async function deleteImg(id) {
            if(confirm('删除此图？')) {
                await dbDeleteImage(id);
                selectedIds.delete(id);
                await loadAllImages();
                if(document.getElementById('tokenSidebar').classList.contains('active')) renderSidebarTokens();
            }
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt).then(()=>showToast('已复制', 'success')).catch(()=>showToast('复制失败','error'));
        }

        function showToast(msg, type='info') {
            const container = document.getElementById('toastContainer');
            const div = document.createElement('div');
            div.className = `toast ${type}`;
            div.textContent = msg;
            container.appendChild(div);
            setTimeout(() => div.remove(), 2600);
        }

        // === 图片详情 Modal ===
        function openDetail(img) {
            document.getElementById('modalTitle').textContent = img.name;
            // 注意详情中的词条列表渲染需要调用 formatToken 支持翻译展示
            const posHtml = img.promptTokens.map(t => `<span style="font-size:11px;background:#eef1ff;color:var(--primary);padding:3px 8px;border-radius:12px;margin:2px;">${formatToken(t)}</span>`).join('');
            const negHtml = img.negativeTokens.map(t => `<span style="font-size:11px;background:#fdf0ef;color:var(--danger);padding:3px 8px;border-radius:12px;margin:2px;">${formatToken(t)}</span>`).join('');

            document.getElementById('modalBody').innerHTML = `
                <div style="text-align:center;"><img src="${img.thumbnailDataURL}" style="max-height:200px;object-fit:contain;"></div>
                <div style="display:flex;gap:10px;"><button class="copy-btn primary" onclick="copyText('${img.prompt.replace(/'/g,"\\'").replace(/\n/g,' ')}')">复制原提示词(英文)</button></div>
                <div class="prompt-text positive">${img.prompt}</div>
                <div><h4 style="font-size:13px;margin-bottom:6px;">正向词条解析：</h4><div>${posHtml}</div></div>
                <div><h4 style="font-size:13px;margin-bottom:6px;">负向词条解析：</h4><div>${negHtml}</div></div>
            `;
            document.getElementById('detailModal').classList.add('active');
        }

        // === 词条侧边栏 (翻译显示与单条编辑) ===
        document.getElementById('tokenLibraryBtn').onclick = () => {
            document.getElementById('tokenSidebar').classList.add('active');
            renderSidebarTokens();
        };
        document.getElementById('tokenSidebarClose').onclick = () => document.getElementById('tokenSidebar').classList.remove('active');

        document.getElementById('tabPositive').onclick = () => switchTab('positive');
        document.getElementById('tabNegative').onclick = () => switchTab('negative');
        function switchTab(type) {
            currentTokenTab = type;
            document.getElementById('tabPositive').classList.toggle('active', type==='positive');
            document.getElementById('tabNegative').classList.toggle('active', type==='negative');
            renderSidebarTokens();
        }

        document.getElementById('tokenSearchInput').oninput = renderSidebarTokens;

        function renderSidebarTokens() {
            const list = document.getElementById('tokenList');
            const stats = tokenStats[currentTokenTab];
            const search = document.getElementById('tokenSearchInput').value.trim().toLowerCase();
            const transData = getTranslations();
            const labelsData = getLabels();

            let entries = Object.entries(stats).sort((a,b) => b[1]-a[1]);

            if (search) {
                entries = entries.filter(([t]) => {
                    const transStr = transData[t] || '';
                    const labelStr = (labelsData[t] || []).join('');
                    return t.toLowerCase().includes(search) || transStr.includes(search) || labelStr.includes(search);
                });
            }

            list.innerHTML = '';
            entries.forEach(([t, c]) => {
                const div = document.createElement('div');
                div.className = 'token-item';

                // 渲染标签
                const tags = (labelsData[t]||[]).map(l => `<span class="tag-badge" style="background:#eef1ff;color:#4a6cf7;border:1px solid #d5dcff;">${l}</span>`).join('');

                div.innerHTML = `
                    <div style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
                        <div class="token-name">${formatToken(t)}</div>
                        ${tags ? `<div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;">${tags}</div>` : ''}
                    </div>
                    <span class="token-count">${c} 次</span>
                    <button class="token-action-btn edit-trans-btn" title="编辑翻译"><i class="fa-solid fa-language"></i></button>
                    <button class="token-action-btn filter-btn" title="筛选此词条"><i class="fa-solid fa-filter"></i></button>
                `;

                div.querySelector('.filter-btn').onclick = () => {
                    activeFilters = [{ token: t, type: currentTokenTab }];
                    document.getElementById('tokenSidebar').classList.remove('active');
                    applyFilters();
                    document.getElementById('clearFilterBtn').style.display = 'flex';
                    document.getElementById('filterTags').innerHTML = `<span class="filter-tag">${t} <i class="fa-solid fa-times" onclick="activeFilters=[]; applyFilters(); document.getElementById('clearFilterBtn').style.display='none'; document.getElementById('filterTags').innerHTML='';"></i></span>`;
                };

                // 单个编辑翻译
                div.querySelector('.edit-trans-btn').onclick = () => {
                    const currentTrans = transData[t] || '';
                    const newTrans = prompt(`请为词条编辑中文翻译:\n\n英文: ${t}`, currentTrans);
                    if (newTrans !== null) {
                        const d = getTranslations();
                        if (newTrans.trim() === '') delete d[t]; else d[t] = newTrans.trim();
                        saveTranslations(d);
                        renderSidebarTokens();
                        if(document.getElementById('detailModal').classList.contains('active')) {
                            // 刷新背后画廊和弹窗
                            applyFilters();
                        }
                    }
                };

                list.appendChild(div);
            });
        }

        // 显示/隐藏 翻译按钮功能
        const toggleTransBtn = document.getElementById('toggleTransBtn');
        function updateTransToggleButton() {
            toggleTransBtn.innerHTML = showTranslation ? '<i class="fa-solid fa-language"></i> 显示翻译: 开' : '<i class="fa-solid fa-language"></i> 显示翻译: 关';
            toggleTransBtn.style.background = showTranslation ? '#eef7f0' : '';
            toggleTransBtn.style.color = showTranslation ? '#27ae60' : '';
        }
        toggleTransBtn.onclick = () => {
            showTranslation = !showTranslation;
            localStorage.setItem('naiTagManager_showTrans', showTranslation);
            updateTransToggleButton();
            renderSidebarTokens();
            applyFilters(); // 刷新详情里的翻译显示（如果有缩略图里用到）
            showToast(showTranslation ? '翻译显示已开启' : '翻译显示已关闭', 'success');
        };

        // === AI 导出 (分类模板 / 翻译模板) ===
        const aiExportModal = document.getElementById('aiExportModal');
        document.getElementById('aiExportBtn').onclick = () => {
            aiExportModal.classList.add('active');
            document.getElementById('aiExportText').value = '';
        };

        document.getElementById('generateExportBtn').onclick = () => {
            const target = document.getElementById('exportTarget').value;
            const polarity = document.getElementById('exportPolarity').value;

            const stats = tokenStats[polarity];
            const tokens = Object.keys(stats);
            if (tokens.length === 0) {
                showToast(`当前没有可导出的 ${polarity==='positive'?'正向':'负向'} 词条`, 'error');
                return;
            }

            const tokenString = tokens.join(', ');
            let promptText = '';

            if (target === 'tag') {
                promptText = `请将以下逗号分隔的英文绘画提示词进行分类。
分类建议包含：画师、质量词、画风、环境背景、人物主体、服饰、面部表情、动作、光影材质 等。
请严格以 JSON 格式返回，键为英文词条，值为该词条的分类标签数组，例如：
{
  "1girl": ["人物主体"],
  "masterpiece": ["质量词"],
  "running": ["动作"]
}
务必注意：请仅返回 JSON 文本，不要有任何多余的废话和 markdown 标记！

需要分类的词条列表如下：
${tokenString}`;
            } else if (target === 'trans') {
                promptText = `请将以下逗号分隔的英文绘画提示词翻译为对应的中文。
如果遇到 AI 绘图领域的专有名词或画师名，请给出最符合语境的翻译或保留。
请严格以 JSON 格式返回，键为英文原词条，值为中文翻译，例如：
{
  "1girl": "1个女孩",
  "masterpiece": "杰作",
  "running": "奔跑"
}
务必注意：请仅返回 JSON 文本，不要有任何多余的废话和 markdown 标记！

需要翻译的词条列表如下：
${tokenString}`;
            }

            document.getElementById('aiExportText').value = promptText;
            showToast('已生成供 AI 使用的 Prompt', 'success');
        };

        document.getElementById('copyAiExportBtn').onclick = () => {
            const txt = document.getElementById('aiExportText').value;
            if (!txt) { showToast('文本为空，请先生成！', 'error'); return; }
            copyText(txt);
        };

        // === AI 导入 (JSON解析应用) ===
        const aiImportModal = document.getElementById('aiImportModal');
        document.getElementById('aiImportBtn').onclick = () => {
            aiImportModal.classList.add('active');
            document.getElementById('aiImportText').value = '';
        };

        // 一键清空翻译
        document.getElementById('clearAllTransBtn').onclick = () => {
            if (confirm('确定要清空所有已保存的词条翻译数据吗？不可恢复！')) {
                localStorage.removeItem(transStoreKey);
                showToast('已清空所有翻译', 'success');
                renderSidebarTokens();
                applyFilters();
            }
        };

        document.getElementById('applyAiImportBtn').onclick = () => {
            const target = document.getElementById('importTarget').value;
            const text = document.getElementById('aiImportText').value.trim();

            if (!text) { showToast('请输入 JSON 内容', 'error'); return; }

            let parsedData;
            try {
                // 有时候 AI 可能会外包一层 ```json ... ```，尝试清理
                let cleanText = text.replace(/^```(json)?|```$/g, '').trim();
                parsedData = JSON.parse(cleanText);
            } catch (err) {
                showToast('解析 JSON 失败，请检查 AI 返回的格式是否正确！', 'error');
                return;
            }

            if (typeof parsedData !== 'object' || Array.isArray(parsedData)) {
                showToast('导入数据格式有误，必须为键值对 JSON 对象。', 'error');
                return;
            }

            let successCount = 0;

            if (target === 'tag') {
                const labelsMap = getLabels();
                const customLabels = JSON.parse(localStorage.getItem(customTagStoreKey)) || [];

                for (const [token, tags] of Object.entries(parsedData)) {
                    if (Array.isArray(tags)) {
                        if (!labelsMap[token]) labelsMap[token] = [];
                        tags.forEach(t => {
                            if (!labelsMap[token].includes(t)) labelsMap[token].push(t);
                            if (!customLabels.includes(t)) customLabels.push(t);
                        });
                        successCount++;
                    }
                }
                saveLabels(labelsMap);
                localStorage.setItem(customTagStoreKey, JSON.stringify(customLabels));
                showToast(`成功解析并添加了 ${successCount} 个词条的标签`, 'success');

            } else if (target === 'trans') {
                const transMap = getTranslations();
                for (const [token, translation] of Object.entries(parsedData)) {
                    if (typeof translation === 'string' && translation.trim() !== '') {
                        transMap[token] = translation.trim();
                        successCount++;
                    }
                }
                saveTranslations(transMap);
                showToast(`成功导入并更新了 ${successCount} 个词条的中文翻译`, 'success');
            }

            aiImportModal.classList.remove('active');
            renderSidebarTokens();
            applyFilters(); // 刷新详情弹窗内的显示
        };

        // 多选模式
        document.getElementById('downloadModeBtn').onclick = () => {
            selectionMode = !selectionMode;
            document.getElementById('downloadActions').classList.toggle('active', selectionMode);
            renderGallery();
        };
        document.getElementById('selectAllBtn').onclick = () => { filteredImages.forEach(i=>selectedIds.add(i.id)); renderGallery();};
        document.getElementById('deselectAllBtn').onclick = () => { selectedIds.clear(); renderGallery();};

    </script>
</body>
</html>
