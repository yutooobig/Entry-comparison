        function renderBlockedGroups() {
            const container = document.getElementById('tokenList');
            container.innerHTML = '';
            const blockedKeys = Object.keys(tokens).filter(k => tokens[k].blocked.size > 0);
            if (blockedKeys.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:30px 10px;font-size:13px;">没有被屏蔽的词条</div>';
                return;
            }

            const groups = {
                'manual': { title: '手动屏蔽', icon: 'fa-hand', keys: [] },
                'auto': { title: '自动屏蔽', icon: 'fa-robot', keys: [] },
                'tag': { title: '标签屏蔽', icon: 'fa-tags', keys: [] }
            };

            blockedKeys.forEach(key => {
                const t = tokens[key];
                if (t.blocked.has('manual')) groups['manual'].keys.push(key);
                if (t.blocked.has('auto')) groups['auto'].keys.push(key);
                const tagBlocks = Array.from(t.blocked).filter(b => b.startsWith('tag:'));
                if (tagBlocks.length > 0) groups['tag'].keys.push(key);
            });

            Object.values(groups).forEach(group => {
                if (group.keys.length === 0) return;
                const section = document.createElement('div');
                section.className = 'blocked-group-section';
                section.innerHTML = `
                    <div class="blocked-group-header">
                        <span class="group-title"><i class="fas ${group.icon}" style="color:var(--danger);"></i> ${group.title} (${group.keys.length}个)</span>
                        <div class="group-actions">
                            <button class="mini-btn info" data-action="copy" data-group="${group.title}"><i class="fas fa-copy"></i> 复制</button>
                            <button class="mini-btn info" data-action="compare" data-group="${group.title}"><i class="fas fa-code-compare"></i> 对比</button>
                            <button class="mini-btn success" data-action="batch-unblock" data-group="${group.title}"><i class="fas fa-check"></i> 批量取消</button>
                        </div>
                    </div>
                    <div class="blocked-group-tokens">
                        ${group.keys.map(k => {
                            const t = tokens[k];
                            return `<span class="blocked-token-chip" data-token="${k}" data-group="${group.title}">
                                ${t.token}${t.translation ? ` <span class="chip-translation">(${t.translation})</span>` : ''}
                                <i class="fas fa-times" style="font-size:9px;opacity:0.6;"></i>
                            </span>`;
                        }).join('')}
                    </div>
                `;
                container.appendChild(section);

                section.querySelectorAll('.blocked-token-chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        chip.classList.toggle('selected');
                        const key = chip.dataset.token;
                        if (chip.classList.contains('selected')) {
                            selectedTokenNames.add(key);
                        } else {
                            selectedTokenNames.delete(key);
                        }
                        updateBatchActionBar();
                    });
                });
                section.querySelectorAll('.mini-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const action = btn.dataset.action;
                        const groupTitle = btn.dataset.group;
                        const groupKeys = group.keys;
                        if (action === 'copy') {
                            const text = groupKeys.map(k => tokens[k].token).join(', ');
                            copyText(text, `「${groupTitle}」词条`);
                        } else if (action === 'compare') {
                            showBlockedGroupCompare(groupTitle, groupKeys);
                        } else if (action === 'batch-unblock') {
                            batchUnblockTokens(groupKeys);
                            selectedTokenNames.clear();
                            updateBatchActionBar();
                        }
                    });
                });
            });
            updateBatchActionBar();
        }

        function showBlockedGroupCompare(groupTitle, keys) {
            const posTokens = [];
            const negTokens = [];
            keys.forEach(k => {
                const t = tokens[k];
                if (t.countPos > 0) posTokens.push({ token: t.token, count: t.countPos, translation: t.translation });
                if (t.countNeg > 0) negTokens.push({ token: t.token, count: t.countNeg, translation: t.translation });
            });
            const body = document.getElementById('diffModalBody');
            body.innerHTML = `
                <div class="diff-container">
                    <div class="diff-card">
                        <div class="diff-title"><i class="fas fa-plus-circle" style="color:var(--success);"></i> 正向出现</div>
                        <div class="diff-token-list">
                            ${posTokens.length > 0 ? posTokens.map(t => `<span class="diff-token positive">${t.token}${t.translation ? ` (${t.translation})` : ''} ×${t.count}</span>`).join('') : '<span style="font-size:12px;color:#888;">无</span>'}
                        </div>
                    </div>
                    <div class="diff-card">
                        <div class="diff-title"><i class="fas fa-minus-circle" style="color:var(--danger);"></i> 负向出现</div>
                        <div class="diff-token-list">
                            ${negTokens.length > 0 ? negTokens.map(t => `<span class="diff-token negative">${t.token}${t.translation ? ` (${t.translation})` : ''} ×${t.count}</span>`).join('') : '<span style="font-size:12px;color:#888;">无</span>'}
                        </div>
                    </div>
                </div>
                <p style="font-size:12px;color:var(--text-secondary);text-align:center;">「${groupTitle}」共${keys.length}个词条的正负向分布对比</p>
            `;
            document.getElementById('diffModalTitle').textContent = `「${groupTitle}」对比`;
            document.getElementById('diffModal').classList.add('active');
        }

        function updateBatchActionBar() {
            const bar = document.getElementById('batchActionBar');
            const count = document.getElementById('batchSelectedCount');
            if (selectedTokenNames.size > 0 && tokenFilterState.selectMode) {
                bar.classList.add('active');
                count.textContent = `已选 ${selectedTokenNames.size} 项`;
            } else {
                bar.classList.remove('active');
                selectedTokenNames.clear();
            }
        }

        // ==================== 翻译功能 ====================
        function openTranslateModal(tokenKey) {
            const t = tokens[tokenKey];
            if (!t) return;
            currentTranslateTarget = tokenKey;
            document.getElementById('translateTokenName').textContent = t.token;
            document.getElementById('translateInput').value = t.translation || '';
            document.getElementById('translateModal').classList.add('active');
        }

        function closeTranslateModal() {
            document.getElementById('translateModal').classList.remove('active');
            currentTranslateTarget = null;
        }

        function saveTranslation() {
            if (!currentTranslateTarget) return;
            const key = currentTranslateTarget;
            const input = document.getElementById('translateInput');
            const translation = input.value.trim();
            if (tokens[key]) {
                tokens[key].translation = translation;
                showToast('翻译已保存', 'success');
                renderTokenList();
                renderBlockedGroups();
            }
            closeTranslateModal();
        }

        // ==================== 标签选择器 ====================
        function openTagSelector(tokenKey) {
            currentTagSelectorTarget = tokenKey;
            const list = document.getElementById('tagSelectorList');
            const t = tokens[tokenKey];
            list.innerHTML = '';
            tags.forEach(tag => {
                const item = document.createElement('span');
                item.className = 'tag-selector-item' + (t.tags.has(tag.name) ? ' selected' : '');
                item.innerHTML = `<span class="tag-dot" style="background:${tag.color};"></span> ${tag.name}`;
                item.dataset.tag = tag.name;
                item.addEventListener('click', () => {
                    item.classList.toggle('selected');
                });
                list.appendChild(item);
            });
            if (tags.length === 0) {
                list.innerHTML = '<span style="font-size:12px;color:#888;">暂无标签，请先在标签管理中添加</span>';
            }
            document.getElementById('tagSelectorModal').classList.add('active');
        }

        function closeTagSelector() {
            document.getElementById('tagSelectorModal').classList.remove('active');
            currentTagSelectorTarget = null;
        }

        function confirmTagSelection() {
            if (!currentTagSelectorTarget) return;
            const key = currentTagSelectorTarget;
            const t = tokens[key];
            if (!t) return;
            const selected = document.querySelectorAll('#tagSelectorList .tag-selector-item.selected');
            const selectedTags = Array.from(selected).map(el => el.dataset.tag);
            // 清除现有标签
            t.tags.clear();
            selectedTags.forEach(tagName => {
                t.tags.add(tagName);
            });
            renderTokenList();
            renderTagFilterBar();
            closeTagSelector();
            showToast('标签已更新', 'success');
        }

        // ==================== 标签管理 ====================
        function openTagManage() {
            renderTagManageList();
            document.getElementById('tagManageModal').classList.add('active');
        }

        function closeTagManage() {
            document.getElementById('tagManageModal').classList.remove('active');
        }

        function renderTagManageList() {
            const list = document.getElementById('tagManageList');
            list.innerHTML = '';
            tags.forEach(tag => {
                const count = Object.keys(tokens).filter(k => tokens[k].tags.has(tag.name)).length;
                const item = document.createElement('div');
                item.className = 'tag-manage-item';
                item.innerHTML = `
                    <span class="tag-manage-name">
                        <span class="tag-dot" style="width:10px;height:10px;border-radius:50%;background:${tag.color};display:inline-block;"></span>
                        ${tag.name}
                        <span class="tag-manage-count">${count}个词条</span>
                    </span>
                    <div style="display:flex;gap:4px;">
                        <button class="tag-manage-block" data-tag="${tag.name}" title="${tag.blocked ? '取消标签屏蔽' : '屏蔽此标签'}">
                            <i class="fas ${tag.blocked ? 'fa-eye' : 'fa-eye-slash'}" style="color:${tag.blocked ? 'var(--warning)' : 'inherit'};"></i>
                        </button>
                        <button class="tag-manage-delete" data-tag="${tag.name}" title="删除标签">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                list.appendChild(item);
                item.querySelector('.tag-manage-block').addEventListener('click', () => toggleTagBlocked(tag.name));
                item.querySelector('.tag-manage-delete').addEventListener('click', () => {
                    if (confirm(`确认删除标签「${tag.name}」？`)) deleteTag(tag.name);
                });
            });
            if (tags.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:#888;padding:20px;font-size:13px;">暂无标签</div>';
            }
        }

        function addNewTag() {
            const input = document.getElementById('newTagNameInput');
            const name = input.value.trim();
            if (!name) { showToast('请输入标签名', 'error'); return; }
            if (tags.find(t => t.name === name)) { showToast('标签已存在', 'error'); return; }
            tags.push({ name, color: getTagColor(tags.length), blocked: false });
            input.value = '';
            renderTagManageList();
            renderTagFilterBar();
            showToast(`标签「${name}」已创建`, 'success');
        }

        // ==================== 自动屏蔽 ====================
        function openAutoBlockSettings() {
            document.getElementById('autoBlockEnabled').checked = autoBlockSettings.enabled;
            document.getElementById('autoBlockThreshold').value = autoBlockSettings.threshold;
            document.getElementById('autoBlockModal').classList.add('active');
        }

        function closeAutoBlockSettings() {
            document.getElementById('autoBlockModal').classList.remove('active');
            autoBlockSettings.enabled = document.getElementById('autoBlockEnabled').checked;
            autoBlockSettings.threshold = parseInt(document.getElementById('autoBlockThreshold').value) || 15;
            rebuildTokens();
            renderTokenList();
            renderBlockedGroups();
            showToast('自动屏蔽设置已更新', 'success');
        }

        // ==================== 导出功能 ====================
        function openExportTokenModal() {
            const posCount = Object.keys(tokens).filter(k => tokens[k].countPos > 0 && tokens[k].blocked.size === 0)
                .length;
            const negCount = Object.keys(tokens).filter(k => tokens[k].countNeg > 0 && tokens[k].blocked.size === 0)
                .length;
            document.getElementById('exportPosCount').textContent = posCount + ' 个';
            document.getElementById('exportNegCount').textContent = negCount + ' 个';
            currentExportType = 'positive';
            document.getElementById('exportTypePos').checked = true;
            document.getElementById('exportTypeNeg').checked = false;
            document.getElementById('exportTokenModal').classList.add('active');
        }

        function closeExportTokenModal() {
            document.getElementById('exportTokenModal').classList.remove('active');
        }

        function selectExportType(type) {
            currentExportType = type;
            document.getElementById('exportTypePos').checked = type === 'positive';
            document.getElementById('exportTypeNeg').checked = type === 'negative';
        }

        function confirmExportTokens() {
            const keys = Object.keys(tokens).filter(k => {
                const t = tokens[k];
                if (t.blocked.size > 0) return false;
                if (currentExportType === 'positive' && t.countPos > 0) return true;
                if (currentExportType === 'negative' && t.countNeg > 0) return true;
                return false;
            });
            if (keys.length === 0) {
                showToast('没有可导出的词条', 'error');
                return;
            }
            const sorted = keys.sort((a, b) => {
                if (currentExportType === 'positive') return tokens[b].countPos - tokens[a].countPos;
                return tokens[b].countNeg - tokens[a].countNeg;
            });
            const lines = sorted.map((k, idx) => {
                const t = tokens[k];
                const count = currentExportType === 'positive' ? t.countPos : t.countNeg;
                const weight = t.weight.toFixed(2);
                const translation = t.translation ? ` (${t.translation})` : '';
                const tagStr = t.tags.size > 0 ? ` [标签: ${Array.from(t.tags).join(', ')}]` : '';
                return `${idx + 1}. ${t.token}${translation} - 出现${count}次 - 权重${weight}${tagStr}`;
            });
            const typeLabel = currentExportType === 'positive' ? '正向' : '负向';
            const text = `=== NAI ${typeLabel}词条导出 (共${lines.length}个) ===\n${lines.join('\n')}`;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `nai_${typeLabel}_tokens_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            closeExportTokenModal();
            showToast(`已导出${lines.length}个${typeLabel}词条`, 'success');
        }

        // ==================== 差异对比 ====================
        function closeDiffModal() {
            document.getElementById('diffModal').classList.remove('active');
        }

        // ==================== 相似度分析 ====================
        function closeSimilarity() {
            document.getElementById('similarityOverlay').classList.remove('active');
        }

        // ==================== 事件绑定 ====================
        document.addEventListener('DOMContentLoaded', () => {
            // 文件上传
            document.getElementById('btnUpload').addEventListener('click', () => document.getElementById('fileInput')
                .click());
            document.getElementById('fileInput').addEventListener('change', (e) => {
                if (e.target.files.length > 0) handleFileUpload(e.target.files);
                e.target.value = '';
            });

            // 词条侧边栏
            document.getElementById('btnTokenSidebar').addEventListener('click', () => toggleTokenSidebar());

            // 导出词条
            document.getElementById('btnExportTokens').addEventListener('click', openExportTokenModal);
            document.getElementById('btnExportTokenList').addEventListener('click', openExportTokenModal);

            // 清空全部
            document.getElementById('btnClearAll').addEventListener('click', () => {
                if (!confirm('确认清空所有图片数据？此操作不可撤销！')) return;
                if (!confirm('再次确认：真的要清空全部数据吗？')) return;
                images = [];
                tokens = {};
                tags = [];
                blockedTokens = {};
                selectedImageIds.clear();
                selectedTokenNames.clear();
                rebuildTokens();
                renderGallery();
                renderTokenList();
                renderBlockedGroups();
                renderTagFilterBar();
                updateTotalSize();
                showToast('已清空全部数据', 'info');
            });

            // Token标签页切换
            document.getElementById('tokenTabs').addEventListener('click', (e) => {
                const tabBtn = e.target.closest('.token-tab');
                if (!tabBtn) return;
                document.querySelectorAll('.token-tab').forEach(t => t.classList.remove('active'));
                tabBtn.classList.add('active');
                tokenFilterState.tab = tabBtn.dataset.tab;
                tokenFilterState.selectMode = false;
                selectedTokenNames.clear();
                document.getElementById('btnToggleSelect').classList.remove('active');
                document.getElementById('btnToggleSelect').innerHTML =
                    '<i class="fas fa-check-square"></i> 多选';
                renderTokenList();
                renderBlockedGroups();
            });

            // 搜索
            document.getElementById('tokenSearchInput').addEventListener('input', (e) => {
                tokenFilterState.search = e.target.value.trim();
                renderTokenList();
            });

            // 权重筛选
            document.getElementById('weightFilterBar').addEventListener('click', (e) => {
                const capsule = e.target.closest('.weight-capsule');
                if (!capsule) return;
                document.querySelectorAll('.weight-capsule').forEach(c => c.classList.remove('active'));
                capsule.classList.add('active');
                tokenFilterState.weightFilter = capsule.dataset.weightFilter;
                renderTokenList();
            });

            // 多选切换
            document.getElementById('btnToggleSelect').addEventListener('click', () => {
                tokenFilterState.selectMode = !tokenFilterState.selectMode;
                selectedTokenNames.clear();
                const btn = document.getElementById('btnToggleSelect');
                if (tokenFilterState.selectMode) {
                    btn.classList.add('active');
                    btn.innerHTML = '<i class="fas fa-times-square"></i> 退出多选';
                } else {
                    btn.classList.remove('active');
                    btn.innerHTML = '<i class="fas fa-check-square"></i> 多选';
                }
                renderTokenList();
                updateBatchActionBar();
            });

            // 标签管理
            document.getElementById('btnTagManage').addEventListener('click', openTagManage);

            // 自动屏蔽设置
            document.getElementById('btnAutoBlockSettings').addEventListener('click', openAutoBlockSettings);

            // 批量操作
            document.getElementById('btnBatchBlock').addEventListener('click', () => {
                if (selectedTokenNames.size === 0) return;
                batchBlockTokens(Array.from(selectedTokenNames));
                selectedTokenNames.clear();
                renderTokenList();
                updateBatchActionBar();
            });
            document.getElementById('btnBatchUnblock').addEventListener('click', () => {
                if (selectedTokenNames.size === 0) return;
                batchUnblockTokens(Array.from(selectedTokenNames));
                selectedTokenNames.clear();
                renderTokenList();
                updateBatchActionBar();
            });
            document.getElementById('btnBatchTag').addEventListener('click', () => {
                if (selectedTokenNames.size === 0) return;
                openBatchTagSelector();
            });

            // 清除筛选
            document.getElementById('clearFilterBtn').addEventListener('click', () => {
                tokenFilterState.search = '';
                tokenFilterState.tagFilter = null;
                tokenFilterState.weightFilter = 'all';
                document.getElementById('tokenSearchInput').value = '';
                document.querySelectorAll('.weight-capsule').forEach(c => c.classList.remove('active'));
                document.querySelector('.weight-capsule[data-weight-filter="all"]')?.classList.add('active');
                renderTokenList();
                renderTagFilterBar();
            });

            // 批量删除图片
            document.getElementById('btnBatchDelete').addEventListener('click', () => {
                if (selectedImageIds.size === 0) return;
                if (!confirm(`确认删除选中的 ${selectedImageIds.size} 张图片？`)) return;
                images = images.filter(img => !selectedImageIds.has(img.id));
                selectedImageIds.clear();
                rebuildTokens();
                renderGallery();
                renderTokenList();
                renderBlockedGroups();
                updateTotalSize();
                showToast('已批量删除', 'info');
            });

            // 批量复制正向
            document.getElementById('btnBatchCopyPos').addEventListener('click', () => {
                if (selectedImageIds.size === 0) return;
                const prompts = images.filter(img => selectedImageIds.has(img.id)).map(img => img.prompt).join(
                    '\n---\n');
                copyText(prompts, `${selectedImageIds.size}张图片的正向提示词`);
            });

            // 批量复制负向
            document.getElementById('btnBatchCopyNeg').addEventListener('click', () => {
                if (selectedImageIds.size === 0) return;
                const prompts = images.filter(img => selectedImageIds.has(img.id)).map(img => img
                    .negativePrompt || '(空)').join('\n---\n');
                copyText(prompts, `${selectedImageIds.size}张图片的负向提示词`);
            });

            // 批量下载
            document.getElementById('btnBatchDownload').addEventListener('click', () => {
                if (selectedImageIds.size === 0) return;
                images.filter(img => selectedImageIds.has(img.id)).forEach(img => {
                    const a = document.createElement('a');
                    a.href = img.dataUrl;
                    a.download = img.fileName;
                    a.click();
                });
                showToast(`开始下载 ${selectedImageIds.size} 张图片`, 'success');
            });

            // 关闭弹窗
            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        overlay.classList.remove('active');
                    }
                });
            });

            // 初始渲染
            renderGallery();
            renderTokenList();
            renderBlockedGroups();
            renderTagFilterBar();
            updateTotalSize();
        });

        // 批量标签选择
        function openBatchTagSelector() {
            const list = document.getElementById('tagSelectorList');
            list.innerHTML = '';
            tags.forEach(tag => {
                const item = document.createElement('span');
                item.className = 'tag-selector-item';
                item.innerHTML = `<span class="tag-dot" style="background:${tag.color};"></span> ${tag.name}`;
                item.dataset.tag = tag.name;
                item.addEventListener('click', () => item.classList.toggle('selected'));
                list.appendChild(item);
            });
            if (tags.length === 0) {
                list.innerHTML = '<span style="font-size:12px;color:#888;">暂无标签，请先创建标签</span>';
            }
            currentTagSelectorTarget = null;
            document.getElementById('tagSelectorModal').classList.add('active');
            // 覆盖确认函数
            window.confirmTagSelection = function() {
                const selected = Array.from(document.querySelectorAll('#tagSelectorList .tag-selector-item.selected'))
                    .map(el => el.dataset.tag);
                if (selected.length === 0) { closeTagSelector(); return; }
                Array.from(selectedTokenNames).forEach(key => {
                    const t = tokens[key];
                    if (t) {
                        selected.forEach(tagName => {
                            t.tags.add(tagName);
                            if (!tags.find(tg => tg.name === tagName)) {
                                tags.push({ name: tagName, color: getTagColor(tags.length),
                                blocked: false });
                            }
                        });
                    }
                });
                renderTokenList();
                renderTagFilterBar();
                closeTagSelector();
                selectedTokenNames.clear();
                updateBatchActionBar();
                showToast(`已为词条添加标签: ${selected.join(', ')}`, 'success');
            };
            document.getElementById('tagSelectorModal').querySelector('.copy-btn:last-child').onclick = function() {
                window.confirmTagSelection();
            };
        }

        // 导出全局函数
        window.openTranslateModal = openTranslateModal;
        window.closeTranslateModal = closeTranslateModal;
        window.saveTranslation = saveTranslation;
        window.openTagSelector = openTagSelector;
        window.closeTagSelector = closeTagSelector;
        window.confirmTagSelection = confirmTagSelection;
        window.openTagManage = openTagManage;
        window.closeTagManage = closeTagManage;
        window.addNewTag = addNewTag;
        window.openAutoBlockSettings = openAutoBlockSettings;
        window.closeAutoBlockSettings = closeAutoBlockSettings;
        window.openExportTokenModal = openExportTokenModal;
        window.closeExportTokenModal = closeExportTokenModal;
        window.selectExportType = selectExportType;
        window.confirmExportTokens = confirmExportTokens;
        window.toggleTokenSidebar = toggleTokenSidebar;
        window.closeDetailModal = closeDetailModal;
        window.closeDiffModal = closeDiffModal;
        window.closeSimilarity = closeSimilarity;
        window.openDetailModal = openDetailModal;
        window.copyText = copyText;
        window.deleteImage = deleteImage;
    </script>
</body>
</html>
