            function generateThumbnailFromBlob(blob, maxSize = 300) {
                return new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(blob);
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width;
                        let h = img.height;
                        if (w > maxSize || h > maxSize) {
                            const ratio = Math.min(maxSize/w, maxSize/h);
                            w = Math.round(w*ratio);
                            h = Math.round(h*ratio);
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        URL.revokeObjectURL(url);
                        resolve(canvas.toDataURL('image/webp', 0.8));
                    };
                    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('缩略图生成失败')); };
                    img.src = url;
                });
            }

            async function handleFiles(files) {
                const allFiles = Array.from(files);
                if (allFiles.length === 0) return;
                const pngFiles = allFiles.filter(f => f.type === 'image/png' || f.name.toLowerCase().endsWith('.png'));
                const otherImages = allFiles.filter(f => !(f.type === 'image/png' || f.name.toLowerCase().endsWith('.png')) && f.type.startsWith('image/'));
                if (pngFiles.length === 0 && otherImages.length === 0) { showToast('请选择图片文件', 'error'); return; }
                let successCount = 0;
                let failCount = 0;
                const processFiles = [...pngFiles, ...otherImages];
                for (const file of processFiles) {
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const metadata = parsePNGMetadata(arrayBuffer);
                        if (!metadata || !metadata.prompt) {
                            failCount++;
                            showToast(`"${file.name}" 未找到有效元数据`, 'error');
                            continue;
                        }
                        const thumbnailDataURL = await generateThumbnailFromBlob(file);
                        const promptData = extractTokenData(metadata.prompt);
                        const negativeData = extractTokenData(metadata.uc || '');
                        const imageData = {
                            id: generateId(),
                            name: file.name,
                            fileBlob: file,
                            thumbnailDataURL,
                            prompt: metadata.prompt || '',
                            negativePrompt: metadata.uc || '',
                            seed: metadata.seed !== undefined ? metadata.seed : null,
                            steps: metadata.steps !== undefined ? metadata.steps : null,
                            sampler: metadata.sampler || '',
                            scale: metadata.scale !== undefined ? metadata.scale : null,
                            promptTokens: promptData.tokens,
                            negativeTokens: negativeData.tokens,
                            promptWeights: promptData.weights,
                            negativeWeights: negativeData.weights,
                            timestamp: Date.now(),
                            isCompressed: false,  // 新增压缩标记
                        };
                        await dbAddImage(imageData);
                        successCount++;
                    } catch (err) {
                        failCount++;
                        console.error(err);
                        showToast(`"${file.name}" 处理失败: ${err.message}`, 'error');
                    }
                }
                if (successCount > 0) {
                    showToast(`成功导入 ${successCount} 张图片${failCount > 0 ? '，'+failCount+' 张失败' : ''}`, successCount > 0 && failCount === 0 ? 'success' : 'info');
                    await loadAllImages();
                }
            }

            function generateId() { return 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); }

            async function loadAllImages() {
                try {
                    allImages = await dbGetAllImages();
                    allImages.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                    applyFilters();
                    updateTokenStats();
                    updateTotalSizeDisplay(); // 更新总大小
                    if (tokenSidebar.classList.contains('active')) renderTokenList();
                } catch (err) { console.error(err); showToast('加载图片失败', 'error'); }
            }

            function applyFilters() {
                if (activeFilters.length === 0) {
                    filteredImages = [...allImages];
                } else {
                    filteredImages = allImages.filter(img => {
                        return activeFilters.every(filter => {
                            const { token, weight, type } = filter;
                            if (type === 'positive') {
                                if (!img.promptTokens.includes(token)) return false;
                                if (weight !== undefined) {
                                    const actualWeight = img.promptWeights && img.promptWeights[token] !== undefined ? img.promptWeights[token] : 1.0;
                                    return Math.abs(actualWeight - weight) < 0.001;
                                }
                                return true;
                            } else if (type === 'negative') {
                                if (!img.negativeTokens.includes(token)) return false;
                                if (weight !== undefined) {
                                    const actualWeight = img.negativeWeights && img.negativeWeights[token] !== undefined ? img.negativeWeights[token] : 1.0;
                                    return Math.abs(actualWeight - weight) < 0.001;
                                }
                                return true;
                            } else {
                                if (img.promptTokens.includes(token) || img.negativeTokens.includes(token)) {
                                    if (weight !== undefined) {
                                        let matched = false;
                                        if (img.promptTokens.includes(token)) {
                                            const w = img.promptWeights?.[token] ?? 1.0;
                                            if (Math.abs(w - weight) < 0.001) matched = true;
                                        }
                                        if (!matched && img.negativeTokens.includes(token)) {
                                            const w = img.negativeWeights?.[token] ?? 1.0;
                                            if (Math.abs(w - weight) < 0.001) matched = true;
                                        }
                                        return matched;
                                    }
                                    return true;
                                }
                                return false;
                            }
                        });
                    });
                }
                renderGallery();
                renderFilterTags();
            }

            function addFilter(filterObj) {
                if (!activeFilters.some(f => f.token === filterObj.token && f.weight === filterObj.weight && f.type === filterObj.type)) {
                    activeFilters.push(filterObj);
                    applyFilters();
                }
            }

            function removeFilter(filterObj) {
                activeFilters = activeFilters.filter(f => !(f.token === filterObj.token && f.weight === filterObj.weight && f.type === filterObj.type));
                applyFilters();
            }

            function clearAllFilters() {
                activeFilters = [];
                applyFilters();
            }

            function renderFilterTags() {
                filterTags.innerHTML = '';
                activeFilters.forEach(filter => {
                    const tag = document.createElement('span');
                    tag.className = 'filter-tag';
                    let label = filter.token;
                    if (filter.weight !== undefined) label += ` (权重:${filter.weight})`;
                    if (filter.type) label += ` [${filter.type === 'positive' ? '正' : '负'}]`;
                    tag.innerHTML = `${label} <i class="fa-solid fa-times"></i>`;
                    tag.querySelector('i').addEventListener('click', (e) => { e.stopPropagation(); removeFilter(filter); });
                    tag.addEventListener('click', () => removeFilter(filter));
                    filterTags.appendChild(tag);
                });
                clearFilterBtn.style.display = activeFilters.length > 0 ? 'flex' : 'none';
            }

            function renderGallery() {
                if (filteredImages.length === 0) {
                    galleryGrid.style.display = 'none';
                    galleryEmpty.style.display = 'flex';
                    galleryEmpty.querySelector('p').innerHTML = allImages.length === 0 ? '上传PNG图片以开始管理提示词' : '没有匹配筛选条件的图片';
                    return;
                }
                galleryEmpty.style.display = 'none';
                galleryGrid.style.display = 'grid';
                galleryGrid.innerHTML = '';
                filteredImages.forEach(img => {
                    const card = document.createElement('div');
                    card.className = 'image-card';
                    card.dataset.id = img.id;
                    if (selectedIds.has(img.id)) card.classList.add('selected');
                    const previewText = img.prompt ? img.prompt.substring(0, 80) : '无提示词';
                    card.innerHTML = `
                        <div class="thumb-wrapper">
                            <img src="${img.thumbnailDataURL}" alt="${img.name}" loading="lazy">
                            <input type="checkbox" class="select-checkbox ${selectionMode ? 'show' : ''}" data-id="${img.id}" ${selectedIds.has(img.id) ? 'checked' : ''}>
                        </div>
                        <div class="card-info">
                            <div class="card-name" title="${img.name}">${img.name}</div>
                            <div class="card-prompt-preview">${previewText}</div>
                        </div>
                        <div class="card-actions">
                            <button class="card-action-btn copy-pos" data-id="${img.id}"><i class="fa-solid fa-copy"></i> 正向</button>
                            <button class="card-action-btn copy-neg" data-id="${img.id}"><i class="fa-solid fa-copy"></i> 负向</button>
                            <button class="card-action-btn delete-btn" data-id="${img.id}"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    const checkbox = card.querySelector('.select-checkbox');
                    checkbox.addEventListener('change', (e) => {
                        e.stopPropagation();
                        const id = e.target.dataset.id;
                        if (e.target.checked) selectedIds.add(id); else selectedIds.delete(id);
                        card.classList.toggle('selected', e.target.checked);
                    });
                    card.querySelector('.thumb-wrapper').addEventListener('click', (e) => {
                        if (selectionMode && e.target.tagName !== 'INPUT') {
                            const cb = card.querySelector('.select-checkbox');
                            cb.checked = !cb.checked;
                            cb.dispatchEvent(new Event('change'));
                            return;
                        }
                        if (e.target.tagName !== 'INPUT') openDetail(img.id);
                    });
                    card.querySelector('.card-info').addEventListener('click', () => openDetail(img.id));
                    card.querySelector('.copy-pos').addEventListener('click', (e) => { e.stopPropagation(); copyText(img.prompt, '正向提示词'); });
                    card.querySelector('.copy-neg').addEventListener('click', (e) => { e.stopPropagation(); copyText(img.negativePrompt, '负向提示词'); });
                    card.querySelector('.delete-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteImage(img.id); });
                    galleryGrid.appendChild(card);
                });
            }

            async function copyText(text, label) {
                if (!text) { showToast(`${label}为空`, 'error'); return; }
                try { await navigator.clipboard.writeText(text); showToast(`${label}已复制`, 'success'); } catch(e) {
                    const textarea = document.createElement('textarea'); textarea.value = text; document.body.appendChild(textarea); textarea.select(); document.execCommand('copy'); document.body.removeChild(textarea); showToast(`${label}已复制`, 'success');
                }
            }

            async function deleteImage(id) {
                if (!confirm('确定删除这张图片吗？')) return;
                try {
                    await dbDeleteImage(id);
                    allImages = allImages.filter(img => img.id !== id);
                    selectedIds.delete(id);
                    applyFilters();
                    updateTokenStats();
                    updateTotalSizeDisplay();
                    if (tokenSidebar.classList.contains('active')) renderTokenList();
                } catch (err) { showToast('删除失败', 'error'); }
            }

            function openDetail(id) {
                const img = allImages.find(i => i.id === id);
                if (!img) return;
                selectedImageId = id;
                modalTitle.textContent = img.name;
                modalBody.innerHTML = `
                    <div class="modal-image-container"><img src="${img.thumbnailDataURL}" alt="${img.name}"></div>
                    <div class="modal-section"><span class="section-label"><i class="fa-solid fa-plus-circle"></i> 正向提示词</span><div class="prompt-text positive">${img.prompt || '无'}</div><button class="copy-btn positive-btn" id="copyPosBtn"><i class="fa-solid fa-copy"></i> 复制正向提示词</button></div>
                    <div class="modal-section"><span class="section-label"><i class="fa-solid fa-minus-circle"></i> 负向提示词</span><div class="prompt-text negative">${img.negativePrompt || '无'}</div><button class="copy-btn negative-btn" id="copyNegBtn"><i class="fa-solid fa-copy"></i> 复制负向提示词</button></div>
                    <div class="modal-section"><span class="section-label"><i class="fa-solid fa-gear"></i> 生成参数</span>
                        <div class="params-grid">
                            ${img.seed !== null ? `<div class="param-item"><span class="param-key">Seed</span><span class="param-value">${img.seed}</span></div>` : ''}
                            ${img.steps !== null ? `<div class="param-item"><span class="param-key">Steps</span><span class="param-value">${img.steps}</span></div>` : ''}
                            ${img.sampler ? `<div class="param-item"><span class="param-key">Sampler</span><span class="param-value">${img.sampler}</span></div>` : ''}
                            ${img.scale !== null ? `<div class="param-item"><span class="param-key">Scale</span><span class="param-value">${img.scale}</span></div>` : ''}
                        </div>
                    </div>
                    <div class="modal-section"><span class="section-label">正向词条 (${img.promptTokens.length})</span><div style="display:flex;flex-wrap:wrap;gap:6px;">${img.promptTokens.map(t => `<span style="font-size:11px;background:#eef1ff;color:var(--primary);padding:3px 8px;border-radius:12px;">${t}</span>`).join('')}</div></div>
                    <div class="modal-section"><span class="section-label">负向词条 (${img.negativeTokens.length})</span><div style="display:flex;flex-wrap:wrap;gap:6px;">${img.negativeTokens.map(t => `<span style="font-size:11px;background:#fdf0ef;color:var(--danger);padding:3px 8px;border-radius:12px;">${t}</span>`).join('')}</div></div>
                `;
                document.getElementById('copyPosBtn').addEventListener('click', () => copyText(img.prompt, '正向提示词'));
                document.getElementById('copyNegBtn').addEventListener('click', () => copyText(img.negativePrompt, '负向提示词'));
                detailModal.classList.add('active');
            }

            function closeDetail() { detailModal.classList.remove('active'); }

            function openDiffModal(imgA, imgB) {
                const commonPos = imgA.promptTokens.filter(t => imgB.promptTokens.includes(t));
                const commonNeg = imgA.negativeTokens.filter(t => imgB.negativeTokens.includes(t));
                const diffPosA = imgA.promptTokens.filter(t => !imgB.promptTokens.includes(t));
                const diffPosB = imgB.promptTokens.filter(t => !imgA.promptTokens.includes(t));
                const diffNegA = imgA.negativeTokens.filter(t => !imgB.negativeTokens.includes(t));
                const diffNegB = imgB.negativeTokens.filter(t => !imgA.negativeTokens.includes(t));
                const renderTokenList = (tokens, type) => tokens.map(t => `<span class="diff-token ${type}">${t}</span>`).join('') || '<span style="color:#aaa;">无</span>';
                diffModalBody.innerHTML = `
                    <div class="diff-container">
                        <div class="diff-card"><div class="diff-title">${imgA.name}</div><span class="section-label">正向独有</span><div class="diff-token-list">${renderTokenList(diffPosA, 'positive')}</div><span class="section-label">负向独有</span><div class="diff-token-list">${renderTokenList(diffNegA, 'negative')}</div></div>
                        <div class="diff-card"><div class="diff-title">${imgB.name}</div><span class="section-label">正向独有</span><div class="diff-token-list">${renderTokenList(diffPosB, 'positive')}</div><span class="section-label">负向独有</span><div class="diff-token-list">${renderTokenList(diffNegB, 'negative')}</div></div>
                    </div>
                    <div class="modal-section"><span class="section-label">共同正向词条</span><div class="diff-token-list">${renderTokenList(commonPos, 'positive')}</div></div>
                    <div class="modal-section"><span class="section-label">共同负向词条</span><div class="diff-token-list">${renderTokenList(commonNeg, 'negative')}</div></div>
                `;
                diffModal.classList.add('active');
            }
            function closeDiffModal() { diffModal.classList.remove('active'); }

            function openWeightDiffModal(imgA, imgB) {
                const weightsA = { ...(imgA.promptWeights || {}), ...(imgA.negativeWeights || {}) };
                const weightsB = { ...(imgB.promptWeights || {}), ...(imgB.negativeWeights || {}) };
                const allTokens = new Set([...Object.keys(weightsA), ...Object.keys(weightsB)]);
                const diffTokens = [];
                allTokens.forEach(token => {
                    const wA = weightsA[token] !== undefined ? weightsA[token] : 1.0;
                    const wB = weightsB[token] !== undefined ? weightsB[token] : 1.0;
                    if (Math.abs(wA - wB) > 0.001) diffTokens.push({ token, wA, wB });
                });
                if (diffTokens.length === 0) { showToast('没有权重差异', 'info'); return; }
                weightDiffBody.innerHTML = `<div class="weight-diff-list">${diffTokens.map(d => `<div class="weight-diff-row"><span class="diff-token-name">${d.token}</span><span class="diff-weight">${imgA.name}: <strong>${d.wA}</strong></span><span class="diff-weight">${imgB.name}: <strong>${d.wB}</strong></span></div>`).join('')}</div>`;
                weightDiffModal.classList.add('active');
            }
            function closeWeightDiffModal() { weightDiffModal.classList.remove('active'); }

            function updateTokenStats() {
                tokenStats = { positive: {}, negative: {} };
                allImages.forEach(img => {
                    img.promptTokens.forEach(token => { tokenStats.positive[token] = (tokenStats.positive[token] || 0) + 1; });
                    img.negativeTokens.forEach(token => { tokenStats.negative[token] = (tokenStats.negative[token] || 0) + 1; });
                });
            }

            function renderTokenList() {
                const searchTerm = tokenSearchInput.value.trim().toLowerCase();
                const stats = currentTokenTab === 'positive' ? tokenStats.positive : tokenStats.negative;
                const entries = Object.entries(stats).sort((a,b) => b[1] - a[1]);
                const filtered = entries.filter(([token]) => !searchTerm || token.toLowerCase().includes(searchTerm));
                if (filtered.length === 0) {
                    tokenList.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;"><i class="fa-solid fa-inbox" style="font-size:30px;opacity:0.4;display:block;margin-bottom:10px;"></i>暂无词条</div>';
                    return;
                }
                tokenList.innerHTML = '';
                filtered.forEach(([token, count]) => {
                    const item = document.createElement('div');
                    item.className = 'token-item';
                    const countClass = currentTokenTab === 'positive' ? 'pos' : 'neg';
                    item.innerHTML = `<span class="token-name" data-token="${token}">${token}</span><span class="token-count ${countClass}">${count} 次</span><button class="filter-token-btn" data-token="${token}"><i class="fa-solid fa-filter"></i></button>`;
                    item.querySelector('.token-name').addEventListener('click', () => {
                        currentTokenDetail = { token, type: currentTokenTab };
                        renderWeightBar(token, currentTokenTab);
                    });
                    item.querySelector('.filter-token-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        addFilter({ token, type: currentTokenTab });
                    });
                    tokenList.appendChild(item);
                });
            }

            function renderWeightBar(token, type) {
                if (!token) { tokenWeightBar.style.display = 'none'; return; }
                const weights = {};
                const images = allImages.filter(img => {
                    if (type === 'positive') return img.promptTokens.includes(token);
                    else return img.negativeTokens.includes(token);
                });
                images.forEach(img => {
                    const w = type === 'positive' ? (img.promptWeights?.[token] ?? 1.0) : (img.negativeWeights?.[token] ?? 1.0);
                    weights[w] = (weights[w] || 0) + 1;
                });
                const capsules = Object.entries(weights).sort((a,b) => parseFloat(a[0]) - parseFloat(b[0])).map(([weight, count]) => {
                    return `<span class="weight-capsule" data-weight="${weight}" data-token="${token}" data-type="${type}">${weight} <span class="weight-count">${count}</span></span>`;
                }).join('');
                tokenWeightBar.innerHTML = `<strong>${token} 权重使用率:</strong> ${capsules || '无权重数据'}`;
                tokenWeightBar.style.display = 'block';
                tokenWeightBar.querySelectorAll('.weight-capsule').forEach(cap => {
                    cap.addEventListener('click', () => {
                        const weight = parseFloat(cap.dataset.weight);
                        const token = cap.dataset.token;
                        const type = cap.dataset.type;
                        addFilter({ token, weight, type });
                    });
                });
            }

            function openTokenSidebar() {
                tokenSidebar.classList.add('active');
                updateTokenStats();
                renderTokenList();
                if (currentTokenDetail) renderWeightBar(currentTokenDetail.token, currentTokenDetail.type);
            }

            function closeTokenSidebar() { tokenSidebar.classList.remove('active'); }

            function openSimilarity() {
                if (allImages.length < 2) { showToast('至少需要2张图片', 'error'); return; }
                similarityOverlay.classList.add('active');
                renderSimilarityResults();
            }
            function closeSimilarity() { similarityOverlay.classList.remove('active'); }

            function renderSimilarityResults() {
                const threshold = parseFloat(thresholdSlider.value);
                const excludeCommon = excludeCommonCheckbox.checked;
                const results = calculateSimilarities(allImages, threshold, excludeCommon);
                if (results.length === 0) { similarityResults.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;"><i class="fa-solid fa-check-circle" style="font-size:30px;opacity:0.4;display:block;margin-bottom:10px;"></i>没有找到超过阈值的相似图片对</div>'; return; }
                similarityResults.innerHTML = '';
                results.forEach(result => {
                    const pair = document.createElement('div');
                    pair.className = 'sim-pair';
                    const isHigh = result.similarity >= 0.6;
                    const imgA = result.imgA, imgB = result.imgB;
                    const sameTokenSet = imgA.promptTokens.length === imgB.promptTokens.length && imgA.promptTokens.every(t => imgB.promptTokens.includes(t)) && imgA.negativeTokens.length === imgB.negativeTokens.length && imgA.negativeTokens.every(t => imgB.negativeTokens.includes(t));
                    let hasWeightDiff = false;
                    if (sameTokenSet) {
                        const wa = {...(imgA.promptWeights||{}), ...(imgA.negativeWeights||{})};
                        const wb = {...(imgB.promptWeights||{}), ...(imgB.negativeWeights||{})};
                        const allToks = new Set([...Object.keys(wa), ...Object.keys(wb)]);
                        allToks.forEach(tok => { if (Math.abs((wa[tok]??1.0) - (wb[tok]??1.0)) > 0.001) hasWeightDiff = true; });
                    }
                    pair.innerHTML = `
                        <div class="sim-thumbs"><img src="${imgA.thumbnailDataURL}" data-id="${imgA.id}" title="${imgA.name}"><img src="${imgB.thumbnailDataURL}" data-id="${imgB.id}" title="${imgB.name}"></div>
                        <div class="sim-info"><div class="sim-score ${isHigh ? 'high' : ''}"><i class="fa-solid ${isHigh ? 'fa-triangle-exclamation' : 'fa-chart-line'}"></i> 相似度: ${(result.similarity * 100).toFixed(1)}%</div><div class="sim-common-tokens">共同词条: ${result.commonTokens.slice(0,8).join(', ')}${result.commonTokens.length > 8 ? '...' : ''}</div></div>
                        <div class="sim-actions">
                            <button class="sim-action-btn diff-btn" data-a="${imgA.id}" data-b="${imgB.id}"><i class="fa-solid fa-code-compare"></i> 差异</button>
                            ${hasWeightDiff ? `<button class="sim-action-btn weight-diff-btn" data-a="${imgA.id}" data-b="${imgB.id}"><i class="fa-solid fa-weight-scale"></i> 权重差异</button>` : ''}
                            <button class="sim-action-btn delete" data-id="${imgA.id}"><i class="fa-solid fa-trash"></i> 左</button>
                            <button class="sim-action-btn delete" data-id="${imgB.id}"><i class="fa-solid fa-trash"></i> 右</button>
                        </div>
                    `;
                    pair.querySelector('.diff-btn').addEventListener('click', () => { const a = allImages.find(i=>i.id===imgA.id); const b = allImages.find(i=>i.id===imgB.id); if(a&&b) openDiffModal(a,b); });
                    if (hasWeightDiff) pair.querySelector('.weight-diff-btn').addEventListener('click', () => { const a = allImages.find(i=>i.id===imgA.id); const b = allImages.find(i=>i.id===imgB.id); if(a&&b) openWeightDiffModal(a,b); });
                    pair.querySelectorAll('.sim-thumbs img').forEach(el => el.addEventListener('click', () => openDetail(el.dataset.id)));
                    pair.querySelectorAll('.sim-action-btn.delete').forEach(btn => btn.addEventListener('click', () => { deleteImage(btn.dataset.id); setTimeout(renderSimilarityResults, 300); }));
                    similarityResults.appendChild(pair);
                });
            }

            function toggleSelectionMode() {
                selectionMode = !selectionMode;
                selectedIds.clear();
                downloadActions.classList.toggle('active', selectionMode);
                compressProgress.style.display = 'none'; // 隐藏进度条
                renderGallery();
            }

            // 全选、取消全选、区间选择、反选
            selectAllBtn.addEventListener('click', () => {
                filteredImages.forEach(img => selectedIds.add(img.id));
                renderGallery();
            });
            deselectAllBtn.addEventListener('click', () => {
                selectedIds.clear();
                renderGallery();
            });
            selectRangeBtn.addEventListener('click', () => {
                const selectedArray = Array.from(selectedIds);
                if (selectedArray.length < 2) {
                    showToast('请先选中至少两张图片作为端点', 'error');
                    return;
                }
                // 获取选中图片在 filteredImages 中的索引
                const indices = selectedArray.map(id => filteredImages.findIndex(img => img.id === id)).filter(idx => idx !== -1);
                if (indices.length < 2) {
                    showToast('部分选中图片不在当前筛选结果中', 'error');
                    return;
                }
                const minIdx = Math.min(...indices);
                const maxIdx = Math.max(...indices);
                for (let i = minIdx; i <= maxIdx; i++) {
                    selectedIds.add(filteredImages[i].id);
                }
                renderGallery();
                showToast(`已选中区间内 ${maxIdx - minIdx + 1} 张图片`, 'success');
            });
            invertSelectionBtn.addEventListener('click', () => {
                filteredImages.forEach(img => {
                    if (selectedIds.has(img.id)) selectedIds.delete(img.id);
                    else selectedIds.add(img.id);
                });
                renderGallery();
            });

            function downloadBlob(blob, filename) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename;
                document.body.appendChild(a); a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }

            async function downloadSelected(withMeta) {
                if (selectedIds.size === 0) { showToast('请先选择图片', 'error'); return; }
                const images = allImages.filter(img => selectedIds.has(img.id));
                for (const img of images) {
                    try {
                        if (withMeta) downloadBlob(img.fileBlob, img.name);
                        else {
                            if (img.fileBlob.type === 'image/png') {
                                const noMetaBlob = await removePNGMetadata(img.fileBlob);
                                downloadBlob(noMetaBlob, img.name);
                            } else downloadBlob(img.fileBlob, img.name);
                        }
                    } catch(e) { showToast(`下载 ${img.name} 失败`, 'error'); }
                }
                showToast(`已开始下载 ${images.length} 张图片`, 'success');
            }

            // ========== 新增压缩相关函数 ==========
            async function compressImage(img) {
                // 先缩放并导出 PNG
                const scaledPngBlob = await new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(img.fileBlob);
                    const image = new Image();
                    image.onload = () => {
                        try {
                            const maxDim = 2048;
                            let w = image.width, h = image.height;
                            if (w > maxDim || h > maxDim) {
                                const ratio = Math.min(maxDim / w, maxDim / h);
                                w = Math.round(w * ratio);
                                h = Math.round(h * ratio);
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = w;
                            canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(image, 0, 0, w, h);
                            URL.revokeObjectURL(url);
                            canvas.toBlob((blob) => {
                                if (blob) resolve(blob);
                                else reject(new Error('Canvas 导出 PNG 失败'));
                            }, 'image/png');
                        } catch (e) {
                            URL.revokeObjectURL(url);
                            reject(e);
                        }
                    };
                    image.onerror = () => {
                        URL.revokeObjectURL(url);
                        reject(new Error('图片加载失败'));
                    };
                    image.src = url;
                });

                // 使用 pngquant-wasm 进行有损压缩
                if (!window.pngquant) {
                    throw new Error('压缩引擎未加载');
                }
                const inputArray = new Uint8Array(await scaledPngBlob.arrayBuffer());
                const compressedResult = await window.pngquant.compress(inputArray, {
                    quality: [0.6, 0.8],
                    speed: 4,
                });
                const compressedPngBlob = new Blob([compressedResult.buffer], { type: 'image/png' });

                // 比较大小，如果压缩后更大，则放弃
                if (compressedPngBlob.size >= img.fileBlob.size) {
                    return { skipped: true, reason: '压缩后体积未减小', blob: img.fileBlob };
                }

                // 如果原图是 PNG，则嵌入元数据
                let finalBlob = compressedPngBlob;
                if (img.fileBlob.type === 'image/png') {
                    const metadataObj = {
                        prompt: img.prompt || '',
                        uc: img.negativePrompt || '',
                        seed: img.seed ?? undefined,
                        steps: img.steps ?? undefined,
                        sampler: img.sampler || undefined,
                        scale: img.scale ?? undefined,
                    };
                    finalBlob = await createPNGWithMetadata(compressedPngBlob, metadataObj);
                }

                // 生成新缩略图
                const newThumb = await generateThumbnailFromBlob(finalBlob);
                return { blob: finalBlob, thumbnailDataURL: newThumb, skipped: false };
            }

            async function compressSelected() {
                if (selectedIds.size === 0) {
                    showToast('请先选择要压缩的图片', 'error');
                    return;
                }
                const imagesToCompress = allImages.filter(img => selectedIds.has(img.id));
                if (imagesToCompress.length === 0) return;

                // 过滤掉已压缩过的图片
                const pendingImages = imagesToCompress.filter(img => !img.isCompressed);
                const skippedAlreadyCompressed = imagesToCompress.length - pendingImages.length;
                if (skippedAlreadyCompressed > 0) {
                    showToast(`跳过 ${skippedAlreadyCompressed} 张已压缩过的图片`, 'info');
                }
                if (pendingImages.length === 0) {
                    showToast('选中的图片均已压缩过', 'info');
                    return;
                }

                // 显示进度条
                compressProgress.style.display = 'flex';
                progressBarInner.style.width = '0%';
                progressText.textContent = `0/${pendingImages.length}`;

                const originalTotalSize = getTotalSize();
                let processed = 0;
                let successCount = 0;
                let skippedSize = 0; // 压缩后未减小的图片数量

                for (const img of pendingImages) {
                    try {
                        const result = await compressImage(img);
                        if (result.skipped) {
                            skippedSize++;
                            // 标记为已压缩，防止重复尝试
                            img.isCompressed = true;
                            await dbAddImage(img);
                        } else {
                            img.fileBlob = result.blob;
                            img.thumbnailDataURL = result.thumbnailDataURL;
                            img.isCompressed = true;
                            await dbAddImage(img);
                            successCount++;
                        }
                    } catch (err) {
                        console.error(`压缩 ${img.name} 失败:`, err);
                        showToast(`压缩 ${img.name} 失败`, 'error');
                    }
                    processed++;
                    progressBarInner.style.width = `${(processed / pendingImages.length) * 100}%`;
                    progressText.textContent = `${processed}/${pendingImages.length}`;
                }

                const newTotalSize = getTotalSize();
                const savedBytes = originalTotalSize - newTotalSize;
                const savedText = savedBytes >= 0 ? formatBytes(savedBytes) : `-${formatBytes(-savedBytes)}`;

                progressText.textContent = `完成`;
                setTimeout(() => {
                    compressProgress.style.display = 'none';
                }, 2000);

                showToast(`压缩完成：成功 ${successCount} 张，跳过 ${skippedSize} 张（未减小），总大小变化：${savedText}`, 'success');
                updateTotalSizeDisplay();
                renderGallery(); // 刷新画廊以显示可能的缩略图变化
            }

            // 删除重复图片（保留原逻辑）
            async function deleteDuplicateImages() {
                const groups = new Map();
                allImages.forEach(img => {
                    const key = JSON.stringify({ p: img.prompt, n: img.negativePrompt, seed: img.seed, steps: img.steps, sampler: img.sampler, scale: img.scale });
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push(img);
                });
                let deleteCount = 0;
                groups.forEach(imgs => { if (imgs.length > 1) deleteCount += imgs.length - 1; });
                if (deleteCount === 0) { showToast('没有发现重复元数据图片', 'info'); return; }
                if (!confirm(`发现 ${deleteCount} 张重复图片，将删除重复项（保留每组最早一张），确定？`)) return;
                let deleted = 0;
                for (const imgs of groups.values()) {
                    if (imgs.length > 1) {
                        imgs.sort((a,b) => (a.timestamp||0) - (b.timestamp||0));
                        for (const img of imgs.slice(1)) {
                            try { await dbDeleteImage(img.id); deleted++; } catch(e) { console.error(e); }
                        }
                    }
                }
                showToast(`已删除 ${deleted} 张重复图片`, 'success');
                await loadAllImages();
            }

            // 事件绑定
            uploadBtn.addEventListener('click', () => fileInput.click());
            uploadHintBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFiles(e.target.files); fileInput.value = ''; });
            document.getElementById('gallery').addEventListener('dragover', (e) => { e.preventDefault(); e.currentTarget.style.backgroundColor = '#eef1ff'; });
            document.getElementById('gallery').addEventListener('dragleave', (e) => { e.preventDefault(); e.currentTarget.style.backgroundColor = ''; });
            document.getElementById('gallery').addEventListener('drop', (e) => { e.preventDefault(); e.currentTarget.style.backgroundColor = ''; if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

            clearFilterBtn.addEventListener('click', clearAllFilters);
            modalCloseBtn.addEventListener('click', closeDetail);
            detailModal.addEventListener('click', (e) => { if (e.target === detailModal) closeDetail(); });
            diffModalCloseBtn.addEventListener('click', closeDiffModal);
            diffModal.addEventListener('click', (e) => { if (e.target === diffModal) closeDiffModal(); });
            weightDiffCloseBtn.addEventListener('click', closeWeightDiffModal);
            weightDiffModal.addEventListener('click', (e) => { if (e.target === weightDiffModal) closeWeightDiffModal(); });

            tokenLibraryBtn.addEventListener('click', openTokenSidebar);
            tokenSidebarClose.addEventListener('click', closeTokenSidebar);
            tabPositive.addEventListener('click', () => { currentTokenTab = 'positive'; tabPositive.classList.add('active'); tabNegative.classList.remove('active'); renderTokenList(); if(currentTokenDetail?.type === 'positive') renderWeightBar(currentTokenDetail.token, 'positive'); });
            tabNegative.addEventListener('click', () => { currentTokenTab = 'negative'; tabNegative.classList.add('active'); tabPositive.classList.remove('active'); renderTokenList(); if(currentTokenDetail?.type === 'negative') renderWeightBar(currentTokenDetail.token, 'negative'); });
            tokenSearchInput.addEventListener('input', renderTokenList);

            similarityBtn.addEventListener('click', openSimilarity);
            similarityCloseBtn.addEventListener('click', closeSimilarity);
            similarityOverlay.addEventListener('click', (e) => { if (e.target === similarityOverlay) closeSimilarity(); });
            thresholdSlider.addEventListener('input', () => { thresholdValue.textContent = parseFloat(thresholdSlider.value).toFixed(2); renderSimilarityResults(); });
            excludeCommonCheckbox.addEventListener('change', renderSimilarityResults);

            downloadModeBtn.addEventListener('click', toggleSelectionMode);
            downloadWithMetaBtn.addEventListener('click', () => downloadSelected(true));
            downloadNoMetaBtn.addEventListener('click', () => downloadSelected(false));
            compressSelectedBtn.addEventListener('click', compressSelected);
            deleteDuplicatesBtn.addEventListener('click', deleteDuplicateImages);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (detailModal.classList.contains('active')) closeDetail();
                    if (diffModal.classList.contains('active')) closeDiffModal();
                    if (weightDiffModal.classList.contains('active')) closeWeightDiffModal();
                    if (similarityOverlay.classList.contains('active')) closeSimilarity();
                    if (tokenSidebar.classList.contains('active')) closeTokenSidebar();
                }
            });

            (async function init() {
                await loadAllImages();
                if (allImages.length > 0) { galleryEmpty.style.display = 'none'; galleryGrid.style.display = 'grid'; }
            })().catch(err => { console.error(err); showToast('初始化失败', 'error'); });
        })();
    </script>
</body>
