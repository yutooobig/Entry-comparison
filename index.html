            function generateThumbnailFromBlob(blob, maxSize = 300) {
                return new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(blob);
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width;
                        let h = img.height;
                        if (w > maxSize || h > maxSize) {
                            const ratio = Math.min(maxSize / w, maxSize / h);
                            w = Math.round(w * ratio);
                            h = Math.round(h * ratio);
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        URL.revokeObjectURL(url);
                        resolve(canvas.toDataURL('image/webp', 0.8));
                    };
                    img.onerror = () => { URL.revokeObjectURL(url);
                        reject(new Error('缩略图生成失败')); };
                    img.src = url;
                });
            }

            async function handleFiles(files) {
                const allFiles = Array.from(files);
                if (allFiles.length === 0) return;
                const pngFiles = allFiles.filter(f => f.type === 'image/png' || f.name.toLowerCase().endsWith('.png'));
                const otherImages = allFiles.filter(f => !(f.type === 'image/png' || f.name.toLowerCase().endsWith('.png')) &&
                    f.type.startsWith('image/'));
                if (pngFiles.length === 0 && otherImages.length === 0) { showToast('请选择图片文件', 'error'); return; }
                let successCount = 0;
                let failCount = 0;
                const processFiles = [...pngFiles, ...otherImages];
                for (const file of processFiles) {
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const metadata = parsePNGMetadata(arrayBuffer);
                        if (!metadata || !metadata.prompt) {
                            failCount++;
                            showToast(`"${file.name}" 未找到有效元数据`, 'error');
                            continue;
                        }
                        const thumbnailDataURL = await generateThumbnailFromBlob(file);
                        const promptData = extractTokenData(metadata.prompt);
                        const negativeData = extractTokenData(metadata.uc || '');
                        const imageData = {
                            id: generateId(),
                            name: file.name,
                            fileBlob: file,
                            thumbnailDataURL,
                            prompt: metadata.prompt || '',
                            negativePrompt: metadata.uc || '',
                            seed: metadata.seed !== undefined ? metadata.seed : null,
                            steps: metadata.steps !== undefined ? metadata.steps : null,
                            sampler: metadata.sampler || '',
                            scale: metadata.scale !== undefined ? metadata.scale : null,
                            promptTokens: promptData.tokens,
                            negativeTokens: negativeData.tokens,
                            promptWeights: promptData.weights,
                            negativeWeights: negativeData.weights,
                            timestamp: Date.now(),
                            isCompressed: false,
                        };
                        await dbAddImage(imageData);
                        successCount++;
                    } catch (err) {
                        failCount++;
                        console.error(err);
                        showToast(`"${file.name}" 处理失败: ${err.message}`, 'error');
                    }
                }
                if (successCount > 0) {
                    showToast(
                        `成功导入 ${successCount} 张图片${failCount > 0 ? '，'+failCount+' 张失败' : ''}`,
                        successCount > 0 && failCount === 0 ? 'success' : 'info');
                    await loadAllImages();
                }
            }

            // ==================== 筛选相关 ====================
            function applyFilters() {
                if (activeFilters.length === 0) {
                    filteredImages = [...allImages];
                } else {
                    filteredImages = allImages.filter(img => {
                        return activeFilters.every(filter => {
                            const { token, weight, type } = filter;
                            if (type === 'positive') {
                                if (!img.promptTokens.includes(token)) return false;
                                if (weight !== undefined) {
                                    const actualWeight = img.promptWeights && img.promptWeights[token] !==
                                        undefined ? img.promptWeights[token] : 1.0;
                                    return Math.abs(actualWeight - weight) < 0.001;
                                }
                                return true;
                            } else if (type === 'negative') {
                                if (!img.negativeTokens.includes(token)) return false;
                                if (weight !== undefined) {
                                    const actualWeight = img.negativeWeights && img.negativeWeights[token] !==
                                        undefined ? img.negativeWeights[token] : 1.0;
                                    return Math.abs(actualWeight - weight) < 0.001;
                                }
                                return true;
                            } else {
                                if (img.promptTokens.includes(token) || img.negativeTokens.includes(token)) {
                                    if (weight !== undefined) {
                                        let matched = false;
                                        if (img.promptTokens.includes(token)) {
                                            const w = img.promptWeights?.[token] ?? 1.0;
                                            if (Math.abs(w - weight) < 0.001) matched = true;
                                        }
                                        if (!matched && img.negativeTokens.includes(token)) {
                                            const w = img.negativeWeights?.[token] ?? 1.0;
                                            if (Math.abs(w - weight) < 0.001) matched = true;
                                        }
                                        return matched;
                                    }
                                    return true;
                                }
                                return false;
                            }
                        });
                    });
                }
                renderGallery();
                renderFilterTags();
                renderWeightFilterBar();
            }

            function addFilter(filterObj) {
                if (filterObj.weight !== undefined) {
                    activeFilters = activeFilters.filter(f => !(f.token === filterObj.token && f.type === filterObj.type));
                } else {
                    activeFilters = activeFilters.filter(f => !(f.token === filterObj.token && f.type === filterObj.type && f
                        .weight !== undefined));
                }
                if (!activeFilters.some(f => f.token === filterObj.token && f.type === filterObj.type && f.weight === filterObj
                        .weight)) {
                    activeFilters.push(filterObj);
                }
                applyFilters();
            }

            function removeFilter(filterObj) {
                activeFilters = activeFilters.filter(f => !(f.token === filterObj.token && f.weight === filterObj.weight && f
                    .type === filterObj.type));
                applyFilters();
            }

            function clearAllFilters() {
                activeFilters = [];
                applyFilters();
            }

            function setWeightFilter(token, type, weight) {
                activeFilters = activeFilters.filter(f => !(f.token === token && f.type === type));
                if (weight !== null && weight !== undefined) {
                    activeFilters.push({ token, type, weight });
                } else {
                    activeFilters.push({ token, type });
                }
                applyFilters();
            }

            function renderWeightFilterBar() {

                if (!primaryFilter || filteredImages.length === 0) {
                    weightFilterBar.style.display = 'none';
                    weightFilterBar.innerHTML = '';
                    return;
                }
                const { token, type } = primaryFilter;
                const weightCounts = {};
                filteredImages.forEach(img => {
                    let weights = type === 'positive' ? img.promptWeights : img.negativeWeights;
                    let tokens = type === 'positive' ? img.promptTokens : img.negativeTokens;
                    if (tokens.includes(token)) {
                        const w = weights && weights[token] !== undefined ? weights[token] : 1.0;
                        weightCounts[w] = (weightCounts[w] || 0) + 1;
                    }
                });
                const allWeights = Object.keys(weightCounts).map(Number).sort((a, b) => a - b);
                if (allWeights.length === 0) {
                    weightFilterBar.style.display = 'none';
                    weightFilterBar.innerHTML = '';
                    return;
                }
                const currentWeightFilter = activeFilters.find(f => f.token === token && f.type === type && f.weight !==
                    undefined);
                const currentWeight = currentWeightFilter ? currentWeightFilter.weight : null;
                let html =
                    `<span class="weight-filter-label"><i class="fa-solid fa-weight-scale"></i> ${token} 权重:</span>`;
                html +=

                allWeights.forEach(w => {

            async function copyText(text, label) {
                if (!text) { showToast(`${label}为空`, 'error'); return; }

                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();

                        </div>
                    </div>
                    <div class="modal-section"><span class="section-label">正向词条 (${img.promptTokens.length})</span><div style="display:flex;flex-wrap:wrap;gap:6px;">${img.promptTokens.map(t => `<span style="font-size:11px;background:#eef1ff;color:var(--primary);padding:3px 8px;border-radius:12px;">${t}</span>`).join('')}</div></div>
                    <div class="modal-section"><span class="section-label">负向词条 (${img.negativeTokens.length})</span><div style="display:flex;flex-wrap:wrap;gap:6px;">${img.negativeTokens.map(t => `<span style="font-size:11px;background:#fdf0ef;color:var(--danger);padding:3px 8px;border-radius:12px;">${t}</span>`).join('')}</div></div>
                `;
                document.getElementById('copyPosBtn').addEventListener('click', () => copyPromptWithBlockFilter(img,
                'positive'));
                document.getElementById('copyNegBtn').addEventListener('click', () => copyPromptWithBlockFilter(img,
                    'negative'));
                detailModal.classList.add('active');
            }

            function closeDetail() { detailModal.classList.remove('active'); }

            function getDiffTokensWithBlock(imgA, imgB, field) {
                const blockedDiff = getBlockedTokensForDiff();
                const tokensA = (field === 'prompt' ? imgA.promptTokens : imgA.negativeTokens).filter(t => !blockedDiff.has(
                t));
                const tokensB = (field === 'prompt' ? imgB.promptTokens : imgB.negativeTokens).filter(t => !blockedDiff.has(
                t));
                return {
                    common: tokensA.filter(t => tokensB.includes(t)),
                    diffA: tokensA.filter(t => !tokensB.includes(t)),
                    diffB: tokensB.filter(t => !tokensA.includes(t)),
                };
            }

            function openDiffModal(imgA, imgB) {
                const posData = getDiffTokensWithBlock(imgA, imgB, 'prompt');
                const negData = getDiffTokensWithBlock(imgA, imgB, 'negative');
                const renderTokenList = (tokens, type) => tokens.map(t =>
                    `<span class="diff-token ${type}">${t}</span>`).join('') || '<span style="color:#aaa;">无</span>';
                diffModalBody.innerHTML = `
                    <div class="diff-container">
                        <div class="diff-card"><div class="diff-title">${imgA.name}</div><span class="section-label">正向独有</span><div class="diff-token-list">${renderTokenList(posData.diffA, 'positive')}</div><span class="section-label">负向独有</span><div class="diff-token-list">${renderTokenList(negData.diffA, 'negative')}</div></div>
                        <div class="diff-card"><div class="diff-title">${imgB.name}</div><span class="section-label">正向独有</span><div class="diff-token-list">${renderTokenList(posData.diffB, 'positive')}</div><span class="section-label">负向独有</span><div class="diff-token-list">${renderTokenList(negData.diffB, 'negative')}</div></div>
                    </div>
                    <div class="modal-section"><span class="section-label">共同正向词条</span><div class="diff-token-list">${renderTokenList(posData.common, 'positive')}</div></div>
                    <div class="modal-section"><span class="section-label">共同负向词条</span><div class="diff-token-list">${renderTokenList(negData.common, 'negative')}</div></div>
                `;
                diffModal.classList.add('active');
            }

            function closeDiffModal() { diffModal.classList.remove('active'); }

            function openWeightDiffModal(imgA, imgB) {
                const weightsA = { ...(imgA.promptWeights || {}), ...(imgA.negativeWeights || {}) };
                const weightsB = { ...(imgB.promptWeights || {}), ...(imgB.negativeWeights || {}) };
                const blockedDiff = getBlockedTokensForDiff();
                const allTokens = new Set([...Object.keys(weightsA), ...Object.keys(weightsB)]);
                const diffTokens = [];
                allTokens.forEach(token => {
                    if (blockedDiff.has(token)) return;
                    const wA = weightsA[token] !== undefined ? weightsA[token] : 1.0;
                    const wB = weightsB[token] !== undefined ? weightsB[token] : 1.0;
                    if (Math.abs(wA - wB) > 0.001) diffTokens.push({ token, wA, wB });
                });
                if (diffTokens.length === 0) { showToast('没有权重差异', 'info'); return; }
                weightDiffBody.innerHTML =
                    `<div class="weight-diff-list">${diffTokens.map(d => `<div class="weight-diff-row"><span class="diff-token-name">${d.token}</span><span class="diff-weight">${imgA.name}: <strong>${d.wA}</strong></span><span class="diff-weight">${imgB.name}: <strong>${d.wB}</strong></span></div>`).join('')}</div>`;
                weightDiffModal.classList.add('active');
            }

            function closeWeightDiffModal() { weightDiffModal.classList.remove('active'); }

            function updateTokenStats() {
                tokenStats = { positive: {}, negative: {} };
                allImages.forEach(img => {
                    img.promptTokens.forEach(token => { tokenStats.positive[token] = (tokenStats.positive[
                        token] || 0) + 1; });
                    img.negativeTokens.forEach(token => { tokenStats.negative[token] = (tokenStats.negative[
                        token] || 0) + 1; });
                });
            }

            // ==================== 标签筛选栏 ====================
            function renderTagFilterBar() {
                if (currentTokenTab === 'blocked') {
                    tagFilterBar.style.display = 'none';
                    return;
                }
                const customLabels = loadCustomLabels();
                const tokenLabels = loadTokenLabels();
                const stats = currentTokenTab === 'positive' ? tokenStats.positive : tokenStats.negative;
                let html = '';
                if (customLabels.length === 0) {
                    tagFilterBar.innerHTML =
                        '<span style="font-size:11px;color:var(--text-secondary);padding:4px;">暂无标签，点击"标签管理"创建</span>';
                    return;
                }
                html +=
                    `<span class="tag-filter-capsule ${activeTagFilters.length === 0 ? 'active' : ''}" data-label="__all__"><i class="fa-solid fa-list"></i> 全部</span>`;
                customLabels.forEach(label => {
                    const count = Object.entries(tokenLabels).filter(([token, labels]) => labels.includes(
                        label) && stats[token]).length;
                    const isActive = activeTagFilters.includes(label);
                    const color = getLabelColor(label);
                    html +=
                        `<span class="tag-filter-capsule ${isActive ? 'active' : ''}" data-label="${label}" style="${isActive ? '' : `border-color:${color}30;background:${color}15;color:${color};`}"><i class="fa-solid fa-tag" style="font-size:9px;"></i> ${label} <span class="tag-count">${count}</span></span>`;
                });
                tagFilterBar.innerHTML = html;
                tagFilterBar.style.display = 'flex';
                tagFilterBar.querySelectorAll('.tag-filter-capsule').forEach(cap => {
                    cap.addEventListener('click', () => {
                        const label = cap.dataset.label;
                        if (label === '__all__') {
                            activeTagFilters = [];
                        } else {
                            const idx = activeTagFilters.indexOf(label);
                            if (idx >= 0) activeTagFilters.splice(idx, 1);
                            else activeTagFilters.push(label);
                        }
                        renderTagFilterBar();
                        renderTokenList();
                    });
                });
            }

            // ==================== 词条列表渲染 ====================
            function renderTokenList() {
                if (currentTokenTab === 'blocked') {
                    renderBlockedTokenList();
                    return;
                }
                const searchTerm = tokenSearchInput.value.trim().toLowerCase();
                const stats = currentTokenTab === 'positive' ? tokenStats.positive : tokenStats.negative;
                const tokenLabels = loadTokenLabels();
                const blockedTokensData = loadBlockedTokens();
                let entries = Object.entries(stats).sort((a, b) => b[1] - a[1]);
                if (activeTagFilters.length > 0) {
                    entries = entries.filter(([token]) => {
                        const labels = tokenLabels[token] || [];
                        return activeTagFilters.every(l => labels.includes(l));
                    });
                }
                if (searchTerm) {
                    entries = entries.filter(([token]) => {
                        const labels = tokenLabels[token] || [];
                        return token.toLowerCase().includes(searchTerm) || labels.some(l => l.toLowerCase()
                            .includes(searchTerm));
                    });
                }
                if (!batchLabelMode) {
                    entries = entries.filter(([token]) => {
                        const settings = getEffectiveBlockSettings(token);
                        return !settings.display;
                    });
                }
                if (entries.length === 0) {
                    tokenList.innerHTML =
                        '<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;"><i class="fa-solid fa-inbox" style="font-size:30px;opacity:0.4;display:block;margin-bottom:10px;"></i>暂无词条</div>';
                    if (batchLabelMode) updateBatchSelectionUI();
                    return;
                }
                tokenList.innerHTML = '';
                entries.forEach(([token, count]) => {
                    const item = document.createElement('div');
                    item.className = 'token-item';
                    const countClass = currentTokenTab === 'positive' ? 'pos' : 'neg';
                    const labels = tokenLabels[token] || [];
                    const blockSettings = getEffectiveBlockSettings(token);
                    const isBlockedDisplay = blockSettings.display;
                    const isBlockedCopy = blockSettings.copy;
                    const isBlockedDiff = blockSettings.diff;
                    const isBatchSelected = batchSelectedTokens.has(token);
                    const isCheckedInBatch = batchLabelMode && isBatchSelected;
                    let labelsHtml = '';
                    if (labels.length > 0) {
                        const shownLabels = labels.slice(0, 2);
                        const moreCount = labels.length - shownLabels.length;
                        shownLabels.forEach(l => {
                            const color = getLabelColor(l);
                            labelsHtml +=
                                `<span class="tag-badge" data-label="${l}" title="点击筛选: ${l}" style="background:${color}15;color:${color};border:1px solid ${color}40;">${l}</span>`;
                        });
                        if (moreCount > 0) {
                            labelsHtml +=
                                `<span class="tag-badge more-tags" title="${labels.join(', ')}">+${moreCount}</span>`;
                        }
                    }
                    const blockIndicator = (isBlockedDisplay || isBlockedCopy || isBlockedDiff) ?
                        `<span title="已屏蔽: ${isBlockedDisplay?'展示 ':''}${isBlockedCopy?'复制 ':''}${isBlockedDiff?'差异':''}" style="font-size:10px;color:var(--danger);">🚫</span>` :
                        '';
                    item.innerHTML = `
                        <input type="checkbox" class="token-checkbox ${batchLabelMode ? 'show' : ''}" data-token="${token}" ${isCheckedInBatch ? 'checked' : ''}>
                        <span class="token-name" data-token="${token}">${token}</span>
                        ${labelsHtml}
                        ${blockIndicator}
                        <span class="token-count ${countClass}">${count} 次</span>
                        <button class="token-action-btn tag-btn ${labels.length > 0 ? 'has-tag' : ''}" data-token="${token}" title="打标签"><i class="fa-solid fa-tag"></i></button>
                        <button class="token-action-btn block-btn ${(isBlockedDisplay||isBlockedCopy||isBlockedDiff) ? 'blocked' : ''}" data-token="${token}" title="屏蔽设置"><i class="fa-solid fa-ban"></i></button>
                        <button class="token-action-btn filter-token-btn" data-token="${token}" title="筛选图片"><i class="fa-solid fa-filter"></i></button>
                    `;
                    const nameEl = item.querySelector('.token-name');
                    nameEl.addEventListener('click', () => {
                        if (batchLabelMode) return;
                        currentTokenDetail = { token, type: currentTokenTab };
                        renderWeightBar(token, currentTokenTab);
                    });
                    const checkbox = item.querySelector('.token-checkbox');
                    checkbox.addEventListener('change', (e) => {
                        e.stopPropagation();
                        const t = e.target.dataset.token;
                        if (e.target.checked) batchSelectedTokens.add(t);
                        else batchSelectedTokens.delete(t);
                        updateBatchSelectionUI();
                    });
                    item.querySelector('.filter-token-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        addFilter({ token, type: currentTokenTab });
                    });
                    item.querySelector('.tag-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        openTagSelectorForToken(token);
                    });
                    item.querySelector('.block-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        openBlockSettingsForToken(token);
                    });
                    item.querySelectorAll('.tag-badge[data-label]').forEach(badge => {
                        badge.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const label = badge.dataset.label;
                            if (!activeTagFilters.includes(label)) {
                                activeTagFilters.push(label);
                            } else {
                                activeTagFilters = activeTagFilters.filter(l => l !== label);
                            }
                            renderTagFilterBar();
                            renderTokenList();
                        });
                    });
                    tokenList.appendChild(item);
                });
                if (batchLabelMode) updateBatchSelectionUI();
            }

            function renderBlockedTokenList() {
                const searchTerm = tokenSearchInput.value.trim().toLowerCase();
                const tokenLabels = loadTokenLabels();
                const blockedTokensData = loadBlockedTokens();
                const blockedLabels = loadBlockedLabels();
                const blockedMap = new Map();
                for (const [token, settings] of Object.entries(blockedTokensData)) {
                    if (settings.display) {
                        const type = tokenStats.positive[token] ? 'positive' : (tokenStats.negative[token] ?
                            'negative' : null);
                        if (type) {
                            blockedMap.set(token, { type, source: 'token', labelName: null });
                        }
                    }
                }
                for (const [label, settings] of Object.entries(blockedLabels)) {
                    if (!settings.display) continue;
                    for (const [token, labels] of Object.entries(tokenLabels)) {
                        if (labels.includes(label)) {
                            const existing = blockedMap.get(token);
                            if (!existing || existing.source === 'label') {
                                const type = tokenStats.positive[token] ? 'positive' : (tokenStats
                                    .negative[token] ? 'negative' : null);
                                if (type) {
                                    blockedMap.set(token, { type, source: existing ? existing
                                            .source : 'label', labelName: existing ? existing
                                            .labelName || label : label });
                                }
                            }
                        }
                    }
                }
                let entries = Array.from(blockedMap.entries());
                if (searchTerm) {
                    entries = entries.filter(([token]) => token.toLowerCase().includes(searchTerm) || (tokenLabels[
                        token] || []).some(l => l.toLowerCase().includes(searchTerm)));
                }
                if (entries.length === 0) {
                    tokenList.innerHTML =
                        '<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;"><i class="fa-solid fa-check-circle" style="font-size:30px;opacity:0.4;display:block;margin-bottom:10px;"></i>暂无被屏蔽的词条</div>';
                    return;
                }
                tokenList.innerHTML = '';
                entries.forEach(([token, info]) => {
                    const item = document.createElement('div');
                    item.className = 'token-item';
                    const count = info.type === 'positive' ? (tokenStats.positive[token] || 0) : (tokenStats
                        .negative[token] || 0);
                    const countClass = info.type === 'positive' ? 'pos' : 'neg';
                    const labels = tokenLabels[token] || [];
                    const sourceText = info.source === 'token' ? '词条级' : `标签级(${info.labelName})`;
                    let labelsHtml = '';
                    if (labels.length > 0) {
                        labelsHtml = labels.slice(0, 2).map(l => {
                            const color = getLabelColor(l);
                            return `<span class="tag-badge" style="background:${color}15;color:${color};border:1px solid ${color}40;">${l}</span>`;
                        }).join('');
                    }
                    item.innerHTML = `
                        <span class="token-name" data-token="${token}" title="来源: ${sourceText}"><i class="fa-solid ${info.type === 'positive' ? 'fa-plus-circle' : 'fa-minus-circle'}" style="font-size:12px;color:var(--text-secondary);"></i> ${token}</span>
                        ${labelsHtml}
                        <span style="font-size:10px;color:var(--text-secondary);margin-left:8px;">(${sourceText})</span>
                        <span class="token-count ${countClass}">${count} 次</span>
                        <button class="token-action-btn unblock-btn" data-token="${token}" title="取消屏蔽"><i class="fa-solid fa-eye"></i></button>
                    `;
                    item.querySelector('.token-name').addEventListener('click', () => {
                        currentTokenDetail = { token, type: info.type };
                        renderWeightBar(token, info.type);
                    });
                    item.querySelector('.unblock-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        unblockToken(token, info);
                    });
                    tokenList.appendChild(item);
                });
            }

            function unblockToken(token, info) {
                const blockedTokens = loadBlockedTokens();
                if (blockedTokens[token]) {
                    blockedTokens[token].display = false;
                    if (!blockedTokens[token].copy && !blockedTokens[token].diff) {
                        delete blockedTokens[token];
                    }
                } else {
                    blockedTokens[token] = { display: false, copy: false, diff: false };
                }
                saveBlockedTokens(blockedTokens);
                renderTokenList();
                showToast(`已取消对 "${token}" 的展示屏蔽`, 'success');
            }

            function updateBatchSelectionUI() {
                const count = batchSelectedTokens.size;
                batchSelectedCount.textContent = `已选 ${count} 项`;
                if (batchLabelMode) {
                    tokenList.querySelectorAll('.token-checkbox').forEach(cb => {
                        cb.checked = batchSelectedTokens.has(cb.dataset.token);
                    });
                }
            }

            function renderWeightBar(token, type) {
                if (!token) { tokenWeightBar.style.display = 'none'; return; }
                const weights = {};
                const images = allImages.filter(img => {
                    if (type === 'positive') return img.promptTokens.includes(token);
                    else return img.negativeTokens.includes(token);
                });
                images.forEach(img => {
                    const w = type === 'positive' ? (img.promptWeights?.[token] ?? 1.0) : (img.negativeWeights?.[
                        token] ?? 1.0);
                    weights[w] = (weights[w] || 0) + 1;
                });
                const capsules = Object.entries(weights).sort((a, b) => parseFloat(a[0]) - parseFloat(b[0])).map((
                [weight, count]) => {
                    return `<span class="weight-capsule" data-weight="${weight}" data-token="${token}" data-type="${type}">${weight} <span class="weight-count">${count}</span></span>`;
                }).join('');
                tokenWeightBar.innerHTML = `<strong>${token} 权重使用率:</strong> ${capsules || '无权重数据'}`;
                tokenWeightBar.style.display = 'block';
                tokenWeightBar.querySelectorAll('.weight-capsule').forEach(cap => {
                    cap.addEventListener('click', () => {
                        const weight = parseFloat(cap.dataset.weight);
                        const token = cap.dataset.token;
                        const type = cap.dataset.type;
                        setWeightFilter(token, type, weight);
                    });
                });
            }

            function openTokenSidebar() {
                tokenSidebar.classList.add('active');
                updateTokenStats();
                renderTagFilterBar();
                renderTokenList();
                if (currentTokenDetail) renderWeightBar(currentTokenDetail.token, currentTokenDetail.type);
            }

            function closeTokenSidebar() {
                tokenSidebar.classList.remove('active');
                if (batchLabelMode) toggleBatchLabelMode();
            }

            // ==================== 批量标注 ====================
            function toggleBatchLabelMode() {
                batchLabelMode = !batchLabelMode;
                batchSelectedTokens.clear();
                batchLabelBtn.classList.toggle('active', batchLabelMode);
                batchActionBar.classList.toggle('active', batchLabelMode);
                renderTokenList();
                if (batchLabelMode) {
                    showToast('批量标注模式已开启，请勾选词条', 'info');
                } else {
                    showToast('批量标注模式已关闭', 'info');
                }
            }

            // ==================== 标签管理模态框 ====================
            function openTagManager() {
                const customLabels = loadCustomLabels();
                const tokenLabels = loadTokenLabels();
                const blockedLabels = loadBlockedLabels();
                let html = '';
                if (customLabels.length === 0) {
                    html +=
                        '<div style="text-align:center;padding:20px;color:var(--text-secondary);font-size:13px;">暂无标签，请添加</div>';
                } else {
                    html += '<div class="tag-manage-list">';
                    customLabels.forEach(label => {
                        const count = Object.entries(tokenLabels).filter(([t, labels]) => labels.includes(
                            label)).length;
                        const isBlocked = blockedLabels[label];
                        const color = getLabelColor(label);
                        html += `
                            <div class="tag-manage-item">
                                <span class="tag-manage-name"><span style="width:10px;height:10px;border-radius:50%;background:${color};display:inline-block;"></span> ${label}</span>
                                <span class="tag-manage-count">${count} 词条</span>
                                ${isBlocked ? '<span style="font-size:10px;color:var(--danger);">🚫</span>' : ''}
                                <button class="tag-manage-block" data-label="${label}" title="屏蔽设置"><i class="fa-solid fa-ban"></i></button>
                                <button class="tag-manage-delete" data-label="${label}" title="删除标签"><i class="fa-solid fa-trash"></i></button>
                            </div>`;
                    });
                    html += '</div>';
                }
                html += `
                    <div class="tag-add-row">
                        <input type="text" id="newTagInput" placeholder="输入新标签名称...">
                        <button class="tag-add-btn" id="addTagBtn"><i class="fa-solid fa-plus"></i> 添加</button>
                    </div>
                `;
                tagManagerBody.innerHTML = html;
                tagManagerBody.querySelectorAll('.tag-manage-block').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const label = btn.dataset.label;
                        openBlockSettingsForLabel(label);
                    });
                });
                tagManagerBody.querySelectorAll('.tag-manage-delete').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const label = btn.dataset.label;
                        if (!confirm(`确定删除标签"${label}"吗？相关词条的标签也会移除。`)) return;
                        const customLabels = loadCustomLabels().filter(l => l !== label);
                        saveCustomLabels(customLabels);
                        const tokenLabels = loadTokenLabels();
                        for (const [token, labels] of Object.entries(tokenLabels)) {
                            tokenLabels[token] = labels.filter(l => l !== label);
                            if (tokenLabels[token].length === 0) delete tokenLabels[token];
                        }
                        saveTokenLabels(tokenLabels);
                        const blockedLabels = loadBlockedLabels();
                        delete blockedLabels[label];
                        saveBlockedLabels(blockedLabels);
                        openTagManager();
                        renderTagFilterBar();
                        renderTokenList();
                        showToast(`已删除标签"${label}"`, 'success');
                    });
                });
                const addBtn = document.getElementById('addTagBtn');
                const input = document.getElementById('newTagInput');
                const doAddTag = () => {
                    const name = input.value.trim();
                    if (!name) { showToast('请输入标签名称', 'error'); return; }
                    const customLabels = loadCustomLabels();
                    if (customLabels.includes(name)) { showToast('标签已存在', 'error'); return; }
                    customLabels.push(name);
                    saveCustomLabels(customLabels);
                    openTagManager();
                    renderTagFilterBar();
                    showToast(`已添加标签"${name}"`, 'success');
                };
                addBtn.addEventListener('click', doAddTag);
                input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doAddTag(); });
                tagManagerModal.classList.add('active');
            }

            function closeTagManager() { tagManagerModal.classList.remove('active'); }

            // ==================== 标签选择器 ====================
            function openTagSelectorForToken(token) {
                tagSelectorTarget = token;
                tagSelectorBatchTargets = null;
                tagSelectorTitle.innerHTML = `<i class="fa-solid fa-tag"></i> 为 "${token}" 选择标签`;
                renderTagSelector();
                tagSelectorModal.classList.add('active');
            }

            function openTagSelectorForBatch() {
                if (batchSelectedTokens.size === 0) { showToast('请先勾选词条', 'error'); return; }
                tagSelectorTarget = null;
                tagSelectorBatchTargets = Array.from(batchSelectedTokens);
                tagSelectorTitle.innerHTML =
                    `<i class="fa-solid fa-tag"></i> 为 ${batchSelectedTokens.size} 个词条批量选择标签`;
                renderTagSelector();
                tagSelectorModal.classList.add('active');
            }

            function renderTagSelector() {
                const customLabels = loadCustomLabels();
                const tokenLabels = loadTokenLabels();
                let targetTokens = [];
                if (tagSelectorTarget) targetTokens = [tagSelectorTarget];
                if (tagSelectorBatchTargets) targetTokens = tagSelectorBatchTargets;
                const existingLabels = new Set();
                targetTokens.forEach(token => {
                    (tokenLabels[token] || []).forEach(l => existingLabels.add(l));
                });
                if (customLabels.length === 0) {
                    tagSelectorBody.innerHTML =
                        '<div style="text-align:center;padding:20px;color:var(--text-secondary);font-size:13px;">暂无标签，请先在"标签管理"中创建</div>';
                    return;
                }
                let html = '<div class="tag-selector-list">';
                customLabels.forEach(label => {
                    const isSelected = existingLabels.has(label);
                    const color = getLabelColor(label);
                    html +=
                        `<span class="tag-selector-item ${isSelected ? 'selected' : ''}" data-label="${label}" style="${isSelected ? `border-color:${color};background:${color}15;color:${color};` : ''}"><span class="tag-dot" style="background:${color};"></span> ${label}</span>`;
                });
                html += '</div>';
                html +=
                    `<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;"><button class="copy-btn" id="tagSelectorCancelBtn">取消</button><button class="copy-btn positive-btn" id="tagSelectorConfirmBtn"><i class="fa-solid fa-check"></i> 确认</button></div>`;

            function renderSimilarityResults() {
                const threshold = parseFloat(thresholdSlider.value);
                const excludeCommon = excludeCommonCheckbox.checked;
                const results = calculateSimilarities(allImages, threshold, excludeCommon);
                if (results.length === 0) { similarityResults.innerHTML =
                        '<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;"><i class="fa-solid fa-check-circle" style="font-size:30px;opacity:0.4;display:block;margin-bottom:10px;"></i>没有找到超过阈值的相似图片对</div>';
                    return; }
                similarityResults.innerHTML = '';
                results.forEach(result => {
                    const pair = document.createElement('div');
                    pair.className = 'sim-pair';
                    const isHigh = result.similarity >= 0.6;
                    const imgA = result.imgA,
                        imgB = result.imgB;
                    const sameTokenSet = imgA.promptTokens.length === imgB.promptTokens.length && imgA.promptTokens
                        .every(t => imgB.promptTokens.includes(t)) && imgA.negativeTokens.length === imgB
                        .negativeTokens.length && imgA.negativeTokens.every(t => imgB.negativeTokens.includes(t));
                    let hasWeightDiff = false;
                    if (sameTokenSet) {
                        const wa = { ...(imgA.promptWeights || {}), ...(imgA.negativeWeights || {}) };
                        const wb = { ...(imgB.promptWeights || {}), ...(imgB.negativeWeights || {}) };
                        const allToks = new Set([...Object.keys(wa), ...Object.keys(wb)]);
                        allToks.forEach(tok => { if (Math.abs((wa[tok] ?? 1.0) - (wb[tok] ?? 1.0)) > 0.001)
                            hasWeightDiff = true; });
                    }
                    pair.innerHTML = `
                        <div class="sim-thumbs"><img src="${imgA.thumbnailDataURL}" data-id="${imgA.id}" title="${imgA.name}"><img src="${imgB.thumbnailDataURL}" data-id="${imgB.id}" title="${imgB.name}"></div>
                        <div class="sim-info"><div class="sim-score ${isHigh ? 'high' : ''}"><i class="fa-solid ${isHigh ? 'fa-triangle-exclamation' : 'fa-chart-line'}"></i> 相似度: ${(result.similarity * 100).toFixed(1)}%</div><div class="sim-common-tokens">共同词条: ${result.commonTokens.slice(0,8).join(', ')}${result.commonTokens.length > 8 ? '...' : ''}</div></div>
                        <div class="sim-actions">
                            <button class="sim-action-btn diff-btn" data-a="${imgA.id}" data-b="${imgB.id}"><i class="fa-solid fa-code-compare"></i> 差异</button>
                            ${hasWeightDiff ? `<button class="sim-action-btn weight-diff-btn" data-a="${imgA.id}" data-b="${imgB.id}"><i class="fa-solid fa-weight-scale"></i> 权重差异</button>` : ''}
                            <button class="sim-action-btn delete" data-id="${imgA.id}"><i class="fa-solid fa-trash"></i> 左</button>
                            <button class="sim-action-btn delete" data-id="${imgB.id}"><i class="fa-solid fa-trash"></i> 右</button>
                        </div>
                    `;
                    pair.querySelector('.diff-btn').addEventListener('click', () => { const a = allImages.find(i =>
                            i.id === imgA.id); const b = allImages.find(i => i.id === imgB.id); if (a && b)
                            openDiffModal(a, b); });
                    if (hasWeightDiff) pair.querySelector('.weight-diff-btn').addEventListener('click', () => {
                        const a = allImages.find(i => i.id === imgA.id); const b = allImages.find(i => i.id ===
                            imgB.id); if (a && b) openWeightDiffModal(a, b); });
                    pair.querySelectorAll('.sim-thumbs img').forEach(el => el.addEventListener('click', () =>
                        openDetail(el.dataset.id)));
                    pair.querySelectorAll('.sim-action-btn.delete').forEach(btn => btn.addEventListener('click', () => {
                        deleteImage(btn.dataset.id);
                        setTimeout(renderSimilarityResults, 300); }));
                    similarityResults.appendChild(pair);
                });
            }

            async function downloadSelected(withMeta) {
                if (selectedIds.size === 0) { showToast('请先选择图片', 'error'); return; }
                const images = allImages.filter(img => selectedIds.has(img.id));
                for (const img of images) {
                    try {
                        if (withMeta) downloadBlob(img.fileBlob, img.name);
                        else {
                            if (img.fileBlob.type === 'image/png') {
                                const noMetaBlob = await removePNGMetadata(img.fileBlob);
                                downloadBlob(noMetaBlob, img.name);
                            } else downloadBlob(img.fileBlob, img.name);
                        }

                }

            // ==================== 导出词条功能 ====================
            const SUGGESTED_CATEGORIES = [
                '画师', '质量词', '画风', '场景', '绘画主体', '动作',
                '表情', '服装', '发型/发色', '眼睛', '姿势', '构图',

            function buildExportMarkdown() {
                const exportType = document.querySelector('input[name="exportType"]:checked')?.value || 'all';
                const includeExisting = document.getElementById('exportIncludeExisting')?.checked ?? true;
                const tokenLabels = loadTokenLabels();

                const positiveEntries = Object.entries(tokenStats.positive).sort((a, b) => b[1] - a[1]);
                const negativeEntries = Object.entries(tokenStats.negative).sort((a, b) => b[1] - a[1]);

                const buildTokenJson = (entries) => {
                    return entries.map(([token, count]) => {
                        const labels = tokenLabels[token] || [];
                        return { token, count, ...(includeExisting && labels.length > 0 ? { existingLabels: labels } : {}) };
                    });
                };

                const positiveJson = buildTokenJson(positiveEntries);
                const negativeJson = buildTokenJson(negativeEntries);

                let markdown = '# AI绘画词条分类标注任务\n\n';
                markdown += '你是一个专业的AI绘画提示词分析助手。请根据以下词条列表，为每个词条分配最合适的分类标签。\n\n';

                markdown += '## 分类标签体系\n';
                SUGGESTED_CATEGORIES.forEach(cat => {
                    markdown += `- **${cat}**\n`;
                });
                markdown += '\n';

                markdown += '## 标注规则\n';
                markdown += '1. 每个词条可以分配1-3个标签\n';
                markdown += '2. 优先选择最核心的分类\n';
                markdown += '3. 如果词条不属于任何已有分类，标记为"其他"\n';
                markdown += '4. 请保持标签名称与上述分类标签完全一致\n';
                markdown += '5. 如果词条是具体人名/角色名，可标注为"画师"或"绘画主体"\n\n';

                if (includeExisting && Object.keys(tokenLabels).length > 0) {
                    markdown += '## 已有标签参考\n';
                    markdown += '以下部分词条已有标签，可作为标注风格参考：\n';
                    const existingEntries = Object.entries(tokenLabels).filter(([token]) => {
                        return (tokenStats.positive[token] || tokenStats.negative[token]);
                    });
                    if (existingEntries.length > 0) {
                        markdown += '```json\n';
                        markdown += JSON.stringify(Object.fromEntries(existingEntries.slice(0, 30)), null, 2);
                        markdown += '\n```\n\n';
                    }
                }

                if (exportType === 'all' || exportType === 'positive') {
                    markdown += '## 正向词条列表\n';
                    markdown += '```json\n';
                    markdown += JSON.stringify(positiveJson, null, 2);
                    markdown += '\n```\n\n';
                }

                if (exportType === 'all' || exportType === 'negative') {
                    markdown += '## 负向词条列表\n';
                    markdown += '```json\n';
                    markdown += JSON.stringify(negativeJson, null, 2);
                    markdown += '\n```\n\n';
                }

                markdown += '## 输出格式\n';
                markdown += '请只返回JSON，格式如下：\n';
                markdown += '```json\n';
                const outputExample = {};
                if (exportType === 'all' || exportType === 'positive') {
                    outputExample.positive = {
                        '示例词条1': ['标签1', '标签2'],
                        '示例词条2': ['标签1']
                    };
                }
                if (exportType === 'all' || exportType === 'negative') {
                    outputExample.negative = {
                        '示例词条1': ['标签1'],
                        '示例词条2': ['标签2']
                    };
                }
                markdown += JSON.stringify(outputExample, null, 2);
                markdown += '\n```\n\n';
                markdown += '不要包含任何解释或额外文本，只返回JSON。';

                return markdown;
            }

            importModalCloseBtn.addEventListener('click', closeImportModal);
            importModal.addEventListener('click', (e) => { if (e.target === importModal) closeImportModal(); });

            importLoadExampleBtn.addEventListener('click', () => {
                const tokenLabels = loadTokenLabels();
                const positiveTokens = Object.keys(tokenStats.positive).slice(0, 5);
                const negativeTokens = Object.keys(tokenStats.negative).slice(0, 3);
                const example = { positive: {}, negative: {} };
                positiveTokens.forEach((t, i) => {
                    example.positive[t] = [SUGGESTED_CATEGORIES[i % SUGGESTED_CATEGORIES.length],
                        SUGGESTED_CATEGORIES[(i + 3) % SUGGESTED_CATEGORIES.length]
                    ];
                });
                negativeTokens.forEach((t, i) => {
                    example.negative[t] = [SUGGESTED_CATEGORIES[(i + 6) % SUGGESTED_CATEGORIES.length]];
                });
                importJsonInput.value = JSON.stringify(example, null, 2);
                showToast('已加载示例JSON，请修改为AI实际返回内容', 'info');
            });

            importConfirmBtn.addEventListener('click', () => {
                const jsonText = importJsonInput.value.trim();
                if (!jsonText) {
                    showToast('请粘贴JSON内容', 'error');
                    return;
                }
                let parsed;
                try {
                    parsed = JSON.parse(jsonText);
                } catch (e) {
                    // 尝试提取JSON
                    const jsonMatch = jsonText.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        try { parsed = JSON.parse(jsonMatch[0]); } catch (e2) {
                            showToast('JSON格式无效，请检查', 'error');
                            return;
                        }
                    } else {
                        showToast('JSON格式无效，请检查', 'error');
                        return;
                    }
                }

                const overwrite = importOverwrite.checked;
                const autoCreateLabels = importAutoCreateLabels.checked;
                const tokenLabels = loadTokenLabels();
                let customLabels = loadCustomLabels();
                let appliedCount = 0;
                let newLabelCount = 0;
                let skippedCount = 0;

                const applyLabels = (token, labels) => {
                    if (!Array.isArray(labels) || labels.length === 0) return;
                    // 验证词条是否存在
                    const exists = tokenStats.positive[token] || tokenStats.negative[token];
                    if (!exists) { skippedCount++; return; }

                    const validLabels = labels.filter(l => typeof l === 'string' && l.trim() !== '').map(l => l
                        .trim());
                    if (validLabels.length === 0) { skippedCount++; return; }

                    // 自动创建新标签
                    if (autoCreateLabels) {
                        validLabels.forEach(l => {
                            if (!customLabels.includes(l)) {
                                customLabels.push(l);
                                newLabelCount++;
                            }
                        });
                    }

                    if (overwrite) {
                        tokenLabels[token] = [...validLabels];
                    } else {
                        if (!tokenLabels[token]) tokenLabels[token] = [];
                        validLabels.forEach(l => {
                            if (!tokenLabels[token].includes(l)) tokenLabels[token].push(l);
                        });
                    }
                    if (tokenLabels[token] && tokenLabels[token].length === 0) delete tokenLabels[token];
                    appliedCount++;
                };

                // 处理positive部分
                if (parsed.positive && typeof parsed.positive === 'object') {
                    for (const [token, labels] of Object.entries(parsed.positive)) {
                        applyLabels(token, labels);
                    }
                }
                // 处理negative部分
                if (parsed.negative && typeof parsed.negative === 'object') {
                    for (const [token, labels] of Object.entries(parsed.negative)) {
                        applyLabels(token, labels);
                    }
                }

                // 如果顶层直接是 token -> labels 格式（无positive/negative区分）
                if (!parsed.positive && !parsed.negative) {
                    for (const [token, labels] of Object.entries(parsed)) {
                        if (typeof labels === 'string') {
                            applyLabels(token, [labels]);
                        } else if (Array.isArray(labels)) {
                            applyLabels(token, labels);
                        }
                    }
                }

                // 保存
                saveTokenLabels(tokenLabels);
                if (autoCreateLabels) saveCustomLabels(customLabels);

                // 更新UI
                renderTagFilterBar();
                renderTokenList();

                if (appliedCount > 0) {
                    showToast(
                        `导入成功: ${appliedCount} 个词条已标注${newLabelCount > 0 ? `，新建 ${newLabelCount} 个标签` : ''}${skippedCount > 0 ? `，跳过 ${skippedCount} 个` : ''}`,
                        'success');
                    closeImportModal();
                } else {
                    showToast('没有有效数据被导入，请检查JSON格式', 'error');
                }
            });

            // ==================== 事件绑定 ====================
            uploadBtn.addEventListener('click', () => fileInput.click());
            uploadHintBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFiles(e.target.files);
                fileInput.value = ''; });
            document.getElementById('gallery').addEventListener('dragover', (e) => { e.preventDefault(); e
                .currentTarget.style.backgroundColor = '#eef1ff'; });
            document.getElementById('gallery').addEventListener('dragleave', (e) => { e.preventDefault(); e
                .currentTarget.style.backgroundColor = ''; });
            document.getElementById('gallery').addEventListener('drop', (e) => { e.preventDefault(); e.currentTarget
                    .style.backgroundColor = ''; if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

            clearFilterBtn.addEventListener('click', clearAllFilters);
            modalCloseBtn.addEventListener('click', closeDetail);
            detailModal.addEventListener('click', (e) => { if (e.target === detailModal) closeDetail(); });
            diffModalCloseBtn.addEventListener('click', closeDiffModal);
            diffModal.addEventListener('click', (e) => { if (e.target === diffModal) closeDiffModal(); });
            weightDiffCloseBtn.addEventListener('click', closeWeightDiffModal);
            weightDiffModal.addEventListener('click', (e) => { if (e.target === weightDiffModal) closeWeightDiffModal(); });

            tagManagerCloseBtn.addEventListener('click', closeTagManager);
            tagManagerModal.addEventListener('click', (e) => { if (e.target === tagManagerModal) closeTagManager(); });
            tagSelectorCloseBtn.addEventListener('click', closeTagSelector);
            tagSelectorModal.addEventListener('click', (e) => { if (e.target === tagSelectorModal) closeTagSelector(); });
            blockSettingsCloseBtn.addEventListener('click', closeBlockSettings);
            blockSettingsModal.addEventListener('click', (e) => { if (e.target === blockSettingsModal)
                closeBlockSettings(); });

            tokenLibraryBtn.addEventListener('click', openTokenSidebar);
            tokenSidebarClose.addEventListener('click', closeTokenSidebar);

            tabPositive.addEventListener('click', () => switchTokenTab('positive'));
            tabNegative.addEventListener('click', () => switchTokenTab('negative'));
            tabBlocked.addEventListener('click', () => switchTokenTab('blocked'));

            function switchTokenTab(tab) {
                currentTokenTab = tab;
                document.querySelectorAll('.token-tab').forEach(btn => btn.classList.remove('active'));
                document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
                if (tab === 'blocked' && batchLabelMode) {
                    toggleBatchLabelMode();
                }
                if (tab === 'blocked') {
                    tagFilterBar.style.display = 'none';
                } else {
                    tagFilterBar.style.display = 'flex';
                    renderTagFilterBar();
                }
                if (tab !== 'blocked') {
                    currentTokenDetail = null;
                    tokenWeightBar.style.display = 'none';
                }
                renderTokenList();
            }

            tokenSearchInput.addEventListener('input', renderTokenList);

            tagManageBtn.addEventListener('click', openTagManager);
            batchLabelBtn.addEventListener('click', toggleBatchLabelMode);
            batchSelectAllBtn.addEventListener('click', () => {
                const stats = currentTokenTab === 'positive' ? tokenStats.positive : tokenStats.negative;
                const tokenLabels = loadTokenLabels();
                let entries = Object.entries(stats);
                if (activeTagFilters.length > 0) {
                    entries = entries.filter(([token]) => {
                        const labels = tokenLabels[token] || [];
                        return activeTagFilters.every(l => labels.includes(l));
                    });
                }
                const searchTerm = tokenSearchInput.value.trim().toLowerCase();
                if (searchTerm) {
                    entries = entries.filter(([token]) => {
                        const labels = tokenLabels[token] || [];
                        return token.toLowerCase().includes(searchTerm) || labels.some(l => l.toLowerCase()
                            .includes(searchTerm));
                    });
                }
                entries.forEach(([token]) => batchSelectedTokens.add(token));
                renderTokenList();
            });
            batchDeselectAllBtn.addEventListener('click', () => {
                batchSelectedTokens.clear();
                renderTokenList();
            });
            batchApplyLabelBtn.addEventListener('click', openTagSelectorForBatch);

            similarityBtn.addEventListener('click', openSimilarity);
            similarityCloseBtn.addEventListener('click', closeSimilarity);
            similarityOverlay.addEventListener('click', (e) => { if (e.target === similarityOverlay)
                closeSimilarity(); });
            thresholdSlider.addEventListener('input', () => { thresholdValue.textContent = parseFloat(thresholdSlider
                    .value).toFixed(2);
                renderSimilarityResults(); });
            excludeCommonCheckbox.addEventListener('change', renderSimilarityResults);

            downloadModeBtn.addEventListener('click', toggleSelectionMode);
            downloadWithMetaBtn.addEventListener('click', () => downloadSelected(true));
            downloadNoMetaBtn.addEventListener('click', () => downloadSelected(false));
            deleteSelectedBtn.addEventListener('click', deleteSelectedImages);
            deleteDuplicatesBtn.addEventListener('click', deleteDuplicateImages);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (detailModal.classList.contains('active')) closeDetail();
                    if (diffModal.classList.contains('active')) closeDiffModal();
                    if (weightDiffModal.classList.contains('active')) closeWeightDiffModal();
                    if (similarityOverlay.classList.contains('active')) closeSimilarity();
                    if (tokenSidebar.classList.contains('active')) closeTokenSidebar();
                    if (tagManagerModal.classList.contains('active')) closeTagManager();
                    if (tagSelectorModal.classList.contains('active')) closeTagSelector();
                    if (blockSettingsModal.classList.contains('active')) closeBlockSettings();
                    if (exportModal.classList.contains('active')) closeExportModal();
                    if (importModal.classList.contains('active')) closeImportModal();
                }
            });

            // ==================== 删除重复图片 ====================
            async function deleteDuplicateImages() {
                const groups = new Map();
                allImages.forEach(img => {
                    const key = JSON.stringify({ p: img.prompt, n: img.negativePrompt, seed: img.seed,
                        steps: img.steps, sampler: img.sampler, scale: img.scale });
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push(img);
                });
                let deleteCount = 0;
                groups.forEach(imgs => { if (imgs.length > 1) deleteCount += imgs.length - 1; });
                if (deleteCount === 0) { showToast('没有发现重复元数据图片', 'info'); return; }
                if (!confirm(`发现 ${deleteCount} 张重复图片，将删除重复项（保留每组最早一张），确定？`)) return;
                let deleted = 0;
                for (const imgs of groups.values()) {
                    if (imgs.length > 1) {
                        imgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                        for (const img of imgs.slice(1)) {
                            try { await dbDeleteImage(img.id);
                                deleted++; } catch (e) { console.error(e); }
                        }
                    }
                }
                showToast(`已删除 ${deleted} 张重复图片`, 'success');
                await loadAllImages();
            }

            // ==================== 初始化 ====================
            (async function init() {
                await loadAllImages();
                if (allImages.length > 0) { galleryEmpty.style.display = 'none';
                    galleryGrid.style.display = 'grid'; }
            })().catch(err => { console.error(err);
                showToast('初始化失败', 'error'); });
        })();
    </script>
</body>
</html>
